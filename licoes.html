<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aprende+ | Unidades</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      font-size: 25px;

    }

    .curso-info h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .curso-info p {
      color: #6b7280;
      font-size: 13px;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: .2s;
    }

    .btn:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-warning {
      background: #f59e0b;
      color: #fff;
    }

    .btn-success {
      background: #16a34a;
      color: #fff;
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 12px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      font-size: 25px;
    }

    .top-bar p {
      margin-top: 5px;
      color: #6b7280;
      font-size: 14px;
    }

    .search {
      margin-bottom: 20px;
    }

    .search input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: #fff;
      padding: 13px 15px;
      font-size: 14px;
      outline: none;
    }

    .search input:focus {
      border-color: #2563eb;
    }

    .mensagem {
      display: none;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 700;
    }

    .mensagem.sucesso {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .mensagem.erro {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .loading,
    .erro {
      background: #fff;
      border-radius: 12px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    #erroAcesso {
      display: none;
    }

    #conteudo {
      display: none;
    }

    .lista {
      display: grid;
      gap: 15px;
    }

    .unidade {
      background: #fff;
      border: 1px solid #eef0f4;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .unidade-topo {
      display: flex;
      align-items: flex-start;
      gap: 15px;
    }

    .numero {
      width: 44px;

      height: 44px;
      border-radius: 50%;
      background: #dbeafe;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .unidade-info {
      flex: 1;
    }

    .unidade-info h3 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .unidade-info p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 800;
    }

    .status.ativo {
      background: #dcfce7;
      color: #166534;
    }

    .status.inativo {
      background: #fee2e2;
      color: #991b1b;
    }

    .acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #eef0f4;
    }

    .vazio {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      color: #6b7280;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.5);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.aberto {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 14px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 21px;
    }

    .fechar {
      border: 0;
      background: transparent;
      color: #6b7280;
      cursor: pointer;
      font-size: 28px;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .campo input,
    .campo textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
    }

    .campo textarea {
      min-height: 100px;
      resize: vertical;
    }

    .campo input:focus,
    .campo textarea:focus {
      border-color: #2563eb;
    }

    .modal-acoes {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    @media (max-width: 700px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .unidade-topo {
        flex-direction: column;
      }

      .acoes {
        flex-direction: column;
      }

      .acoes button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="header-left">

    <div class="logo">
      Aprende+
    </div>

    <div class="curso-info">
      <h1 id="nomeCurso">Carregando curso...</h1>
      <p>Gerenciamento de unidades</p>
    </div>

  </div>

  <button
    class="btn btn-secondary"
    id="btnVoltar">
    ← Voltar para cursos
  </button>

</header>


<main>

  <div
    id="loading"
    class="loading">

    Carregando informações do curso...

  </div>


  <div
    id="erroAcesso"
    class="erro">

    <h2>Não foi possível carregar</h2>

    <p
      id="textoErro"
      style="margin-top:10px;">
    </p>

    <button
      class="btn btn-secondary"
      id="btnErroVoltar"
      style="margin-top:20px;">

      Voltar

    </button>

  </div>


  <section id="conteudo">

    <div class="top-bar">

        </p>

    <div

    </div>


    <div class="search">

      <input
        type="text"

    </div>


    <div
      id="lista"

    </div>

  </section>

</main>


<!-- MODAL -->

<div
  id="modal"
  class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="tituloModal">
        Nova Unidade
      </h2>

      <button
        class="fechar"
        id="btnFecharModal">

        ×

      </button>

    </div>


    <form id="formUnidade">

      <div class="campo">

        <label for="nome">
          Nome da unidade
        </label>

        <input
          type="text"
          id="nome"
          maxlength="150"
          placeholder="Ex.: Saudações e apresentações"
          required>

      </div>


      <div class="campo">

        <label for="descricao">
          Descrição
        </label>

        <textarea
          id="descricao"
          maxlength="500"
          placeholder="Descrição da unidade...">
        </textarea>

      </div>


      <div class="campo">

        <label for="ordem">
          Ordem
        </label>

        <input
          type="number"
          id="ordem"
          min="1"
          value="1"
          required>

      </div>


      <div class="modal-acoes">

        <button
          type="button"
          class="btn btn-secondary"
          id="btnCancelar">

          Cancelar

        </button>

        <button
          type="submit"
          class="btn btn-primary">

          Salvar Unidade

        </button>

      </div>

    </form>

  </div>

</div>


<script type="module">

  // ============================================================
  // FIREBASE
  // CONFIGURAÇÃO OFICIAL DO APRENDE+
  // NÃO ALTERAR
  // ============================================================

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


 const firebaseConfig = {
  apiKey: "AIzaSyC4AAbC8vCFAmlPlur12Nm7YBKPjaSjumM",
  authDomain: "meuappweb-65522.firebaseapp.com",
  projectId: "meuappweb-65522",
  storageBucket: "meuappweb-65522.firebasestorage.app",
  messagingSenderId: "305368794616",
  appId: "1:305368794616:web:3199c6836a986d896ac20d",
  measurementId: "G-QN7GFD99N0"
};


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  // ============================================================
  // ELEMENTOS
  // ============================================================

  const loading =
    document.getElementById("loading");

  const erroAcesso =
    document.getElementById("erroAcesso");

  const textoErro =
    document.getElementById("textoErro");

  const conteudo =
    document.getElementById("conteudo");

  const nomeCurso =
    document.getElementById("nomeCurso");

  const lista =
    document.getElementById("lista");

  const pesquisa =
    document.getElementById("pesquisa");

  const mensagem =
    document.getElementById("mensagem");

  const modal =
    document.getElementById("modal");

  const tituloModal =
    document.getElementById("tituloModal");

  const formUnidade =
    document.getElementById("formUnidade");

  const campoNome =
    document.getElementById("nome");

  const campoDescricao =
    document.getElementById("descricao");

  const campoOrdem =
    document.getElementById("ordem");


  // ============================================================
  // LER ID DO CURSO
  //
  // URL ESPERADA:
  //
  // unidades.html?id=ID_DO_CURSO
  //
  // ============================================================

  const parametros =
    new URLSearchParams(
      window.location.search
    );

  let cursoId =
    parametros.get("id");


  if (cursoId) {

    cursoId =
      cursoId.trim();

  }


  console.log("================================");
  console.log("UNIDADES - URL:", window.location.href);
  console.log("UNIDADES - SEARCH:", window.location.search);
  console.log("UNIDADES - cursoId:", cursoId);
  console.log("================================");


  // ============================================================
  // VARIÁVEIS
  // ============================================================

  let cursoAtual = null;

  let unidades = [];

  let unidadeEditando = null;


  // ============================================================
  // ESCAPAR HTML
  // ============================================================

  function escapar(valor) {

    if (
      valor === null ||
      valor === undefined
    ) {
      return "";
    }

    return String(valor)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // ============================================================
  // MENSAGEM
  // ============================================================

  function mostrarMensagem(
    texto,
    tipo = "sucesso"
  ) {

    mensagem.textContent =
      texto;

    mensagem.className =
      "mensagem " + tipo;

    setTimeout(() => {

      mensagem.textContent = "";

      mensagem.className =
        "mensagem";

    }, 3500);

  }


  // ============================================================
  // ERRO
  // ============================================================

  function mostrarErro(texto) {

    loading.style.display =
      "none";

    conteudo.style.display =
      "none";

    erroAcesso.style.display =
      "block";

    textoErro.textContent =
      texto;

  }


  // ============================================================
  // MODAL
  // ============================================================

  function abrirModal() {

    modal.classList.add(
      "aberto"
    );

  }


  function fecharModal() {

    modal.classList.remove(
      "aberto"
    );

    formUnidade.reset();

    campoOrdem.value =
      1;

    unidadeEditando =
      null;

    tituloModal.textContent =
      "Nova Unidade";

  }


  // ============================================================
  // CARREGAR CURSO
  // ============================================================

  async function carregarCurso() {

    if (!cursoId) {

      mostrarErro(
        "O ID do curso não foi informado na URL."
      );

      return false;

    }


    try {

      const referencia =
        doc(
          db,
          "cursos",
          cursoId
        );


      const snapshot =
        await getDoc(
          referencia
        );


      if (!snapshot.exists()) {

        mostrarErro(
          "O curso informado não foi encontrado."
        );

        return false;

      }


      cursoAtual = {

        id: snapshot.id,

        ...snapshot.data()

      };


      nomeCurso.textContent =
        cursoAtual.nome ||
        "Curso sem nome";


      console.log(
        "UNIDADES - Curso carregado:",
        cursoAtual
      );


      return true;

    } catch (erro) {

      console.error(
        "UNIDADES - Erro ao carregar curso:",
        erro
      );

      mostrarErro(
        "Não foi possível carregar o curso."
      );

      return false;

    }

  }


  // ============================================================
  // CARREGAR UNIDADES
  // ============================================================

  async function carregarUnidades() {

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "unidades"
          )
        );


      unidades = [];


      snapshot.forEach(
        (item) => {

          const dados =
            item.data();


          if (
            dados.cursoId === cursoId
          ) {

            unidades.push({

              id: item.id,

              ...dados

            });

          }

        }
      );


      unidades.sort(
        (a, b) =>
          Number(a.ordem || 0) -
          Number(b.ordem || 0)
      );


      console.log(
        "UNIDADES - Unidades encontradas:",
        unidades.length
      );


      renderizar();

    } catch (erro) {

      console.error(
        "UNIDADES - Erro ao carregar unidades:",
        erro
      );

      mostrarMensagem(
        "Erro ao carregar as unidades.",
        "erro"
      );

    }

  }


  // ============================================================
  // RENDERIZAR
  // ============================================================

  function renderizar() {

    const termo =
      pesquisa.value
        .trim()
        .toLowerCase();


    const filtradas =
      unidades.filter(
        (unidade) => {

          const nome =
            String(
              unidade.nome || ""
            ).toLowerCase();


          const descricao =
            String(
              unidade.descricao || ""
            ).toLowerCase();


          return (
            nome.includes(termo) ||
            descricao.includes(termo)
          );

        }
      );


    if (
      filtradas.length === 0
    ) {

      lista.innerHTML = `

        <div class="vazio">

          <h3>
            Nenhuma unidade encontrada
          </h3>

          <p style="margin-top:8px;">
            Cadastre uma unidade para começar.
          </p>

        </div>

      `;

      return;

    }


    lista.innerHTML =
      filtradas.map(
        (unidade, indice) => {

          const ativo =
            unidade.ativo !== false;


          return `

            <div class="unidade">

              <div class="unidade-topo">

                <div class="numero">

                  ${Number(
                    unidade.ordem ||
                    indice + 1
                  )}

                </div>


                <div class="unidade-info">

                  <h3>
                    ${escapar(
                      unidade.nome
                    )}
                  </h3>

                  <p>
                    ${escapar(
                      unidade.descricao ||
                      "Sem descrição."
                    )}
                  </p>

                  <span
                    class="status ${
                      ativo
                        ? "ativo"
                        : "inativo"
                    }">

                    ${
                      ativo
                        ? "ATIVA"
                        : "INATIVA"
                    }

                  </span>

                </div>

              </div>


              <div class="acoes">

                <button
                  class="btn btn-primary btn-small"
                  data-acao="licoes"
                  data-id="${escapar(
                    unidade.id
                  )}">

                  📚 Lições

                </button>


                <button
                  class="btn btn-warning btn-small"
                  data-acao="editar"
                  data-id="${escapar(
                    unidade.id
                  )}">

                  ✏️ Editar

                </button>


                <button
                  class="btn ${
                    ativo
                      ? "btn-secondary"
                      : "btn-success"
                  } btn-small"
                  data-acao="status"
                  data-id="${escapar(
                    unidade.id
                  )}">

                  ${
                    ativo
                      ? "⏸️ Desativar"
                      : "▶️ Ativar"
                  }

                </button>


                <button
                  class="btn btn-danger btn-small"
                  data-acao="excluir"
                  data-id="${escapar(
                    unidade.id
                  )}">

                  🗑️ Excluir

                </button>

              </div>

            </div>

          `;

        }
      ).join("");

  }


  // ============================================================
  // CLIQUE NAS AÇÕES
  // ============================================================

  lista.addEventListener(
    "click",
    async (evento) => {

      const botao =
        evento.target.closest(
          "button[data-acao]"
        );


      if (!botao) {
        return;
      }


      const acao =
        botao.dataset.acao;


      const id =
        botao.dataset.id;


      const unidade =
        unidades.find(
          item =>
            item.id === id
        );


      if (!unidade) {

        console.error(
          "UNIDADES - Unidade não encontrada:",
          id
        );

        return;

      }


      // ========================================================
      // LIÇÕES
      // ========================================================

      if (
        acao === "licoes"
      ) {

        console.log(
          "================================"
        );

        console.log(
          "UNIDADES - CLIQUE EM LIÇÕES"
        );

        console.log(
          "UNIDADES - cursoId:",
          cursoId
        );

        console.log(
          "UNIDADES - unidadeId:",
          id
        );


        if (!cursoId) {

          alert(
            "Erro: cursoId não encontrado."
          );

          return;

        }


        if (!id) {

          alert(
            "Erro: unidadeId não encontrado."
          );

          return;

        }


        // ------------------------------------------------------
        // CRIA OS PARÂMETROS DE FORMA SEGURA
        // ------------------------------------------------------

        const parametrosLicoes =
          new URLSearchParams();


        parametrosLicoes.set(
          "cursoId",
          cursoId
        );


        parametrosLicoes.set(
          "unidadeId",
          id
        );


        const queryString =
          parametrosLicoes.toString();


        const urlLicoes =
          "./licoes.html?" +
          queryString;


        console.log(
          "UNIDADES - queryString:",
          queryString
        );

        console.log(
          "UNIDADES - URL FINAL:",
          urlLicoes
        );

        console.log(
          "================================"
        );


        // ------------------------------------------------------
        // ABRIR LIÇÕES
        // ------------------------------------------------------

        window.location.assign(
          urlLicoes
        );


        return;

      }


      // ========================================================
      // EDITAR
      // ========================================================

      if (
        acao === "editar"
      ) {

        unidadeEditando =
          unidade;


        campoNome.value =
          unidade.nome || "";


        campoDescricao.value =
          unidade.descricao || "";


        campoOrdem.value =
          unidade.ordem || 1;


        tituloModal.textContent =
          "Editar Unidade";


        abrirModal();


        return;

      }


      // ========================================================
      // STATUS
      // ========================================================

      if (
        acao === "status"
      ) {

        try {

          const novoStatus =
            unidade.ativo === false;


          await updateDoc(
            doc(
              db,
              "unidades",
              id
            ),
            {
              ativo: novoStatus,
              atualizadoEm:
                serverTimestamp()
            }
          );


          unidade.ativo =
            novoStatus;


          renderizar();


          mostrarMensagem(
            novoStatus
              ? "Unidade ativada com sucesso."
              : "Unidade desativada com sucesso."
          );


        } catch (erro) {

          console.error(
            "UNIDADES - Erro no status:",
            erro
          );


          mostrarMensagem(
            "Não foi possível alterar o status.",
            "erro"
          );

        }


        return;

      }


      // ========================================================
      // EXCLUIR
      // ========================================================

      if (
        acao === "excluir"
      ) {

        const confirmar =
          confirm(
            `Deseja realmente excluir a unidade "${unidade.nome}"?`
          );


        if (!confirmar) {
          return;
        }


        try {

          await deleteDoc(
            doc(
              db,
              "unidades",
              id
            )
          );


          unidades =
            unidades.filter(
              item =>
                item.id !== id
            );


          renderizar();


          mostrarMensagem(
            "Unidade excluída com sucesso."
          );


        } catch (erro) {

          console.error(
            "UNIDADES - Erro ao excluir:",
            erro
          );


          mostrarMensagem(
            "Não foi possível excluir a unidade.",
            "erro"
          );

        }

      }

    }
  );


  // ============================================================
  // NOVA UNIDADE
  // ============================================================

  document
    .getElementById(
      "btnNovaUnidade"
    )
    .addEventListener(
      "click",
      () => {

        unidadeEditando =
          null;


        formUnidade.reset();


        const maiorOrdem =
          unidades.reduce(
            (
              maior,
              unidade
            ) =>
              Math.max(
                maior,
                Number(
                  unidade.ordem || 0
                )
              ),
            0
          );


        campoOrdem.value =
          maiorOrdem + 1;


        tituloModal.textContent =
          "Nova Unidade";


        abrirModal();

      }
    );


  // ============================================================
  // SALVAR
  // ============================================================

  formUnidade.addEventListener(
    "submit",
    async (evento) => {

      evento.preventDefault();


      const nome =
        campoNome.value.trim();


      const descricao =
        campoDescricao.value.trim();


      const ordem =
        Number(
          campoOrdem.value
        );


      if (!nome) {

        mostrarMensagem(
          "Informe o nome da unidade.",
          "erro"
        );

        return;

      }


      if (
        !ordem ||
        ordem < 1
      ) {

        mostrarMensagem(
          "Informe uma ordem válida.",
          "erro"
        );

        return;

      }


      try {

        // ======================================================
        // EDITAR
        // ======================================================

        if (unidadeEditando) {

          await updateDoc(
            doc(
              db,
              "unidades",
              unidadeEditando.id
            ),
            {
              nome: nome,
              descricao: descricao,
              ordem: ordem,
              atualizadoEm:
                serverTimestamp()
            }
          );


          const indice =
            unidades.findIndex(
              item =>
                item.id ===
                unidadeEditando.id
            );


          if (indice !== -1) {

            unidades[indice] = {

              ...unidades[indice],

              nome: nome,

              descricao: descricao,

              ordem: ordem

            };

          }


          mostrarMensagem(
            "Unidade atualizada com sucesso."
          );


        } else {

          // ====================================================
          // NOVA UNIDADE
          // ====================================================

          const novaUnidade = {

            cursoId: cursoId,

            cursoNome:
              cursoAtual.nome || "",

            nome: nome,

            descricao: descricao,

            ativo: true,

            ordem: ordem,

            criadoEm:
              serverTimestamp(),

            atualizadoEm:
              serverTimestamp()

          };


          const referencia =
            await addDoc(
              collection(
                db,
                "unidades"
              ),
              novaUnidade
            );


          unidades.push({

            id: referencia.id,

            ...novaUnidade

          });


          mostrarMensagem(
            "Unidade criada com sucesso."
          );

        }


        unidades.sort(
          (a, b) =>
            Number(a.ordem || 0) -
            Number(b.ordem || 0)
        );


        fecharModal();


        renderizar();


      } catch (erro) {

        console.error(
          "UNIDADES - Erro ao salvar:",
          erro
        );


        mostrarMensagem(
          "Não foi possível salvar a unidade.",
          "erro"
        );

      }

    }
  );


  // ============================================================
  // PESQUISA
  // ============================================================

  pesquisa.addEventListener(
    "input",
    renderizar
  );


  // ============================================================
  // FECHAR MODAL
  // ============================================================

  document
    .getElementById(
      "btnFecharModal"
    )
    .addEventListener(
      "click",
      fecharModal
    );


  document
    .getElementById(
      "btnCancelar"
    )
    .addEventListener(
      "click",
      fecharModal
    );


  modal.addEventListener(
    "click",
    (evento) => {

      if (
        evento.target === modal
      ) {

        fecharModal();

      }

    }
  );


  // ============================================================
  // VOLTAR
  // ============================================================

  function voltarCursos() {

    window.location.assign(
      "./admin.html"
    );

  }


  document
    .getElementById(
      "btnVoltar"
    )
    .addEventListener(
      "click",
      voltarCursos
    );


  document
    .getElementById(
      "btnErroVoltar"
    )
    .addEventListener(
      "click",
      voltarCursos
    );


  // ============================================================
  // AUTENTICAÇÃO
  // ============================================================

  onAuthStateChanged(
    auth,
    async (usuario) => {

      console.log(
        "UNIDADES - authStateChanged:",
        usuario
          ? usuario.uid
          : null
      );


      if (!usuario) {

        window.location.assign(
          "./login.html"
        );

        return;

      }


      try {

        const referenciaUsuario =
          doc(
            db,
            "users",
            usuario.uid
          );


        const snapshotUsuario =
          await getDoc(
            referenciaUsuario
          );


        if (
          !snapshotUsuario.exists()
        ) {

          mostrarErro(
            "Seu perfil de usuário não foi encontrado."
          );

          return;

        }


        const dadosUsuario =
          snapshotUsuario.data();


        console.log(
          "UNIDADES - Usuário:",
          dadosUsuario
        );


        if (
          dadosUsuario.tipo !== "admin" ||
          dadosUsuario.ativo === false
        ) {

          mostrarErro(
            "Você não possui permissão para acessar esta página."
          );

          return;

        }


        const cursoCarregado =
          await carregarCurso();


        if (!cursoCarregado) {
          return;
        }


        await carregarUnidades();


        loading.style.display =
          "none";


        erroAcesso.style.display =
          "none";


        conteudo.style.display =
          "block";


      } catch (erro) {

        console.error(
          "UNIDADES - Erro na inicialização:",
          erro
        );


        mostrarErro(
          "Ocorreu um erro ao carregar a página."
        );

      }

    }
  );

</script>
