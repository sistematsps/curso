<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Resultado da Lição</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#1f2937;
    min-height:100vh;
}

header{
    background:#4f46e5;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

header h1{
    font-size:22px;
}

.header-direita{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.saldo{
    background:rgba(255,255,255,.15);
    padding:9px 13px;
    border-radius:10px;
    font-weight:bold;
}

.btn{
    border:0;
    border-radius:10px;
    padding:11px 16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-carteira{
    background:white;
    color:#4f46e5;
}

.btn-sair{
    background:#ef4444;
    color:white;
}

.container{
    width:100%;
    max-width:800px;
    margin:auto;
    padding:30px 15px 60px;
}

.resultado{
    background:white;
    border-radius:22px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 6px 25px rgba(0,0,0,.08);
}

.icone{
    font-size:75px;
    margin-bottom:15px;
}

.titulo{
    font-size:30px;
    margin-bottom:10px;
}

.subtitulo{
    color:#6b7280;
    line-height:1.5;
    margin-bottom:25px;
}

.aprovado{
    color:#16a34a;
}

.reprovado{
    color:#dc2626;
}

.percentual{
    font-size:58px;
    font-weight:bold;
    margin:15px 0;
}

.nota{
    color:#6b7280;
    margin-bottom:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:25px 0;
}

.card{
    background:#f8fafc;
    border-radius:15px;
    padding:18px 10px;
}

.card .emoji{
    font-size:27px;
}

.card strong{
    display:block;
    font-size:24px;
    margin-top:7px;
}

.card span{
    display:block;
    font-size:12px;
    color:#6b7280;
    margin-top:4px;
}

.mensagem{
    background:#eef2ff;
    color:#3730a3;
    border-radius:12px;
    padding:14px;
    margin:20px 0;
    line-height:1.5;
}

.botoes{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:25px;
}

.btn-principal{
    background:#4f46e5;
    color:white;
    min-width:180px;
}

.btn-secundario{
    background:#e5e7eb;
    color:#374151;
    min-width:180px;
}

.btn-principal:hover,
.btn-secundario:hover,
.btn-carteira:hover,
.btn-sair:hover{
    opacity:.9;
}

.detalhes{
    margin-top:25px;
    text-align:left;
    border-top:1px solid #eee;
    padding-top:20px;
}

.detalhes h3{
    margin-bottom:12px;
}

.detalhe{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:9px 0;
    border-bottom:1px solid #f1f1f1;
    color:#6b7280;
}

.detalhe strong{
    color:#1f2937;
}

.loading{
    text-align:center;
    padding:50px;
    color:#6b7280;
}

.erro{
    background:#fee2e2;
    color:#991b1b;
    padding:18px;
    border-radius:12px;
}

@media(max-width:600px){

    .resultado{
        padding:30px 18px;
    }

    .titulo{
        font-size:25px;
    }

    .percentual{
        font-size:48px;
    }

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .card:last-child{
        grid-column:1 / -1;
    }

}
</style>
</head>

<body>

<header>

    <h1>🎓 Área do Aluno</h1>

    <div class="header-direita">

        <div class="saldo">
            ❤️ <span id="vidas">-</span>
            &nbsp;&nbsp;
            🪙 <span id="moedas">-</span>
            &nbsp;&nbsp;
            ⭐ <span id="xp">-</span>
        </div>

        <button
            class="btn btn-carteira"
            onclick="abrirCarteira()">
            💰 Carteira
        </button>

        <button
            class="btn btn-sair"
            onclick="sair()">
            Sair
        </button>

    </div>

</header>


<div class="container">

    <div id="loading" class="loading">
        Carregando resultado...
    </div>


    <div
        id="resultado"
        class="resultado"
        style="display:none;">

        <div
            id="icone"
            class="icone">
            🏆
        </div>


        <h2
            id="titulo"
            class="titulo">
            Lição concluída!
        </h2>


        <p
            id="subtitulo"
            class="subtitulo">
        </p>


        <div
            id="percentual"
            class="percentual">
            0%
        </div>


        <div
            id="nota"
            class="nota">
            0 de 0 questões corretas
        </div>


        <div class="cards">

            <div class="card">

                <div class="emoji">
                    ⭐
                </div>

                <strong id="xpGanho">
                    +0
                </strong>

                <span>
                    XP ganho
                </span>

            </div>


            <div class="card">

                <div class="emoji">
                    🪙
                </div>

                <strong id="moedasGanhas">
                    +0
                </strong>

                <span>
                    Moedas
                </span>

            </div>


            <div class="card">

                <div class="emoji">
                    ❤️
                </div>

                <strong id="vidasAtual">
                    0
                </strong>

                <span>
                    Vidas restantes
                </span>

            </div>

        </div>


        <div
            id="mensagem"
            class="mensagem">
        </div>


        <div class="detalhes">

            <h3>
                📊 Detalhes
            </h3>

            <div class="detalhe">

                <span>
                    Curso
                </span>

                <strong id="cursoNome">
                    -
                </strong>

            </div>


            <div class="detalhe">

                <span>
                    Lição
                </span>

                <strong id="licaoNome">
                    -
                </strong>

            </div>


            <div class="detalhe">

                <span>
                    Acertos
                </span>

                <strong id="acertos">
                    0
                </strong>

            </div>


            <div class="detalhe">

                <span>
                    Erros
                </span>

                <strong id="erros">
                    0
                </strong>

            </div>


            <div class="detalhe">

                <span>
                    Aproveitamento mínimo
                </span>

                <strong>
                    60%
                </strong>

            </div>

        </div>


        <div class="botoes">

            <button
                id="btnContinuar"
                class="btn btn-principal"
                onclick="continuar()">
                📚 Continuar curso
            </button>

            <button
                class="btn btn-secundario"
                onclick="refazer()">
                🔄 Refazer lição
            </button>

        </div>

    </div>


    <div
        id="erro"
        class="erro"
        style="display:none;">
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",
    authDomain: "dezenas-1ed47.firebaseapp.com",
    projectId: "dezenas-1ed47",
    storageBucket: "dezenas-1ed47.firebasestorage.app",
    messagingSenderId: "372788277555",
    appId: "1:372788277555:web:1c1a6a80adee1722b54e46",
    measurementId: "G-NMPP8PKPK3"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================================================
   PARÂMETROS
========================================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const cursoId =
    parametros.get("cursoId");

const moduloId =
    parametros.get("moduloId");

const licaoId =
    parametros.get("licaoId");


/* =========================================================
   AUTENTICAÇÃO
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "index.html";

            return;
        }


        try{

            await carregarUsuario(usuario.uid);

            await carregarResultado(usuario.uid);

        }catch(erro){

            console.error(erro);

            mostrarErro(
                "Não foi possível carregar o resultado."
            );

        }

    }
);


/* =========================================================
   USUÁRIO
========================================================= */

async function carregarUsuario(uid){

    const referencia =
        doc(
            db,
            "usuarios",
            uid
        );


    const snap =
        await getDoc(referencia);


    if(!snap.exists()){
        return;
    }


    const dados =
        snap.data();


    document.getElementById(
        "vidas"
    ).textContent =
        Number(
            dados.vidas ?? 0
        );


    document.getElementById(
        "moedas"
    ).textContent =
        Number(
            dados.moedas ?? 0
        );


    document.getElementById(
        "xp"
    ).textContent =
        Number(
            dados.xp ?? 0
        );

}


/* =========================================================
   RESULTADO
========================================================= */

async function carregarResultado(uid){

    if(!licaoId){

        throw new Error(
            "Lição não informada."
        );

    }


    const progressoId =
        uid + "_" + licaoId;


    const referencia =
        doc(
            db,
            "progresso",
            progressoId
        );


    const snap =
        await getDoc(referencia);


    if(!snap.exists()){

        throw new Error(
            "Resultado da lição não encontrado."
        );

    }


    const progresso =
        snap.data();


    let cursoNome =
        "Curso";


    let licaoNome =
        "Lição";


    if(cursoId){

        const cursoSnap =
            await getDoc(
                doc(
                    db,
                    "cursos",
                    cursoId
                )
            );


        if(cursoSnap.exists()){

            cursoNome =
                cursoSnap.data().titulo ||
                "Curso";

        }

    }


    if(licaoId){

        const licaoSnap =
            await getDoc(
                doc(
                    db,
                    "licoes",
                    licaoId
                )
            );


        if(licaoSnap.exists()){

            licaoNome =
                licaoSnap.data().titulo ||
                "Lição";

        }

    }


    const aproveitamento =
        Number(
            progresso.aproveitamento ?? 0
        );


    const aprovado =
        progresso.aprovado === true;


    const pontuacao =
        Number(
            progresso.pontuacao ?? 0
        );


    const total =
        Number(
            progresso.totalQuestoes ??
            0
        );


    const acertos =
        Number(
            progresso.acertos ??
            0
        );


    const erros =
        Number(
            progresso.erros ??
            Math.max(
                0,
                total - acertos
            )
        );


    /*
       XP e moedas são mostrados
       a partir do resultado salvo.
       Se não existirem nos documentos
       antigos, usamos 0.
    */

    const xpGanho =
        Number(
            progresso.xpGanho ?? 0
        );


    const moedasGanhas =
        Number(
            progresso.moedasGanhas ?? 0
        );


    document.getElementById(
        "cursoNome"
    ).textContent =
        cursoNome;


    document.getElementById(
        "licaoNome"
    ).textContent =
        licaoNome;


    document.getElementById(
        "percentual"
    ).textContent =
        Math.round(
            aproveitamento
        ) + "%";


    document.getElementById(
        "nota"
    ).textContent =
        `${acertos} de ${total} questões corretas`;


    document.getElementById(
        "acertos"
    ).textContent =
        acertos;


    document.getElementById(
        "erros"
    ).textContent =
        erros;


    document.getElementById(
        "xpGanho"
    ).textContent =
        "+" + xpGanho;


    document.getElementById(
        "moedasGanhas"
    ).textContent =
        "+" + moedasGanhas;


    if(aprovado){

        document.getElementById(
            "icone"
        ).textContent =
            "🏆";


        document.getElementById(
            "titulo"
        ).textContent =
            "Parabéns! Você foi aprovado!";


        document.getElementById(
            "titulo"
        ).className =
            "titulo aprovado";


        document.getElementById(
            "subtitulo"
        ).textContent =
            "Você concluiu esta lição com sucesso.";


        document.getElementById(
            "mensagem"
        ).textContent =
            "🎉 Continue assim! Cada lição concluída aumenta seu progresso no curso.";


        document.getElementById(
            "mensagem"
        ).style.background =
            "#dcfce7";


        document.getElementById(
            "mensagem"
        ).style.color =
            "#166534";


        document.getElementById(
            "btnContinuar"
        ).textContent =
            "📚 Continuar curso";


    }else{

        document.getElementById(
            "icone"
        ).textContent =
            "💪";


        document.getElementById(
            "titulo"
        ).textContent =
            "Quase lá!";


        document.getElementById(
            "titulo"
        ).className =
            "titulo reprovado";


        document.getElementById(
            "subtitulo"
        ).textContent =
            "Você precisa de pelo menos 60% para concluir esta lição.";


        document.getElementById(
            "mensagem"
        ).textContent =
            "💡 Revise o conteúdo e tente novamente. Você consegue!";


        document.getElementById(
            "mensagem"
        ).style.background =
            "#fef3c7";


        document.getElementById(
            "mensagem"
        ).style.color =
            "#92400e";


        document.getElementById(
            "btnContinuar"
        ).textContent =
            "📚 Voltar ao curso";

    }


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "resultado"
    ).style.display =
        "block";

}


/* =========================================================
   CONTINUAR
========================================================= */

window.continuar =
    function(){

        if(cursoId){

            window.location.href =
                "curso.html?cursoId=" +
                encodeURIComponent(
                    cursoId
                );

        }else{

            window.location.href =
                "cursos.html";

        }

    };


/* =========================================================
   REFAZER
========================================================= */

window.refazer =
    function(){

        if(
            cursoId &&
            moduloId &&
            licaoId
        ){

            window.location.href =
                "licao.html?" +
                "cursoId=" +
                encodeURIComponent(cursoId) +
                "&moduloId=" +
                encodeURIComponent(moduloId) +
                "&licaoId=" +
                encodeURIComponent(licaoId);

        }else{

            window.location.href =
                "cursos.html";

        }

    };


/* =========================================================
   CARTEIRA
========================================================= */

window.abrirCarteira =
    function(){

        window.location.href =
            "carteira.html";

    };


/* =========================================================
   SAIR
========================================================= */

window.sair =
    async function(){

        try{

            await signOut(auth);

            window.location.href =
                "index.html";

        }catch(erro){

            console.error(erro);

            alert(
                "Não foi possível sair."
            );

        }

    };


/* =========================================================
   ERRO
========================================================= */

function mostrarErro(texto){

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    const elemento =
        document.getElementById(
            "erro"
        );


    elemento.textContent =
        texto;


    elemento.style.display =
        "block";

}

</script>

</body>
</html>
```
