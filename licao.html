<body>

</main>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    setDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",
    authDomain: "dezenas-1ed47.firebaseapp.com",
    projectId: "dezenas-1ed47",
    storageBucket: "dezenas-1ed47.firebasestorage.app",
    messagingSenderId: "372788277555",
    appId: "1:372788277555:web:1c1a6a80adee1722b54e46",
    measurementId: "G-NMPP8PKPK3"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* CONFIGURAÇÕES */

const MAX_VIDAS = 6;
const MINIMO_APROVACAO = 60;
const MOEDAS_DIARIAS = 50;
const MOEDAS_POR_LICAO = 10;
const MINUTOS_RECUPERACAO = 10;


/* ELEMENTOS */

const carregando = document.getElementById("carregando");
const conteudo = document.getElementById("conteudo");
const mensagem = document.getElementById("mensagem");

const tituloLicao = document.getElementById("tituloLicao");
const descricaoLicao = document.getElementById("descricaoLicao");

const vidasEl = document.getElementById("vidas");
const moedasEl = document.getElementById("moedas");
const xpEl = document.getElementById("xp");

const progressoBarra = document.getElementById("progressoBarra");
const contador = document.getElementById("contador");
const pergunta = document.getElementById("pergunta");
const alternativas = document.getElementById("alternativas");

const feedback = document.getElementById("feedback");
const feedbackTitulo = document.getElementById("feedbackTitulo");
const explicacao = document.getElementById("explicacao");

const btnResponder = document.getElementById("btnResponder");
const btnVoltar = document.getElementById("btnVoltar");
const btnSair = document.getElementById("btnSair");


/* URL */

const params = new URLSearchParams(window.location.search);

const cursoId = params.get("cursoId");
const moduloId = params.get("moduloId");
const licaoId = params.get("licaoId");


/* ESTADO */

let usuarioAtual = null;
let usuarioDados = null;

let licao = null;
let exercicios = [];

let indiceAtual = 0;
let respostaSelecionada = null;
let respondeu = false;

let acertos = 0;
let erros = 0;
let pontuacao = 0;


/* ============================= */
/* UTILITÁRIOS */
/* ============================= */

function mostrarErro(texto){

    mensagem.textContent = texto;
    mensagem.className = "mensagem erro";

    carregando.classList.add("oculto");
    conteudo.classList.add("oculto");
}


function dataLocal(){

    const agora = new Date();

    const ano = agora.getFullYear();
    const mes = String(agora.getMonth()+1).padStart(2,"0");
    const dia = String(agora.getDate()).padStart(2,"0");

    return `${ano}-${mes}-${dia}`;
}


/* ============================= */
/* VIDAS */
/* ============================= */

function calcularVidas(dados){

    let vidas = Number(dados.vidas ?? 6);

    if(vidas >= MAX_VIDAS){
        return MAX_VIDAS;
    }

    if(!dados.vidasUltimaAtualizacao){
        return vidas;
    }

    let ultima;

    if(dados.vidasUltimaAtualizacao.toDate){
        ultima = dados.vidasUltimaAtualizacao.toDate();
    }else{
        ultima = new Date(dados.vidasUltimaAtualizacao);
    }

    const agora = new Date();

    const minutos = Math.floor(
        (agora - ultima) / 60000
    );

    const recuperadas = Math.floor(
        minutos / MINUTOS_RECUPERACAO
    );

    if(recuperadas <= 0){
        return vidas;
    }

    return Math.min(
        MAX_VIDAS,
        vidas + recuperadas
    );
}


/* ============================= */
/* ATUALIZAR USUÁRIO */
/* ============================= */

async function atualizarUsuario(){

    const ref = doc(db,"usuarios",usuarioAtual.uid);

    const snap = await getDoc(ref);

    if(!snap.exists()){
        throw new Error("Perfil do usuário não encontrado.");
    }

    usuarioDados = snap.data();

    let vidas = calcularVidas(usuarioDados);

    let moedas = Number(usuarioDados.moedas ?? 0);
    let xp = Number(usuarioDados.xp ?? 0);

    let moedasDiariasData =
        usuarioDados.moedasDiariasData || "";

    const hoje = dataLocal();

    if(moedasDiariasData !== hoje){

        moedas += MOEDAS_DIARIAS;

        moedasDiariasData = hoje;

        await updateDoc(ref,{
            moedas: moedas,
            moedasDiariasData: hoje,
            vidas: vidas,
            atualizadoEm: serverTimestamp()
        });

    }else{

        await updateDoc(ref,{
            vidas: vidas,
            atualizadoEm: serverTimestamp()
        });
    }

    usuarioDados = {
        ...usuarioDados,
        vidas,
        moedas,
        xp,
        moedasDiariasData
    };

    atualizarHeader();
}


/* ============================= */
/* HEADER */
/* ============================= */

function atualizarHeader(){

    vidasEl.textContent =
        usuarioDados?.vidas ?? 0;

    moedasEl.textContent =
        usuarioDados?.moedas ?? 0;

    xpEl.textContent =
        usuarioDados?.xp ?? 0;
}


/* ============================= */
/* CARREGAR LIÇÃO */
/* ============================= */

async function carregarLicao(){

    if(!cursoId || !moduloId || !licaoId){

        mostrarErro(
            "Dados da lição não encontrados."
        );

        return;
    }


    const licaoRef =
        doc(db,"licoes",licaoId);

    const licaoSnap =
        await getDoc(licaoRef);


    if(!licaoSnap.exists()){

        mostrarErro(
            "Esta lição não existe."
        );

        return;
    }


    licao = {
        id: licaoSnap.id,
        ...licaoSnap.data()
    };


    if(licao.ativo === false){

        mostrarErro(
            "Esta lição está indisponível."
        );

        return;
    }


    tituloLicao.textContent =
        licao.titulo || "Lição";


    descricaoLicao.textContent =
        licao.descricao || "";


    const exerciciosSnap =
        await getDocs(
            collection(db,"exercicios")
        );


    exercicios = [];


    exerciciosSnap.forEach(docSnap => {

        const dados = docSnap.data();

        if(
            dados.licaoId === licaoId &&
            dados.ativo !== false
        ){

            exercicios.push({
                id: docSnap.id,
                ...dados
            });
        }

    });


    exercicios.sort(
        (a,b) =>
        Number(a.ordem ?? 0) -
        Number(b.ordem ?? 0)
    );


    if(exercicios.length === 0){

        mostrarErro(
            "Esta lição ainda não possui exercícios."
        );

        return;
    }


    carregando.classList.add("oculto");
    conteudo.classList.remove("oculto");

    mostrarExercicio();
}


/* ============================= */
/* MOSTRAR EXERCÍCIO */
/* ============================= */

function mostrarExercicio(){

    const exercicio =
        exercicios[indiceAtual];


    respostaSelecionada = null;
    respondeu = false;

    feedback.className = "feedback";
    feedbackTitulo.textContent = "";
    explicacao.textContent = "";

    btnResponder.disabled = true;
    btnResponder.textContent = "Responder";


    const numero =
        indiceAtual + 1;

    const total =
        exercicios.length;


    contador.textContent =
        `Questão ${numero} de ${total}`;


    const percentual =
        (numero / total) * 100;

    progressoBarra.style.width =
        `${percentual}%`;


    pergunta.textContent =
        exercicio.pergunta || "";


    alternativas.innerHTML = "";


    if(exercicio.tipo === "multipla_escolha"){

        const lista =
            Array.isArray(exercicio.alternativas)
            ? exercicio.alternativas
            : [];


        lista.forEach((alt,index) => {

            const botao =
                document.createElement("button");

            botao.className =
                "alternativa";

            botao.textContent =
                `${alt.letra || String.fromCharCode(65+index)}) ${alt.texto || ""}`;


            botao.addEventListener(
                "click",
                () => selecionarResposta(index)
            );


            alternativas.appendChild(botao);

        });

    }


    else if(
        exercicio.tipo === "verdadeiro_falso"
    ){

        ["Verdadeiro","Falso"]
        .forEach((texto,index) => {

            const botao =
                document.createElement("button");

            botao.className =
                "alternativa";

            botao.textContent =
                texto;


            botao.dataset.valor =
                index === 0
                ? "verdadeiro"
                : "falso";


            botao.addEventListener(
                "click",
                () => selecionarResposta(
                    botao.dataset.valor
                )
            );


            alternativas.appendChild(botao);

        });

    }


    else if(
        exercicio.tipo === "resposta_texto"
    ){

        const input =
            document.createElement("input");

        input.type = "text";

        input.placeholder =
            "Digite sua resposta";

        input.style.width = "100%";
        input.style.padding = "14px";
        input.style.border = "2px solid #e5e7eb";
        input.style.borderRadius = "10px";
        input.style.fontSize = "16px";


        input.addEventListener(
            "input",
            () => {

                respostaSelecionada =
                    input.value.trim();

                btnResponder.disabled =
                    !respostaSelecionada;
            }
        );


        alternativas.appendChild(input);
    }
}


/* ============================= */
/* SELECIONAR RESPOSTA */
/* ============================= */

function selecionarResposta(valor){

    if(respondeu){
        return;
    }

    respostaSelecionada = valor;

    document
        .querySelectorAll(".alternativa")
        .forEach(btn => {

            btn.classList.remove(
                "selecionada"
            );
        });


    if(
        typeof valor === "number"
    ){

        const botoes =
            document.querySelectorAll(
                ".alternativa"
            );

        if(botoes[valor]){
            botoes[valor]
                .classList.add(
                    "selecionada"
                );
        }

    }else{

        document
            .querySelectorAll(".alternativa")
            .forEach(btn => {

                if(
                    btn.dataset.valor === valor
                ){
                    btn.classList.add(
                        "selecionada"
                    );
                }

            });
    }


    btnResponder.disabled = false;
}


/* ============================= */
/* VERIFICAR RESPOSTA */
/* ============================= */

function verificarResposta(){

    const exercicio =
        exercicios[indiceAtual];


    let correta = false;


    if(
        exercicio.tipo ===
        "multipla_escolha"
    ){

        const lista =
            Array.isArray(exercicio.alternativas)
            ? exercicio.alternativas
            : [];


        const alternativa =
            lista[respostaSelecionada];


        correta =
            alternativa?.correta === true;
    }


    else if(
        exercicio.tipo ===
        "verdadeiro_falso"
    ){

        let respostaCorreta =
            String(
                exercicio.respostaTexto ?? ""
            )
            .trim()
            .toLowerCase();


        correta =
            String(respostaSelecionada)
                .trim()
                .toLowerCase()
            === respostaCorreta;
    }


    else if(
        exercicio.tipo ===
        "resposta_texto"
    ){

        const respostaUsuario =
            String(
                respostaSelecionada ?? ""
            )
            .trim()
            .toLowerCase();


        const respostaCorreta =
            String(
                exercicio.respostaTexto ?? ""
            )
            .trim()
            .toLowerCase();


        correta =
            respostaUsuario === respostaCorreta;
    }


    respondeu = true;


    if(correta){

        acertos++;

        pontuacao +=
            Number(exercicio.pontos ?? 0);


        feedback.className =
            "feedback correto";

        feedbackTitulo.textContent =
            "✅ Resposta correta!";

    }else{

        erros++;

        feedback.className =
            "feedback errado";

        feedbackTitulo.textContent =
            "❌ Resposta incorreta!";
    }


    explicacao.textContent =
        exercicio.explicacao || "";


    btnResponder.textContent =
        indiceAtual <
        exercicios.length - 1
        ? "Próxima questão"
        : "Finalizar lição";


    btnResponder.disabled =
        false;
}


/* ============================= */
/* FINALIZAR LIÇÃO */
/* ============================= */

async function finalizarLicao(){

    btnResponder.disabled = true;

    btnResponder.textContent =
        "Salvando resultado...";


    const totalQuestoes =
        exercicios.length;


    const aproveitamento =
        totalQuestoes > 0
        ? Math.round(
            (acertos / totalQuestoes) * 100
        )
        : 0;


    const aprovado =
        aproveitamento >=
        MINIMO_APROVACAO;


    const xpGanho =
        aprovado
        ? pontuacao
        : 0;


    const moedasGanhas =
        aprovado
        ? MOEDAS_POR_LICAO
        : 0;


    let vidas =
        Number(usuarioDados.vidas ?? 0);


    let moedas =
        Number(usuarioDados.moedas ?? 0);


    let xp =
        Number(usuarioDados.xp ?? 0);


    /*
     * Se não passar, perde uma vida.
     */

    if(!aprovado){

        vidas =
            Math.max(0, vidas - 1);
    }


    /*
     * Se passar, recebe moedas e XP.
     */

    if(aprovado){

        moedas += moedasGanhas;

        xp += xpGanho;
    }


    /*
     * Salvar usuário.
     */

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioAtual.uid
        );


    await updateDoc(
        usuarioRef,
        {
            vidas: vidas,
            moedas: moedas,
            xp: xp,
            vidasUltimaAtualizacao:
                serverTimestamp(),
            atualizadoEm:
                serverTimestamp()
        }
    );


    /*
     * Salvar progresso.
     */

    const progressoRef =
        doc(
            db,
            "progresso",
            `${usuarioAtual.uid}_${licaoId}`
        );


    const progressoSnap =
        await getDoc(progressoRef);


    const dadosAnteriores =
        progressoSnap.exists()
        ? progressoSnap.data()
        : {};


    const tentativas =
        Number(
            dadosAnteriores.tentativas ?? 0
        ) + 1;


    await setDoc(
        progressoRef,
        {
            usuarioId:
                usuarioAtual.uid,

            cursoId:
                cursoId,

            moduloId:
                moduloId,

            licaoId:
                licaoId,

            concluida:
                aprovado,

            aprovado:
                aprovado,

            aproveitamento:
                aproveitamento,

            pontuacao:
                pontuacao,

            acertos:
                acertos,

            erros:
                erros,

            totalQuestoes:
                totalQuestoes,

            xpGanho:
                xpGanho,

            moedasGanhas:
                moedasGanhas,

            tentativas:
                tentativas,

            ultimaTentativa:
                serverTimestamp(),

            concluidaEm:
                aprovado
                ? serverTimestamp()
                : (dadosAnteriores.concluidaEm ?? null),

            atualizadoEm:
                serverTimestamp()
        },
        {
            merge:true
        }
    );


    /*
     * Atualizar estado local.
     */

    usuarioDados.vidas =
        vidas;

    usuarioDados.moedas =
        moedas;

    usuarioDados.xp =
        xp;


    /*
     * Ir para resultado.
     */

    window.location.href =
        `resultado.html?cursoId=${encodeURIComponent(cursoId)}&moduloId=${encodeURIComponent(moduloId)}&licaoId=${encodeURIComponent(licaoId)}`;
}


/* ============================= */
/* BOTÃO RESPONDER */
/* ============================= */

btnResponder.addEventListener(
    "click",
    async () => {

        try{

            if(!respondeu){

                verificarResposta();

                return;
            }


            if(
                indiceAtual <
                exercicios.length - 1
            ){

                indiceAtual++;

                mostrarExercicio();

                return;
            }


            await finalizarLicao();

        }catch(error){

            console.error(error);

            mensagem.textContent =
                "Erro ao salvar o resultado. Tente novamente.";

            mensagem.className =
                "mensagem erro";

            btnResponder.disabled =
                false;

            btnResponder.textContent =
                "Tentar novamente";
        }

    }
);


/* ============================= */
/* VOLTAR */
/* ============================= */

btnVoltar.addEventListener(
    "click",
    () => {

        window.location.href =
            `curso.html?cursoId=${encodeURIComponent(cursoId)}`;

    }
);


/* ============================= */
/* SAIR */
/* ============================= */

btnSair.addEventListener(
    "click",
    async () => {

        await signOut(auth);

        window.location.href =
            "index.html";
    }
);


/* ============================= */
/* AUTENTICAÇÃO */
/* ============================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "index.html";

            return;
        }


        usuarioAtual = usuario;


        try{

            await atualizarUsuario();

            await carregarLicao();

        }catch(error){

            console.error(error);

            mostrarErro(
                error.message ||
                "Não foi possível carregar a lição."
            );
        }

    }
);

</script>

</body>
</html>
