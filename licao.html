<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lição</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #222;
    min-height: 100vh;
}

header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    padding: 14px 25px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: #2563eb;
}

.header-direita {
    display: flex;
    align-items: center;
    gap: 12px;
}

.usuario {
    text-align: right;
}

.usuario-nome {
    font-weight: bold;
    font-size: 14px;
}

.usuario-email {
    color: #777;
    font-size: 12px;
}

.btn-voltar,
.btn-sair {
    border: none;
    padding: 9px 13px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.btn-voltar {
    background: #eef2ff;
    color: #2563eb;
}

.btn-voltar:hover {
    background: #dbeafe;
}

.btn-sair {
    background: #ef4444;
    color: white;
}

.btn-sair:hover {
    background: #dc2626;
}

main {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: 30px 20px 60px;
}

.licao-topo {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.breadcrumb {
    color: #2563eb;
    font-size: 13px;
    margin-bottom: 10px;
}

.licao-titulo {
    font-size: 28px;
    margin-bottom: 8px;
}

.licao-descricao {
    color: #666;
    font-size: 15px;
    line-height: 1.5;
}

.progresso-area {
    margin-top: 20px;
}

.progresso-texto {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #666;
    margin-bottom: 7px;
}

.progresso-barra {
    width: 100%;
    height: 9px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progresso-preenchimento {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: width 0.3s ease;
}

.exercicio {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.exercicio-numero {
    color: #2563eb;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 14px;
}

.pergunta {
    font-size: 23px;
    line-height: 1.4;
    margin-bottom: 25px;
}

.alternativas {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.alternativa {
    width: 100%;
    background: white;
    border: 2px solid #e5e7eb;
    border-radius: 11px;
    padding: 15px;
    text-align: left;
    cursor: pointer;

    display: flex;
    align-items: center;
    gap: 13px;

    font-size: 15px;
}

.alternativa:hover {
    border-color: #93c5fd;
    background: #f8fbff;
}

.alternativa.selecionada {
    border-color: #2563eb;
    background: #eff6ff;
}

.alternativa.correta {
    border-color: #16a34a;
    background: #f0fdf4;
}

.alternativa.incorreta {
    border-color: #dc2626;
    background: #fef2f2;
}

.letra {
    width: 32px;
    height: 32px;
    min-width: 32px;

    border-radius: 50%;

    background: #eef2ff;
    color: #3730a3;

    display: flex;
    justify-content: center;
    align-items: center;

    font-weight: bold;
}

.vf-area {
    display: flex;
    gap: 12px;
}

.vf-botao {
    flex: 1;

    border: 2px solid #e5e7eb;
    background: white;

    border-radius: 11px;

    padding: 16px;

    cursor: pointer;

    font-size: 16px;
    font-weight: bold;
}

.vf-botao:hover {
    border-color: #93c5fd;
}

.vf-botao.selecionado {
    border-color: #2563eb;
    background: #eff6ff;
}

.vf-botao.correto {
    border-color: #16a34a;
    background: #f0fdf4;
}

.vf-botao.incorreto {
    border-color: #dc2626;
    background: #fef2f2;
}

.resposta-texto {
    width: 100%;
    min-height: 130px;

    resize: vertical;

    border: 2px solid #e5e7eb;
    border-radius: 11px;

    padding: 15px;

    font-family: inherit;
    font-size: 16px;

    outline: none;
}

.resposta-texto:focus {
    border-color: #2563eb;
}

.feedback {
    display: none;

    margin-top: 20px;
    padding: 17px;

    border-radius: 11px;

    line-height: 1.5;
}

.feedback.mostrar {
    display: block;
}

.feedback.correto {
    background: #f0fdf4;
    border: 1px solid #86efac;
    color: #166534;
}

.feedback.incorreto {
    background: #fef2f2;
    border: 1px solid #fca5a5;
    color: #991b1b;
}

.feedback-titulo {
    font-weight: bold;
    margin-bottom: 5px;
}

.feedback-explicacao {
    margin-top: 8px;
}

.acoes {
    margin-top: 25px;
}

.btn-principal {
    width: 100%;

    border: none;

    background: #2563eb;
    color: white;

    padding: 15px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 16px;
    font-weight: bold;
}

.btn-principal:hover {
    background: #1d4ed8;
}

.btn-principal:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.resultado {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 16px;

    padding: 40px 25px;

    text-align: center;

    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

.resultado-icone {
    font-size: 65px;
    margin-bottom: 15px;
}

.resultado h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.resultado p {
    color: #666;
    margin-bottom: 20px;
}

.resultado-pontos {
    font-size: 22px;
    font-weight: bold;
    color: #2563eb;
    margin-bottom: 25px;
}

.btn-final {
    border: none;
    background: #2563eb;
    color: white;

    padding: 13px 22px;

    border-radius: 9px;

    cursor: pointer;

    font-weight: bold;
}

.carregando {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 10px;

    padding: 50px;

    color: #666;
}

.spinner {
    width: 23px;
    height: 23px;

    border: 3px solid #ddd;
    border-top-color: #2563eb;

    border-radius: 50%;

    animation: girar 0.8s linear infinite;
}

@keyframes girar {

    to {
        transform: rotate(360deg);
    }

}

.mensagem {
    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 15px;

    padding: 45px 20px;

    text-align: center;
}

.mensagem h2 {
    margin-bottom: 10px;
}

.mensagem p {
    color: #777;
}

.mensagem.erro {
    color: #dc2626;
}

@media (max-width: 650px) {

    header {
        padding: 12px 15px;
    }

    .logo {
        font-size: 18px;
    }

    .usuario {
        display: none;
    }

    .header-direita {
        gap: 6px;
    }

    .btn-voltar,
    .btn-sair {
        padding: 8px 10px;
        font-size: 12px;
    }

    main {
        padding: 20px 15px 40px;
    }

    .licao-titulo {
        font-size: 24px;
    }

    .pergunta {
        font-size: 20px;
    }

    .exercicio {
        padding: 20px;
    }

    .vf-area {
        flex-direction: column;
    }

}

</style>

</head>

</main>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================
   FIREBASE
===================================== */

const firebaseConfig = {
    apiKey: "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",
    authDomain: "dezenas-1ed47.firebaseapp.com",
    projectId: "dezenas-1ed47",
    storageBucket: "dezenas-1ed47.firebasestorage.app",
    messagingSenderId: "372788277555",
    appId: "1:372788277555:web:1c1a6a80adee1722b54e46",
    measurementId: "G-NMPP8PKPK3"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =====================================
   ELEMENTOS
===================================== */

const conteudo = document.getElementById("conteudo");

const usuarioNome = document.getElementById("usuarioNome");

const usuarioEmail = document.getElementById("usuarioEmail");

const btnVoltar = document.getElementById("btnVoltar");

const btnSair = document.getElementById("btnSair");


/* =====================================
   PARÂMETROS DA URL
===================================== */

const parametros = new URLSearchParams(
    window.location.search
);

const cursoId = parametros.get("cursoId");

const moduloId = parametros.get("moduloId");

const licaoId = parametros.get("licaoId");


/* =====================================
   VARIÁVEIS
===================================== */

let exercicios = [];

let exercicioAtual = 0;

let respostas = {};

let pontuacao = 0;

let respostaVerificada = false;


/* =====================================
   ESCAPAR HTML
===================================== */

function escapar(valor) {

    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================
   PERFIL
===================================== */

async function carregarPerfil(usuario) {

    try {

        usuarioEmail.textContent = usuario.email || "";

        const referencia = doc(
            db,
            "usuarios",
            usuario.uid
        );

        const snapshot = await getDoc(referencia);

        if (snapshot.exists()) {

            const dados = snapshot.data();

            usuarioNome.textContent =
                dados.nome ||
                usuario.email ||
                "Aluno";

        } else {

            usuarioNome.textContent =
                usuario.email ||
                "Aluno";
        }

    } catch (erro) {

        console.error(
            "Erro ao carregar perfil:",
            erro
        );

        usuarioNome.textContent =
            usuario.email ||
            "Aluno";
    }
}


/* =====================================
   CARREGAR LIÇÃO
===================================== */

async function carregarLicao() {

    if (!cursoId || !moduloId || !licaoId) {

        mostrarErro(
            "Lição não informada.",
            "O endereço da página não possui todas as informações necessárias."
        );

        return;
    }


    try {

        const licaoReferencia = doc(
            db,
            "licoes",
            licaoId
        );

        const licaoSnapshot =
            await getDoc(licaoReferencia);


        if (!licaoSnapshot.exists()) {

            mostrarErro(
                "Lição não encontrada.",
                "Esta lição pode ter sido removida."
            );

            return;
        }


        const licao = licaoSnapshot.data();


        if (licao.ativo === false) {

            mostrarErro(
                "Lição indisponível.",
                "Esta lição não está disponível no momento."
            );

            return;
        }


        const exerciciosSnapshot =
            await getDocs(
                collection(
                    db,
                    "exercicios"
                )
            );


        exercicios = [];


        exerciciosSnapshot.forEach(
            (documento) => {

                const dados =
                    documento.data();


                if (
                    dados.licaoId === licaoId &&
                    dados.ativo !== false
                ) {

                    exercicios.push({
                        id: documento.id,
                        ...dados
                    });

                }

            }
        );


        exercicios.sort(
            (a, b) => {

                const ordemA =
                    Number(a.ordem) || 0;

                const ordemB =
                    Number(b.ordem) || 0;

                return ordemA - ordemB;
            }
        );


        renderizarTopo(licao);


        if (exercicios.length === 0) {

            mostrarSemExercicios();

            return;
        }


        mostrarExercicio();

    } catch (erro) {

        console.error(
            "Erro ao carregar lição:",
            erro
        );

        mostrarErro(
            "Erro ao carregar a lição.",
            "Verifique sua conexão e tente novamente."
        );
    }
}


/* =====================================
   TOPO
===================================== */

function renderizarTopo(licao) {

    conteudo.innerHTML = "";

    const topo = document.createElement("section");

    topo.className = "licao-topo";


    const breadcrumb = document.createElement("div");

    breadcrumb.className = "breadcrumb";

    breadcrumb.textContent = "Lição";


    const titulo = document.createElement("h1");

    titulo.className = "licao-titulo";

    titulo.textContent =
        licao.titulo || "Lição";


    topo.appendChild(breadcrumb);

    topo.appendChild(titulo);


    if (licao.descricao) {

        const descricao =
            document.createElement("p");

        descricao.className =
            "licao-descricao";

        descricao.textContent =
            licao.descricao;

        topo.appendChild(descricao);
    }


    conteudo.appendChild(topo);


    const area =
        document.createElement("div");

    area.id = "areaExercicio";

    conteudo.appendChild(area);
}


/* =====================================
   MOSTRAR EXERCÍCIO
===================================== */

function mostrarExercicio() {

    const area =
        document.getElementById(
            "areaExercicio"
        );


    if (!area) {
        return;
    }


    if (
        exercicioAtual >=
        exercicios.length
    ) {

        mostrarResultado();

        return;
    }


    respostaVerificada = false;


    const exercicio =
        exercicios[exercicioAtual];


    const numero =
        exercicioAtual + 1;


    const total =
        exercicios.length;


    area.innerHTML = "";


    const card =
        document.createElement("section");

    card.className = "exercicio";


    const numeroElemento =
        document.createElement("div");

    numeroElemento.className =
        "exercicio-numero";

    numeroElemento.textContent =
        `Exercício ${numero} de ${total}`;


    const pergunta =
        document.createElement("div");

    pergunta.className = "pergunta";

    pergunta.textContent =
        exercicio.pergunta ||
        "Pergunta";


    card.appendChild(numeroElemento);

    card.appendChild(pergunta);


    /* =================================
       MÚLTIPLA ESCOLHA
    ================================= */

    if (
        exercicio.tipo ===
        "multipla_escolha"
    ) {

        const alternativas =
            Array.isArray(
                exercicio.alternativas
            )
            ? exercicio.alternativas
            : [];


        const container =
            document.createElement("div");

        container.className =
            "alternativas";


        alternativas.forEach(
            (alternativa) => {

                const botao =
                    document.createElement("button");

                botao.type = "button";

                botao.className =
                    "alternativa";


                const letra =
                    document.createElement("span");

                letra.className = "letra";

                letra.textContent =
                    alternativa.letra || "";


                const texto =
                    document.createElement("span");

                texto.textContent =
                    alternativa.texto || "";


                botao.appendChild(letra);

                botao.appendChild(texto);


                botao.addEventListener(
                    "click",
                    () => {

                        if (respostaVerificada) {
                            return;
                        }


                        container
                            .querySelectorAll(
                                ".alternativa"
                            )
                            .forEach(
                                (item) => {

                                    item.classList.remove(
                                        "selecionada"
                                    );

                                }
                            );


                        botao.classList.add(
                            "selecionada"
                        );


                        respostas[
                            exercicio.id
                        ] =
                            alternativa.letra;

                    }
                );


                container.appendChild(
                    botao
                );

            }
        );


        card.appendChild(container);
    }


    /* =================================
       VERDADEIRO / FALSO
    ================================= */

    else if (
        exercicio.tipo ===
        "verdadeiro_falso"
    ) {

        const container =
            document.createElement("div");

        container.className =
            "vf-area";


        ["verdadeiro", "falso"].forEach(
            (valor) => {

                const botao =
                    document.createElement("button");

                botao.type = "button";

                botao.className =
                    "vf-botao";


                botao.textContent =
                    valor === "verdadeiro"
                    ? "✓ Verdadeiro"
                    : "✕ Falso";


                botao.addEventListener(
                    "click",
                    () => {

                        if (respostaVerificada) {
                            return;
                        }


                        container
                            .querySelectorAll(
                                ".vf-botao"
                            )
                            .forEach(
                                (item) => {

                                    item.classList.remove(
                                        "selecionado"
                                    );

                                }
                            );


                        botao.classList.add(
                            "selecionado"
                        );


                        respostas[
                            exercicio.id
                        ] = valor;

                    }
                );


                container.appendChild(
                    botao
                );

            }
        );


        card.appendChild(container);
    }


    /* =================================
       RESPOSTA TEXTO
    ================================= */

    else if (
        exercicio.tipo ===
        "resposta_texto"
    ) {

        const campo =
            document.createElement("textarea");

        campo.className =
            "resposta-texto";

        campo.placeholder =
            "Digite sua resposta...";


        campo.addEventListener(
            "input",
            () => {

                if (!respostaVerificada) {

                    respostas[
                        exercicio.id
                    ] =
                        campo.value.trim();

                }

            }
        );


        card.appendChild(campo);
    }


    /* =================================
       FEEDBACK
    ================================= */

    const feedback =
        document.createElement("div");

    feedback.id = "feedback";

    feedback.className = "feedback";


    card.appendChild(feedback);


    /* =================================
       AÇÕES
    ================================= */

    const acoes =
        document.createElement("div");

    acoes.className = "acoes";


    const botao =
        document.createElement("button");

    botao.type = "button";

    botao.id = "btnResponder";

    botao.className =
        "btn-principal";

    botao.textContent =
        "Verificar resposta";


    botao.addEventListener(
        "click",
        () => {

            if (respostaVerificada) {

                exercicioAtual++;

                mostrarExercicio();

                return;
            }


            verificarResposta(
                exercicio,
                card
            );

        }
    );


    acoes.appendChild(botao);

    card.appendChild(acoes);


    area.appendChild(card);


    /* =================================
       PROGRESSO
    ================================= */

    atualizarProgresso(
        numero,
        total
    );
}


/* =====================================
   PROGRESSO
===================================== */

function atualizarProgresso(
    numero,
    total
) {

    const topo =
        document.querySelector(
            ".licao-topo"
        );


    if (!topo) {
        return;
    }


    let area =
        document.querySelector(
            ".progresso-area"
        );


    if (!area) {

        area =
            document.createElement("div");

        area.className =
            "progresso-area";


        const texto =
            document.createElement("div");

        texto.className =
            "progresso-texto";


        const esquerda =
            document.createElement("span");

        esquerda.textContent =
            "Progresso da lição";


        const direita =
            document.createElement("span");

        direita.id =
            "progressoNumero";


        texto.appendChild(
            esquerda
        );

        texto.appendChild(
            direita
        );


        const barra =
            document.createElement("div");

        barra.className =
            "progresso-barra";


        const preenchimento =
            document.createElement("div");

        preenchimento.id =
            "progressoPreenchimento";

        preenchimento.className =
            "progresso-preenchimento";


        barra.appendChild(
            preenchimento
        );


        area.appendChild(texto);

        area.appendChild(barra);

        topo.appendChild(area);
    }


    const numeroElemento =
        document.getElementById(
            "progressoNumero"
        );

    const preenchimento =
        document.getElementById(
            "progressoPreenchimento"
        );


    if (numeroElemento) {

        numeroElemento.textContent =
            `${numero}/${total}`;

    }


    if (preenchimento) {

        const percentual =
            ((numero - 1) / total) * 100;

        preenchimento.style.width =
            `${percentual}%`;
    }
}


/* =====================================
   VERIFICAR
===================================== */

function verificarResposta(
    exercicio,
    card
) {

    const resposta =
        respostas[
            exercicio.id
        ];


    if (
        resposta === undefined ||
        resposta === ""
    ) {

        alert(
            "Selecione ou digite uma resposta antes de continuar."
        );

        return;
    }


    let correta = false;


    /* =================================
       MÚLTIPLA ESCOLHA
    ================================= */

    if (
        exercicio.tipo ===
        "multipla_escolha"
    ) {

        const alternativas =
            Array.isArray(
                exercicio.alternativas
            )
            ? exercicio.alternativas
            : [];


        const corretaObjeto =
            alternativas.find(
                (item) =>
                    item.correta === true
            );


        if (
            corretaObjeto &&
            resposta ===
            corretaObjeto.letra
        ) {

            correta = true;

        }


        const botoes =
            card.querySelectorAll(
                ".alternativa"
            );


        botoes.forEach(
            (botao) => {

                const letra =
                    botao.querySelector(
                        ".letra"
                    );


                if (!letra) {
                    return;
                }


                if (
                    corretaObjeto &&
                    letra.textContent ===
                    corretaObjeto.letra
                ) {

                    botao.classList.add(
                        "correta"
                    );

                }


                if (
                    letra.textContent ===
                    resposta &&
                    !correta
                ) {

                    botao.classList.add(
                        "incorreta"
                    );

                }

            }
        );
    }


    /* =================================
       VERDADEIRO / FALSO
    ================================= */

    else if (
        exercicio.tipo ===
        "verdadeiro_falso"
    ) {

        const respostaCorreta =
            String(
                exercicio.respostaTexto || ""
            )
            .trim()
            .toLowerCase();


        if (
            String(resposta)
                .trim()
                .toLowerCase() ===
            respostaCorreta
        ) {

            correta = true;

        }


        const botoes =
            card.querySelectorAll(
                ".vf-botao"
            );


        botoes.forEach(
            (botao) => {

                const valor =
                    botao.textContent
                        .toLowerCase()
                        .includes(
                            "verdadeiro"
                        )
                    ? "verdadeiro"
                    : "falso";


                if (
                    valor ===
                    respostaCorreta
                ) {

                    botao.classList.add(
                        "correto"
                    );

                }


                if (
                    valor === resposta &&
                    !correta
                ) {

                    botao.classList.add(
                        "incorreto"
                    );

                }

            }
        );
    }


    /* =================================
       RESPOSTA TEXTO
    ================================= */

    else if (
        exercicio.tipo ===
        "resposta_texto"
    ) {

        const respostaCorreta =
            String(
                exercicio.respostaTexto || ""
            )
            .trim()
            .toLowerCase();


        const respostaAluno =
            String(
                resposta
            )
            .trim()
            .toLowerCase();


        if (
            respostaAluno ===
            respostaCorreta
        ) {

            correta = true;

        }


        const campo =
            card.querySelector(
                ".resposta-texto"
            );


        if (campo) {

            campo.disabled = true;

        }
    }


    /* =================================
       PONTOS
    ================================= */

    if (correta) {

        pontuacao +=
            Number(
                exercicio.pontos
            ) || 0;

    }


    mostrarFeedback(
        exercicio,
        correta,
        card
    );
}


/* =====================================
   FEEDBACK
===================================== */

function mostrarFeedback(
    exercicio,
    correta,
    card
) {

    respostaVerificada = true;


    const feedback =
        card.querySelector(
            "#feedback"
        );


    const botao =
        card.querySelector(
            "#btnResponder"
        );


    if (correta) {

        feedback.className =
            "feedback mostrar correto";


        feedback.innerHTML = "";


        const titulo =
            document.createElement("div");

        titulo.className =
            "feedback-titulo";

        titulo.textContent =
            "✓ Resposta correta!";


        feedback.appendChild(
            titulo
        );


    } else {

        feedback.className =
            "feedback mostrar incorreto";


        feedback.innerHTML = "";


        const titulo =
            document.createElement("div");

        titulo.className =
            "feedback-titulo";

        titulo.textContent =
            "✕ Resposta incorreta.";


        feedback.appendChild(
            titulo
        );

    }


    if (exercicio.explicacao) {

        const explicacao =
            document.createElement("div");

        explicacao.className =
            "feedback-explicacao";

        explicacao.textContent =
            exercicio.explicacao;


        feedback.appendChild(
            explicacao
        );
    }


    card
        .querySelectorAll(
            ".alternativa, .vf-botao"
        )
        .forEach(
            (elemento) => {

                elemento.disabled = true;

            }
        );


    if (
        exercicioAtual <
        exercicios.length - 1
    ) {

        botao.textContent =
            "Próximo exercício →";

    } else {

        botao.textContent =
            "Finalizar lição";

    }
}


/* =====================================
   RESULTADO
===================================== */

function mostrarResultado() {

    const totalPossivel =
        exercicios.reduce(
            (total, exercicio) => {

                return total +
                    (Number(
                        exercicio.pontos
                    ) || 0);

            },
            0
        );


    const percentual =
        totalPossivel > 0
        ?
        Math.round(
            (pontuacao /
            totalPossivel) * 100
        )
        :
        0;


    let icone = "🎉";

    let titulo =
        "Lição concluída!";


    if (percentual < 50) {

        icone = "📚";

        titulo =
            "Continue praticando!";

    } else if (percentual < 80) {

        icone = "👏";

        titulo =
            "Muito bem!";

    }


    conteudo.innerHTML = `

        <div class="resultado">

            <div class="resultado-icone">
                ${icone}
            </div>

            <h2>
                ${titulo}
            </h2>

            <p>
                Você terminou todos os exercícios desta lição.
            </p>

            <div class="resultado-pontos">
                ${pontuacao} XP
            </div>

            <button
                type="button"
                class="btn-final"
                id="btnVoltarCursoResultado"
            >
                ← Voltar para o curso
            </button>

        </div>

    `;


    const botao =
        document.getElementById(
            "btnVoltarCursoResultado"
        );


    botao.addEventListener(
        "click",
        () => {

            window.location.href =
                `curso.html?cursoId=${encodeURIComponent(cursoId)}`;

        }
    );
}

   SEM EXERCÍCIOS

/* =====================================
   ERRO
===================================== */

function mostrarErro(
    titulo,
    texto
) {

    conteudo.innerHTML = "";


    const div =
        document.createElement("div");

    div.className =
        "mensagem erro";


    const h2 =
        document.createElement("h2");

    h2.textContent =
        titulo;


    const p =
        document.createElement("p");

    p.textContent =
        texto;


    const botao =
        document.createElement("button");

    botao.type = "button";

    botao.textContent =
        "Voltar para cursos";


    botao.style.marginTop =
        "20px";

    botao.style.padding =
        "10px 18px";

    botao.style.border =
        "none";

    botao.style.borderRadius =
        "8px";

    botao.style.background =
        "#2563eb";

    botao.style.color =
        "white";

    botao.style.cursor =
        "pointer";

    botao.style.fontWeight =
        "bold";


    botao.addEventListener(
        "click",
        () => {

            window.location.href =
                "cursos.html";

        }
    );


    div.appendChild(h2);

    div.appendChild(p);

    div.appendChild(botao);

    conteudo.appendChild(div);
}

            return;
        }


        await carregarPerfil(

        );


        await carregarLicao();

);
