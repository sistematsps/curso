```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Aprende+ | Criar conta</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #7c3aed
        );

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.container{

    width:100%;

    max-width:450px;
}

.logo{

    text-align:center;

    color:white;

    margin-bottom:25px;
}

.logo-icon{

    width:78px;

    height:78px;

    margin:0 auto 12px;

    border-radius:24px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:42px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.18);
}

.logo h1{

    font-size:32px;

    font-weight:800;
}

.logo p{

    margin-top:6px;

    font-size:15px;

    opacity:.9;
}

.card{

    background:white;

    border-radius:24px;

    padding:30px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.2);
}

.card h2{

    text-align:center;

    font-size:24px;

    margin-bottom:7px;
}

.subtitulo{

    text-align:center;

    color:#737373;

    font-size:14px;

    margin-bottom:25px;
}

.campo{

    margin-bottom:17px;
}

.campo label{

    display:block;

    font-size:14px;

    font-weight:700;

    margin-bottom:7px;

    color:#404040;
}

.campo input{

    width:100%;

    height:50px;

    border:
        1px solid #d4d4d4;

    border-radius:12px;

    padding:
        0 14px;

    font-size:15px;

    outline:none;
}

.campo input:focus{

    border-color:#6366f1;

    box-shadow:
        0 0 0 3px
        rgba(99,102,241,.12);
}

.senha{

    position:relative;
}

.senha input{

    padding-right:50px;
}

.mostrar{

    position:absolute;

    right:13px;

    top:50%;

    transform:
        translateY(-50%);

    border:0;

    background:transparent;

    cursor:pointer;

    font-size:19px;
}

.btn{

    width:100%;

    height:52px;

    border:0;

    border-radius:13px;

    background:#4f46e5;

    color:white;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    margin-top:4px;
}

.btn:hover{

    background:#4338ca;
}

.btn:disabled{

    opacity:.6;

    cursor:not-allowed;
}

.mensagem{

    display:none;

    padding:12px 14px;

    border-radius:10px;

    margin-bottom:18px;

    font-size:14px;

    line-height:1.4;
}

.mensagem.erro{

    display:block;

    background:#fef2f2;

    color:#b91c1c;

    border:
        1px solid #fecaca;
}

.mensagem.sucesso{

    display:block;

    background:#f0fdf4;

    color:#15803d;

    border:
        1px solid #bbf7d0;
}

.login{

    text-align:center;

    margin-top:22px;

    padding-top:20px;

    border-top:
        1px solid #eeeeee;

    color:#737373;

    font-size:14px;
}

.login a{

    color:#4f46e5;

    font-weight:800;

    text-decoration:none;
}

.rodape{

    text-align:center;

    color:
        rgba(255,255,255,.75);

    font-size:12px;

    margin-top:20px;
}

@media(max-width:480px){

    .card{

        padding:24px 20px;
    }

    .logo h1{

        font-size:28px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="logo">

        <div class="logo-icon">
            📚
        </div>

        <h1>
            Aprende+
        </h1>

        <p>
            Aprenda todos os dias. Evolua sempre.
        </p>

    </div>


    <!-- =====================================================
         CARD
    ====================================================== -->

    <div class="card">

        <h2>
            Criar minha conta
        </h2>

        <p class="subtitulo">
            Comece agora sua jornada de aprendizado.
        </p>


        <div
            id="mensagem"
            class="mensagem"
        ></div>


        <form id="formCadastro">


            <!-- =================================================
                 NOME
            ================================================== -->

            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required
                    minlength="2"
                >

            </div>


            <!-- =================================================
                 EMAIL
            ================================================== -->

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- =================================================
                 SENHA
            ================================================== -->

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <div class="senha">

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="mostrar"
                        id="mostrarSenha"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- =================================================
                 CONFIRMAR SENHA
            ================================================== -->

            <div class="campo">

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <div class="senha">

                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="mostrar"
                        id="mostrarConfirmarSenha"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- =================================================
                 BOTÃO
            ================================================== -->

            <button
                type="submit"
                class="btn"
                id="btnCadastrar"
            >
                Criar minha conta
            </button>


        </form>


        <!-- =====================================================
             LOGIN
        ====================================================== -->

        <div class="login">

            Já possui uma conta?

            <a href="login.html">
                Entrar
            </a>

        </div>

    </div>


    <div class="rodape">

        © 2026 Aprende+ —
        Sua jornada de aprendizado

    </div>


</div>



<script type="module">


// ============================================================
// FIREBASE
// ============================================================

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ============================================================
// CONFIGURAÇÃO CORRETA DO PROJETO
// ============================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyC4AAbC8vCFAmlPlur12Nm7YBKPjaSjumM",

    authDomain:
        "meuappweb-65522.firebaseapp.com",

    projectId:
        "meuappweb-65522",

    storageBucket:
        "meuappweb-65522.firebasestorage.app",

    messagingSenderId:
        "305368794616",

    appId:
        "1:305368794616:web:3199c6836a986d896ac20d",

    measurementId:
        "G-QN7GFD99N0"

};


// ============================================================
// INICIALIZAÇÃO
// ============================================================

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


// ============================================================
// ELEMENTOS
// ============================================================

const form =
    document.getElementById("formCadastro");

const nome =
    document.getElementById("nome");

const email =
    document.getElementById("email");

const senha =
    document.getElementById("senha");

const confirmarSenha =
    document.getElementById("confirmarSenha");

const btn =
    document.getElementById("btnCadastrar");

const mensagem =
    document.getElementById("mensagem");

const mostrarSenha =
    document.getElementById("mostrarSenha");

const mostrarConfirmarSenha =
    document.getElementById(
        "mostrarConfirmarSenha"
    );


// ============================================================
// MENSAGEM
// ============================================================

function mostrarMensagem(
    texto,
    tipo = "erro"
){

    mensagem.textContent =
        texto;

    mensagem.className =
        "mensagem " + tipo;

}


// ============================================================
// MOSTRAR SENHA
// ============================================================

mostrarSenha.addEventListener(
    "click",
    function(){

        if(
            senha.type === "password"
        ){

            senha.type = "text";

            mostrarSenha.textContent =
                "🙈";

        }else{

            senha.type = "password";

            mostrarSenha.textContent =
                "👁️";

        }

    }
);


// ============================================================
// MOSTRAR CONFIRMAÇÃO
// ============================================================

mostrarConfirmarSenha.addEventListener(
    "click",
    function(){

        if(
            confirmarSenha.type === "password"
        ){

            confirmarSenha.type =
                "text";

            mostrarConfirmarSenha.textContent =
                "🙈";

        }else{

            confirmarSenha.type =
                "password";

            mostrarConfirmarSenha.textContent =
                "👁️";

        }

    }
);


// ============================================================
// CADASTRO
// ============================================================

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const nomeValor =
            nome.value.trim();


        const emailValor =
            email.value
                .trim()
                .toLowerCase();


        const senhaValor =
            senha.value;


        const confirmarValor =
            confirmarSenha.value;


        // =====================================================
        // VALIDAÇÕES
        // =====================================================

        if(
            nomeValor.length < 2
        ){

            mostrarMensagem(
                "Digite seu nome completo."
            );

            nome.focus();

            return;
        }


        if(
            senhaValor.length < 6
        ){

            mostrarMensagem(
                "A senha precisa ter pelo menos 6 caracteres."
            );

            senha.focus();

            return;
        }


        if(
            senhaValor !== confirmarValor
        ){

            mostrarMensagem(
                "As senhas não são iguais."
            );

            confirmarSenha.focus();

            return;
        }


        // =====================================================
        // BLOQUEIA BOTÃO
        // =====================================================

        btn.disabled =
            true;

        btn.textContent =
            "Criando conta...";


        try{


            console.log(
                "Iniciando cadastro..."
            );


            // =================================================
            // CRIA USUÁRIO NO FIREBASE AUTH
            // =================================================

            const resultado =
                await createUserWithEmailAndPassword(
                    auth,
                    emailValor,
                    senhaValor
                );


            const usuario =
                resultado.user;


            console.log(
                "Usuário criado:",
                usuario.uid
            );


            // =================================================
            // ATUALIZA NOME DO USUÁRIO
            // =================================================

            await updateProfile(
                usuario,
                {
                    displayName:
                        nomeValor
                }
            );


            // =================================================
            // CRIA PERFIL NO FIRESTORE
            // =================================================

            const aluno = {

                id:
                    usuario.uid,

                nome:
                    nomeValor,

                email:
                    emailValor,

                foto:
                    "",

                xp:
                    0,

                moedas:
                    0,

                energia:
                    5,

                sequencia:
                    0,

                nivel:
                    1,

                ativo:
                    true,

                criadoEm:
                    serverTimestamp()

            };


            await setDoc(

                doc(
                    db,
                    "alunos",
                    usuario.uid
                ),

                aluno

            );


            console.log(
                "Perfil criado no Firestore."
            );


            // =================================================
            // SALVA CÓPIA LOCAL
            // =================================================

            localStorage.setItem(

                "aprendeAluno",

                JSON.stringify({

                    ...aluno,

                    criadoEm:
                        new Date().toISOString()

                })

            );


            // =================================================
            // SUCESSO
            // =================================================

            mostrarMensagem(
                "Conta criada com sucesso!",
                "sucesso"
            );


            btn.textContent =
                "Abrindo Aprende+...";


            // =================================================
            // ENTRA NO INDEX
            // =================================================

            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                500
            );


        }catch(erro){

            console.error(
                "Erro no cadastro:",
                erro
            );


            let texto =
                "Não foi possível criar a conta.";


            switch(
                erro.code
            ){

                case
                "auth/email-already-in-use":

                    texto =
                        "Este e-mail já está cadastrado.";

                    break;


                case
                "auth/invalid-email":

                    texto =
                        "Digite um e-mail válido.";

                    break;


                case
                "auth/weak-password":

                    texto =
                        "A senha é muito fraca. Use pelo menos 6 caracteres.";

                    break;


                case
                "auth/network-request-failed":

                    texto =
                        "Verifique sua conexão com a internet.";

                    break;


                case
                "permission-denied":

                    texto =
                        "O Firebase não permitiu criar o perfil do aluno.";

                    break;


                default:

                    texto =
                        erro.message ||
                        "Não foi possível criar a conta.";

            }


            mostrarMensagem(
                texto,
                "erro"
            );


            btn.disabled =
                false;

            btn.textContent =
                "Criar minha conta";

        }

    }
);

</script>

</body>

</html>
