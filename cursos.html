<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meus Cursos</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#1f2937;
}

header{
    background:#4f46e5;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

header h1{
    font-size:23px;
}

.header-direita{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.saldo{
    background:rgba(255,255,255,.15);
    padding:9px 13px;
    border-radius:10px;
    font-weight:bold;
}

.btn{
    border:0;
    border-radius:10px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-carteira{
    background:white;
    color:#4f46e5;
}

.btn-sair{
    background:#ef4444;
    color:white;
}

.container{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:25px 15px 50px;
}

.topo{
    margin-bottom:25px;
}

.topo h2{
    font-size:28px;
    margin-bottom:7px;
}

.topo p{
    color:#6b7280;
}

.pesquisa{
    margin-top:20px;
    margin-bottom:25px;
}

.pesquisa input{
    width:100%;
    padding:14px 16px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.pesquisa input:focus{
    border-color:#4f46e5;
}

.cursos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.curso{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    transition:.2s;
    display:flex;
    flex-direction:column;
}

.curso:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.imagem{
    width:100%;
    height:180px;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.imagem img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.sem-imagem{
    font-size:55px;
}

.conteudo{
    padding:18px;
    flex:1;
    display:flex;
    flex-direction:column;
}

.conteudo h3{
    font-size:20px;
    margin-bottom:8px;
}

.descricao{
    color:#6b7280;
    line-height:1.5;
    font-size:14px;
    margin-bottom:15px;
}

.nivel{
    display:inline-block;
    width:max-content;
    background:#eef2ff;
    color:#4338ca;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:15px;
}

.btn-entrar{
    width:100%;
    background:#4f46e5;
    color:white;
    margin-top:auto;
}

.btn-entrar:hover{
    background:#4338ca;
}

.loading{
    text-align:center;
    padding:50px 20px;
    color:#6b7280;
}

.vazio{
    text-align:center;
    background:white;
    border-radius:15px;
    padding:45px 20px;
    color:#6b7280;
}

.erro{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

@media(max-width:900px){
    .cursos{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    header{
        align-items:flex-start;
    }

    .header-direita{
        width:100%;
    }

    .saldo{
        flex:1;
    }

    .cursos{
        grid-template-columns:1fr;
    }

    .topo h2{
        font-size:24px;
    }
}
</style>
</head>

<body>

<header>

    <h1>🎓 Área do Aluno</h1>

    <div class="header-direita">

        <div class="saldo">
            ❤️ <span id="vidas">-</span>
            &nbsp;&nbsp;
            🪙 <span id="moedas">-</span>
            &nbsp;&nbsp;
            ⭐ <span id="xp">-</span>
        </div>

        <button
            class="btn btn-carteira"
            onclick="abrirCarteira()">
            💰 Carteira
        </button>

        <button
            class="btn btn-sair"
            onclick="sair()">
            Sair
        </button>

    </div>

</header>


<div class="container">

    <div class="topo">

        <h2>📚 Meus cursos</h2>

        <p>
            Escolha um curso para começar seus estudos.
        </p>

    </div>


    <div class="pesquisa">

        <input
            type="text"
            id="pesquisa"
            placeholder="🔎 Procurar curso..."
            autocomplete="off">

    </div>


    <div id="mensagem"></div>


    <div id="loading" class="loading">
        Carregando cursos...
    </div>


    <div
        id="listaCursos"
        class="cursos"
        style="display:none;">
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",
    authDomain: "dezenas-1ed47.firebaseapp.com",
    projectId: "dezenas-1ed47",
    storageBucket: "dezenas-1ed47.firebasestorage.app",
    messagingSenderId: "372788277555",
    appId: "1:372788277555:web:1c1a6a80adee1722b54e46",
    measurementId: "G-NMPP8PKPK3"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


let usuarioAtual = null;

let cursos = [];


/* =========================================================
   SEGURANÇA
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "index.html";

            return;
        }

        usuarioAtual = usuario;

        await carregarUsuario();

        await carregarCursos();

    }
);


/* =========================================================
   USUÁRIO
========================================================= */

async function carregarUsuario(){

    try{

        const referencia =
            doc(
                db,
                "usuarios",
                usuarioAtual.uid
            );

        const snap =
            await getDoc(referencia);


        if(!snap.exists()){

            document.getElementById(
                "vidas"
            ).textContent = "0";

            document.getElementById(
                "moedas"
            ).textContent = "0";

            document.getElementById(
                "xp"
            ).textContent = "0";

            return;
        }


        const dados = snap.data();


        document.getElementById(
            "vidas"
        ).textContent =
            Number(
                dados.vidas ?? 0
            );


        document.getElementById(
            "moedas"
        ).textContent =
            Number(
                dados.moedas ?? 0
            );


        document.getElementById(
            "xp"
        ).textContent =
            Number(
                dados.xp ?? 0
            );


    }catch(erro){

        console.error(
            "Erro ao carregar usuário:",
            erro
        );

    }
}


/* =========================================================
   CURSOS
========================================================= */

async function carregarCursos(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "cursos"
                )
            );


        cursos = [];


        snapshot.forEach(item => {

            const dados = item.data();


            if(
                dados.ativo === true
            ){

                cursos.push({
                    id:item.id,
                    ...dados
                });

            }

        });


        cursos.sort(
            (a,b) =>
                String(
                    a.titulo || ""
                ).localeCompare(
                    String(
                        b.titulo || ""
                    )
                )
        );


        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "listaCursos"
        ).style.display = "grid";


        renderizarCursos();


    }catch(erro){

        console.error(
            "Erro ao carregar cursos:",
            erro
        );


        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "listaCursos"
        ).style.display = "block";


        document.getElementById(
            "listaCursos"
        ).innerHTML = `
            <div class="erro">
                Não foi possível carregar os cursos.
                Verifique sua conexão e tente novamente.
            </div>
        `;

    }

}


/* =========================================================
   RENDERIZAÇÃO
========================================================= */

function renderizarCursos(){

    const lista =
        document.getElementById(
            "listaCursos"
        );


    const termo =
        document.getElementById(
            "pesquisa"
        ).value
        .trim()
        .toLowerCase();


    const filtrados =
        cursos.filter(curso => {

            const titulo =
                String(
                    curso.titulo || ""
                ).toLowerCase();

            const descricao =
                String(
                    curso.descricao || ""
                ).toLowerCase();

            const nivel =
                String(
                    curso.nivel || ""
                ).toLowerCase();


            return (
                titulo.includes(termo) ||
                descricao.includes(termo) ||
                nivel.includes(termo)
            );

        });


    if(filtrados.length === 0){

        lista.innerHTML = `
            <div class="vazio">
                <div style="font-size:50px;">
                    📚
                </div>

                <h3 style="margin:15px 0 8px;">
                    Nenhum curso encontrado
                </h3>

                <p>
                    Tente procurar por outro nome.
                </p>
            </div>
        `;

        return;
    }


    lista.innerHTML =
        filtrados.map(
            curso => criarCursoHTML(curso)
        ).join("");


    document
        .querySelectorAll(
            "[data-curso]"
        )
        .forEach(botao => {

            botao.addEventListener(
                "click",
                () => {

                    const id =
                        botao.dataset.curso;

                    abrirCurso(id);

                }
            );

        });

}


/* =========================================================
   CARD
========================================================= */

function criarCursoHTML(curso){

    const titulo =
        escapar(
            curso.titulo ||
            "Curso sem título"
        );


    const descricao =
        escapar(
            curso.descricao ||
            "Comece este curso e avance em seus estudos."
        );


    const nivel =
        escapar(
            curso.nivel ||
            "Iniciante"
        );


    const imagem =
        String(
            curso.imagem || ""
        ).trim();


    let imagemHTML;


    if(imagem){

        imagemHTML = `
            <img
                src="${escapar(imagem)}"
                alt="${titulo}"
                loading="lazy"
                onerror="this.style.display='none';
                this.parentElement.innerHTML='<div class=\\'sem-imagem\\'>📚</div>';">
        `;

    }else{

        imagemHTML = `
            <div class="sem-imagem">
                📚
            </div>
        `;

    }


    return `
        <article class="curso">

            <div class="imagem">
                ${imagemHTML}
            </div>

            <div class="conteudo">

                <h3>
                    ${titulo}
                </h3>

                <div class="nivel">
                    ${nivel}
                </div>

                <p class="descricao">
                    ${descricao}
                </p>

                <button
                    class="btn btn-entrar"
                    data-curso="${curso.id}">
                    🚀 Entrar no curso
                </button>

            </div>

        </article>
    `;

}


/* =========================================================
   ABRIR CURSO
========================================================= */

function abrirCurso(id){

    window.location.href =
        "curso.html?cursoId=" +
        encodeURIComponent(id);

}


/* =========================================================
   PESQUISA
========================================================= */

document
    .getElementById("pesquisa")
    .addEventListener(
        "input",
        renderizarCursos
    );


/* =========================================================
   CARTEIRA
========================================================= */

window.abrirCarteira = function(){

    window.location.href =
        "carteira.html";

};


/* =========================================================
   SAIR
========================================================= */

window.sair = async function(){

    try{

        await signOut(auth);

        window.location.href =
            "index.html";

    }catch(erro){

        console.error(
            "Erro ao sair:",
            erro
        );

        alert(
            "Não foi possível sair."
        );

    }

};


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escapar(valor){

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
```
