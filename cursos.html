</style>

</head>

<body>


<header>

    <h1>
        📚 Cursos
    </h1>


    <div class="header-right">

        <div class="badge">
            ❤️ <span id="vidas">0</span>
        </div>

        <div class="badge">
            🪙 <span id="moedas">0</span>
        </div>

        <div class="badge">
            ⭐ <span id="xp">0</span> XP
        </div>


        <button
            class="btn-white"
            id="btnCarteira"
        >
            💰 Carteira
        </button>


        <button
            class="btn-white"
            id="btnSair"
        >
            Sair
        </button>

    </div>

</header>


<main class="container">


    <section class="topo">

        <h2>
            Encontre seu próximo curso
        </h2>

        <p>
            Escolha um curso gratuito ou adquira um curso pago.
        </p>


        <input
            type="search"
            id="pesquisa"
            class="pesquisa"
            placeholder="🔎 Pesquisar curso..."
        >

    </section>


    <div id="mensagem"></div>


    <section
        id="listaCursos"
        class="grid"
    >

        <div class="loading">
            Carregando cursos...
        </div>

    </section>


</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",

    authDomain:
        "dezenas-1ed47.firebaseapp.com",

    projectId:
        "dezenas-1ed47",

    storageBucket:
        "dezenas-1ed47.firebasestorage.app",

    messagingSenderId:
        "372788277555",

    appId:
        "1:372788277555:web:1c1a6a80adee1722b54e46",

    measurementId:
        "G-NMPP8PKPK3"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =========================================================
   ELEMENTOS
========================================================= */

const listaCursos =
    document.getElementById(
        "listaCursos"
    );


const pesquisa =
    document.getElementById(
        "pesquisa"
    );


const vidas =
    document.getElementById(
        "vidas"
    );


const moedas =
    document.getElementById(
        "moedas"
    );


const xp =
    document.getElementById(
        "xp"
    );


const mensagem =
    document.getElementById(
        "mensagem"
    );


const btnCarteira =
    document.getElementById(
        "btnCarteira"
    );


const btnSair =
    document.getElementById(
        "btnSair"
    );


/* =========================================================
   ESTADO
========================================================= */

let cursos = [];

let usuarioAtual = null;


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapar(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }


    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   MOEDA
========================================================= */

function formatarMoeda(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =========================================================
   CARREGAR USUÁRIO
========================================================= */

async function carregarUsuario(uid){

    const ref =
        doc(
            db,
            "usuarios",
            uid
        );


    const snap =
        await getDoc(ref);


    if(!snap.exists()){

        return;

    }


    usuarioAtual = {

        id:snap.id,

        ...snap.data()

    };


    vidas.textContent =
        usuarioAtual.vidas ?? 0;


    moedas.textContent =
        usuarioAtual.moedas ?? 0;


    xp.textContent =
        usuarioAtual.xp ?? 0;

}


/* =========================================================
   VERIFICAR ACESSO
========================================================= */

async function verificarAcessoCurso(
    cursoId
){

    /*
       CURSO GRATUITO:

       acesso imediato.

       CURSO PAGO:

       futuramente verificaremos aqui
       a coleção "compras".

       Neste momento, como ainda não existe
       o sistema de pagamento PIX, retornamos
       false para cursos pagos.
    */


    const curso =
        cursos.find(
            item => item.id === cursoId
        );


    if(!curso){

        return false;

    }


    const tipo =
        curso.tipo || "gratuito";


    if(tipo === "gratuito"){

        return true;

    }


    if(!usuarioAtual){

        return false;

    }


    /*
       Estrutura preparada para o futuro:

       compras/{compraId}

       usuarioId
       cursoId
       tipo: "curso"
       valor
       status: "pago"

       Por enquanto vamos procurar
       uma compra confirmada.
    */


    try{

        const q =
            query(

                collection(
                    db,
                    "compras"
                ),

                where(
                    "usuarioId",
                    "==",
                    usuarioAtual.id
                ),

                where(
                    "cursoId",
                    "==",
                    cursoId
                ),

                where(
                    "tipo",
                    "==",
                    "curso"
                ),

                where(
                    "status",
                    "==",
                    "pago"
                )

            );


        const snap =
            await getDocs(q);


        return !snap.empty;


    }catch(erro){

        /*
           Caso a coleção ainda não exista
           ou a consulta precise de índice,
           não liberamos o curso.
        */

        console.warn(
            "Acesso pago ainda não confirmado:",
            erro
        );


        return false;

    }

}


/* =========================================================
   CARREGAR CURSOS
========================================================= */

async function carregarCursos(){

    try{

        const q =
            query(

                collection(
                    db,
                    "cursos"
                ),

                where(
                    "ativo",
                    "==",
                    true
                )

            );


        const snap =
            await getDocs(q);


        cursos = [];


        snap.forEach(item => {

            cursos.push({

                id:item.id,

                ...item.data()

            });

        });


        cursos.sort(
            (a,b) =>
                String(
                    a.titulo || ""
                ).localeCompare(
                    String(
                        b.titulo || ""
                    ),
                    "pt-BR"
                )
        );


        renderizar();


    }catch(erro){

        console.error(
            "Erro ao carregar cursos:",
            erro
        );


        listaCursos.innerHTML = `

            <div class="vazio">

                <h3>
                    ⚠️ Erro ao carregar cursos
                </h3>

                <p>
                    ${escapar(
                        erro.message
                    )}
                </p>

            </div>

        `;

    }

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar(){

    const termo =
        pesquisa.value
            .trim()
            .toLowerCase();


    const filtrados =
        cursos.filter(curso => {

            const texto = (

                curso.titulo || ""

            ) + " " + (

                curso.descricao || ""

            ) + " " + (

                curso.nivel || ""

            );


            return texto
                .toLowerCase()
                .includes(termo);

        });


    listaCursos.innerHTML = "";


    if(filtrados.length === 0){

        listaCursos.innerHTML = `

            <div class="vazio">

                <h3>
                    📚 Nenhum curso encontrado
                </h3>

                <p>
                    Tente pesquisar por outro nome.
                </p>

            </div>

        `;

        return;

    }


    filtrados.forEach(curso => {

        const tipo =
            curso.tipo || "gratuito";


        const gratuito =
            tipo === "gratuito";


        const valor =
            Number(
                curso.valor || 0
            );


        const card =
            document.createElement(
                "article"
            );


        card.className =
            "curso";


        const imagem =
            curso.imagem
            ?
            escapar(curso.imagem)
            :
            "";


        card.innerHTML = `

            ${
                imagem
                ?
                `
                <img
                    class="curso-imagem"
                    src="${imagem}"
                    alt="${escapar(curso.titulo)}"
                >
                `
                :
                `
                <div
                    class="curso-imagem"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:50px;
                    "
                >
                    📚
                </div>
                `
            }


            <div class="curso-conteudo">


                <h3>
                    ${escapar(
                        curso.titulo ||
                        "Curso"
                    )}
                </h3>


                <div class="badges">

                    <span class="badge-curso badge-nivel">
                        ${escapar(
                            curso.nivel ||
                            "Iniciante"
                        )}
                    </span>


                    ${
                        gratuito
                        ?
                        `
                        <span
                            class="
                                badge-curso
                                badge-gratis
                            "
                        >
                            🆓 Gratuito
                        </span>
                        `
                        :
                        `
                        <span
                            class="
                                badge-curso
                                badge-pago
                            "
                        >
                            💰 Curso pago
                        </span>
                        `
                    }

                </div>


                <p class="descricao">

                    ${escapar(
                        curso.descricao ||
                        "Conheça este curso."
                    )}

                </p>


                <div
                    class="
                        preco
                        ${
                            gratuito
                            ?
                            "preco-gratis"
                            :
                            "preco-pago"
                        }
                    "
                >

                    ${
                        gratuito
                        ?
                        "Grátis"
                        :
                        formatarMoeda(valor)
                    }

                </div>


                <div class="curso-acoes">

                    ${
                        gratuito
                        ?
                        `
                        <button
                            class="btn-success"
                            data-acao="acessar"
                            data-id="${curso.id}"
                        >
                            🎓 Acessar curso
                        </button>
                        `
                        :
                        `
                        <button
                            class="btn-warning"
                            data-acao="comprar"
                            data-id="${curso.id}"
                        >
                            💳 Comprar curso
                        </button>
                        `
                    }

                </div>

            </div>

        `;


        listaCursos.appendChild(
            card
        );

    });

}


/* =========================================================
   CLIQUE NOS CURSOS
========================================================= */

listaCursos.addEventListener(
    "click",
    async evento => {

        const botao =
            evento.target.closest(
                "button[data-acao]"
            );


        if(!botao){

            return;

        }


        const cursoId =
            botao.dataset.id;


        const acao =
            botao.dataset.acao;


        const curso =
            cursos.find(
                item =>
                    item.id === cursoId
            );


        if(!curso){

            return;

        }


        /* =================================================
           CURSO GRATUITO
        ================================================= */

        if(acao === "acessar"){

            window.location.href =
                `curso.html?cursoId=${encodeURIComponent(cursoId)}`;

            return;

        }


        /* =================================================
           CURSO PAGO
        ================================================= */

        if(acao === "comprar"){

            botao.disabled =
                true;

            botao.textContent =
                "Verificando...";


            const acesso =
                await verificarAcessoCurso(
                    cursoId
                );


            if(acesso){

                window.location.href =
                    `curso.html?cursoId=${encodeURIComponent(cursoId)}`;

                return;

            }


            /*
               Ainda não existe pagamento confirmado.
               Enviamos o aluno para a página de pagamento.
            */

            window.location.href =
                `pagamento.html?cursoId=${encodeURIComponent(cursoId)}`;

        }

    }
);


/* =========================================================
   PESQUISA
========================================================= */

pesquisa.addEventListener(
    "input",
    renderizar
);


/* =========================================================
   CARTEIRA
========================================================= */

btnCarteira.addEventListener(
    "click",
    () => {

        window.location.href =
            "carteira.html";

    }
);


/* =========================================================
   SAIR
========================================================= */

btnSair.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

            window.location.href =
                "index.html";

        }catch(erro){

            console.error(
                "Erro ao sair:",
                erro
            );

        }

    }
);


/* =========================================================
   AUTENTICAÇÃO
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "index.html";

            return;

        }


        try{

            await carregarUsuario(
                usuario.uid
            );


            await carregarCursos();

        }catch(erro){

            console.error(
                erro
            );

        }

    }
);

</script>

</body>
</html>
