.card{

}

========================================================== */

@media(max-width:600px){

    .topo h1{

        font-size:24px;
    }

        grid-template-columns:

}

</style>

<script type="module">


// ============================================================
// FIREBASE
// ============================================================

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ============================================================
// CONFIGURAÇÃO
// ============================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyC4AAbC8vCFAmlPlur12Nm7YBKPjaSjumM",

    authDomain:
        "meuappweb-65522.firebaseapp.com",

    projectId:
        "meuappweb-65522",

    storageBucket:
        "meuappweb-65522.firebasestorage.app",

    messagingSenderId:
        "305368794616",

    appId:
        "1:305368794616:web:3199c6836a986d896ac20d",

    measurementId:
        "G-QN7GFD99N0"

};


// ============================================================
// INICIALIZAÇÃO
// ============================================================

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


// ============================================================
// ELEMENTOS
// ============================================================

const gridCursos =
    document.getElementById(
        "gridCursos"
    );

const carregando =
    document.getElementById(
        "carregando"
    );

const pesquisa =
    document.getElementById(
        "pesquisa"
    );

const mensagem =
    document.getElementById(
        "mensagem"
    );

const modal =
    document.getElementById(
        "modal"
    );

const modalTitulo =
    document.getElementById(
        "modalTitulo"
    );

const modalDescricao =
    document.getElementById(
        "modalDescricao"
    );

const modalUnidades =
    document.getElementById(
        "modalUnidades"
    );

const modalBotao =
    document.getElementById(
        "modalBotao"
    );

const fecharModal =
    document.getElementById(
        "fecharModal"
    );


// ============================================================
// VARIÁVEIS
// ============================================================

let aluno = null;

let cursos = [];

let matriculas = [];

let cursoSelecionado = null;


// ============================================================
// MENSAGEM
// ============================================================

function mostrarMensagem(
    texto,
    tipo = "erro"
){

    mensagem.textContent =
        texto;

    mensagem.className =
        "mensagem " + tipo;


    setTimeout(
        function(){

            mensagem.className =
                "mensagem";

        },
        4000
    );

}


// ============================================================
// ESCAPAR HTML
// ============================================================

function escapar(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// ============================================================
// ID
// ============================================================

function gerarId(){

    return Date.now().toString(36)
        +
        Math.random()
            .toString(36)
            .substring(2,8);

}


// ============================================================
// CARREGAR DADOS DO ALUNO
// ============================================================

async function carregarAluno(
    usuario
){

    const alunoRef =
        doc(
            db,
            "alunos",
            usuario.uid
        );


    const alunoSnap =
        await getDoc(
            alunoRef
        );


    if(
        !alunoSnap.exists()
    ){

        aluno = {

            id:
                usuario.uid,

            nome:
                usuario.displayName ||
                "Estudante",

            email:
                usuario.email ||
                "",

            xp:0,

            moedas:0,

            energia:5,

            sequencia:0,

            nivel:1,

            ativo:true

        };

    }else{

        const dados =
            alunoSnap.data();


        if(
            dados.ativo === false
        ){

            mostrarMensagem(
                "Sua conta está desativada."
            );

            return false;

        }


        aluno = {

            id:
                usuario.uid,

            ...dados

        };

    }


    localStorage.setItem(
        "aprendeAluno",
        JSON.stringify(aluno)
    );


    return true;

}


// ============================================================
// CARREGAR CURSOS
// ============================================================

async function carregarCursos(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "cursos"
            )
        );


    cursos = [];


    snapshot.forEach(
        function(documento){

            const dados =
                documento.data();


            cursos.push({

                id:
                    documento.id,

                ...dados

            });

        }
    );


    cursos =
        cursos.filter(
            function(curso){

                return curso.ativo !== false;

            }
        );


    cursos.sort(
        function(a,b){

            return String(
                a.nome || ""
            ).localeCompare(
                String(
                    b.nome || ""
                )
            );

        }
    );

}


// ============================================================
// CARREGAR MATRÍCULAS
// ============================================================

async function carregarMatriculas(){

    if(!aluno){

        return;

    }


    const snapshot =
        await getDocs(
            collection(
                db,
                "matriculas"
            )
        );


    matriculas = [];


    snapshot.forEach(
        function(documento){

            const dados =
                documento.data();


            if(
                dados.alunoId ===
                aluno.id
            ){

                matriculas.push({

                    id:
                        documento.id,

                    ...dados

                });

            }

        }
    );

}


// ============================================================
// MATRÍCULA DO CURSO
// ============================================================

function encontrarMatricula(
    cursoId
){

    return matriculas.find(
        function(matricula){

            return (
                matricula.cursoId ===
                cursoId
            )
            &&
            matricula.ativa !== false;

        }
    );

}


// ============================================================
// TOTAL DE LIÇÕES
// ============================================================

function contarLicoes(
    curso
){

    let total = 0;


    if(
        Array.isArray(
            curso.unidades
        )
    ){

        curso.unidades.forEach(
            function(unidade){

                if(
                    unidade.ativo === false
                ){

                    return;

                }


                if(
                    Array.isArray(
                        unidade.licoes
                    )
                ){

                    total +=
                        unidade.licoes
                            .filter(
                                function(licao){

                                    return (
                                        licao.ativo !== false
                                    );

                                }
                            )
                            .length;

                }

            }
        );

    }


    return total;

}


// ============================================================
// RENDERIZAR CURSOS
// ============================================================

function renderizar(){

    const termo =
        pesquisa.value
            .trim()
            .toLowerCase();


    const lista =
        cursos.filter(
            function(curso){

                const nome =
                    String(
                        curso.nome || ""
                    ).toLowerCase();


                const descricao =
                    String(
                        curso.descricao || ""
                    ).toLowerCase();


                return (
                    nome.includes(termo)
                    ||
                    descricao.includes(termo)
                );

            }
        );


    gridCursos.innerHTML = "";


    if(
        lista.length === 0
    ){

        gridCursos.innerHTML = `

            <div class="vazio">

                <div class="vazio-icon">
                    🔎
                </div>

                <h3>
                    Nenhum curso encontrado
                </h3>

                <p>
                    Tente pesquisar por outro termo.
                </p>

            </div>

        `;

        return;

    }


    lista.forEach(
        function(curso){

            const matricula =
                encontrarMatricula(
                    curso.id
                );


            const totalLicoes =
                contarLicoes(
                    curso
                );


            let concluidas = 0;


            if(matricula){

                concluidas =
                    Array.isArray(
                        matricula.licoesConcluidas
                    )
                    ?
                    matricula
                        .licoesConcluidas
                        .length
                    :
                    0;

            }


            let progresso = 0;


            if(
                totalLicoes > 0
            ){

                progresso =
                    Math.round(
                        (
                            concluidas /
                            totalLicoes
                        )
                        * 100
                    );

            }


            progresso =
                Math.max(
                    0,
                    Math.min(
                        100,
                        progresso
                    )
                );


            const icone =
                curso.icone ||
                "📚";


            const nome =
                escapar(
                    curso.nome ||
                    "Curso"
                );


            const descricao =
                escapar(
                    curso.descricao ||
                    "Comece a aprender."
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML = `

                <div class="card-topo">

                    <div class="icone">
                        ${icone}
                    </div>

                </div>


                <div class="card-corpo">

                    <h2>
                        ${nome}
                    </h2>

                    <div class="descricao">
                        ${descricao}
                    </div>


                    ${
                        matricula
                        ?
                        `
                        <div class="progresso-area">

                            <div class="progresso-info">

                                <span>
                                    Progresso
                                </span>

                                <strong>
                                    ${progresso}%
                                </strong>

                            </div>

                            <div class="progresso">

                                <div
                                    class="progresso-barra"
                                    style="width:${progresso}%"
                                ></div>

                            </div>

                        </div>
                        `
                        :
                        ""
                    }


                    <button
                        class="btn ${matricula ? "matriculado" : ""}"
                        data-curso="${escapar(curso.id)}"
                    >

                        ${
                            matricula
                            ?
                            "▶ Continuar curso"
                            :
                            "Ver curso"
                        }

                    </button>

                </div>

            `;


            const botao =
                card.querySelector(
                    ".btn"
                );


            botao.addEventListener(
                "click",
                function(){

                    abrirModal(
                        curso
                    );

                }
            );


            gridCursos.appendChild(
                card
            );

        }
    );

}


// ============================================================
// ABRIR MODAL
// ============================================================

function abrirModal(
    curso
){

    cursoSelecionado =
        curso;


    modalTitulo.textContent =
        curso.nome ||
        "Curso";


    modalDescricao.textContent =
        curso.descricao ||
        "Comece sua jornada de aprendizado.";


    modalUnidades.innerHTML =
        "";


    const unidades =
        Array.isArray(
            curso.unidades
        )
        ?
        curso.unidades
            .filter(
                function(unidade){

                    return unidade.ativo !== false;

                }
            )
            .sort(
                function(a,b){

                    return (
                        Number(a.ordem || 0)
                        -
                        Number(b.ordem || 0)
                    );

                }
            )
        :
        [];


    if(
        unidades.length === 0
    ){

        modalUnidades.innerHTML = `

            <div class="unidade">
                📚 Conteúdo em preparação.
            </div>

        `;

    }else{

        unidades.forEach(
            function(unidade,index){

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "unidade";


                div.textContent =
                    `${index + 1}. ${
                        unidade.nome ||
                        "Unidade"
                    }`;


                modalUnidades.appendChild(
                    div
                );

            }
        );

    }


    const matricula =
        encontrarMatricula(
            curso.id
        );


    modalBotao.textContent =
        matricula
        ?
        "▶ Continuar curso"
        :
        "🎓 Matricular-se";


    modal.classList.add(
        "ativo"
    );

}


// ============================================================
// FECHAR MODAL
// ============================================================

function fechar(){

    modal.classList.remove(
        "ativo"
    );

    cursoSelecionado =
        null;

}


fecharModal.addEventListener(
    "click",
    fechar
);


modal.addEventListener(
    "click",
    function(event){

        if(
            event.target === modal
        ){

            fechar();

        }

    }
);


// ============================================================
// MATRICULAR / CONTINUAR
// ============================================================

modalBotao.addEventListener(
    "click",
    async function(){

        if(
            !cursoSelecionado ||
            !aluno
        ){

            return;

        }


        const curso =
            cursoSelecionado;


        const matriculaExistente =
            encontrarMatricula(
                curso.id
            );


        // =====================================================
        // JÁ MATRICULADO
        // =====================================================

        if(
            matriculaExistente
        ){

            abrirPrimeiraLicao(
                curso,
                matriculaExistente
            );

            return;

        }


        modalBotao.disabled =
            true;

        modalBotao.textContent =
            "Matriculando...";


        try{

            const matriculaId =
                aluno.id +
                "_" +
                curso.id;


            const matriculaRef =
                doc(
                    db,
                    "matriculas",
                    matriculaId
                );


            const matriculaSnap =
                await getDoc(
                    matriculaRef
                );


            if(
                matriculaSnap.exists()
            ){

                const existente =
                    {

                        id:
                            matriculaSnap.id,

                        ...matriculaSnap.data()

                    };


                matriculas.push(
                    existente
                );


                abrirPrimeiraLicao(
                    curso,
                    existente
                );


                return;

            }


            const novaMatricula = {

                id:
                    matriculaId,

                alunoId:
                    aluno.id,

                alunoNome:
                    aluno.nome ||
                    "Estudante",

                cursoId:
                    curso.id,

                cursoNome:
                    curso.nome ||
                    "Curso",

                ativa:
                    true,

                progresso:
                    0,

                licoesConcluidas:
                    [],

                matriculadoEm:
                    serverTimestamp()

            };


            await setDoc(
                matriculaRef,
                novaMatricula
            );


            matriculas.push({

                ...novaMatricula,

                id:
                    matriculaId

            });


            mostrarMensagem(
                "Matrícula realizada com sucesso!",
                "sucesso"
            );


            renderizar();


            setTimeout(
                function(){

                    abrirPrimeiraLicao(
                        curso,
                        novaMatricula
                    );

                },
                500
            );


        }catch(erro){

            console.error(
                "Erro ao matricular:",
                erro
            );


            mostrarMensagem(
                "Não foi possível realizar a matrícula. Verifique as regras do Firestore."
            );


            modalBotao.disabled =
                false;

            modalBotao.textContent =
                "🎓 Matricular-se";

        }

    }
);


// ============================================================
// PRIMEIRA LIÇÃO
// ============================================================

function abrirPrimeiraLicao(
    curso,
    matricula
){

    let unidadeEscolhida =
        null;

    let licaoEscolhida =
        null;


    const unidades =
        Array.isArray(
            curso.unidades
        )
        ?
        curso.unidades
            .filter(
                function(unidade){

                    return unidade.ativo !== false;

                }
            )
            .sort(
                function(a,b){

                    return (
                        Number(a.ordem || 0)
                        -
                        Number(b.ordem || 0)
                    );

                }
            )
        :
        [];


    for(
        const unidade of unidades
    ){

        const licoes =
            Array.isArray(
                unidade.licoes
            )
            ?
            unidade.licoes
                .filter(
                    function(licao){

                        return licao.ativo !== false;

                    }
                )
                .sort(
                    function(a,b){

                        return (
                            Number(a.ordem || 0)
                            -
                            Number(b.ordem || 0)
                        );

                    }
                )
            :
            [];


        for(
            const licao of licoes
        ){

            const concluida =
                Array.isArray(
                    matricula.licoesConcluidas
                )
                &&
                matricula
                    .licoesConcluidas
                    .includes(
                        licao.id
                    );


            if(
                !concluida
            ){

                unidadeEscolhida =
                    unidade;

                licaoEscolhida =
                    licao;

                break;

            }

        }


        if(
            licaoEscolhida
        ){

            break;

        }

    }


    fechar();


    if(
        licaoEscolhida &&
        unidadeEscolhida
    ){

        window.location.href =
            "licao.html"
            +
            "?cursoId="
            +
            encodeURIComponent(
                curso.id
            )
            +
            "&unidadeId="
            +
            encodeURIComponent(
                unidadeEscolhida.id
            )
            +
            "&licaoId="
            +
            encodeURIComponent(
                licaoEscolhida.id
            );

        return;

    }


    mostrarMensagem(
        "Este curso ainda não possui lições disponíveis."
    );

}
