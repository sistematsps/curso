<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Conhecimentos Gerais</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;color:#172033;min-height:100vh}
header{background:linear-gradient(135deg,#172554,#2563eb);color:#fff;padding:28px 18px;text-align:center}
header h1{font-size:28px;margin-bottom:7px}
header p{opacity:.9}
.container{max-width:1000px;margin:25px auto;padding:0 16px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08);margin-bottom:18px}
.hidden{display:none!important}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.level-btn{border:0;border-radius:14px;padding:20px;background:#e8eefc;color:#172554;font-weight:bold;font-size:16px;cursor:pointer;transition:.2s}
.level-btn:hover{transform:translateY(-2px);background:#dbe7ff}
.level-btn.locked{opacity:.45;cursor:not-allowed}
.level-btn.done{background:#dcfce7;color:#166534}
.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.badge{background:#e8eefc;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:bold}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0 24px}
.progress div{height:100%;width:0;background:#2563eb;transition:.25s}
.question{font-size:22px;line-height:1.4;margin:12px 0 22px}
.option{display:block;width:100%;text-align:left;border:2px solid #e5e7eb;background:#fff;padding:15px;margin:10px 0;border-radius:12px;cursor:pointer;font-size:16px}
.option:hover{border-color:#2563eb;background:#f8fbff}
.option.selected{border-color:#2563eb;background:#eff6ff}
.option.correct{border-color:#16a34a;background:#f0fdf4}
.option.wrong{border-color:#dc2626;background:#fef2f2}
button.action{border:0;border-radius:12px;padding:13px 20px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
button.secondary{background:#64748b}
button.action:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.result{text-align:center}
.score{font-size:48px;font-weight:800;margin:12px 0}
.status{font-size:22px;font-weight:bold;margin-bottom:15px}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.stat{background:#f1f5f9;border-radius:12px;padding:12px 18px}
.small{font-size:13px;color:#64748b}
@media(max-width:600px){header h1{font-size:23px}.question{font-size:19px}.card{padding:18px}}
</style>
</head>
<body>

<header>
<h1>Quiz de Conhecimentos Gerais</h1>
<p>10 níveis • 60 perguntas por nível</p>
</header>

<div class="container">

<section id="home" class="card">
<div class="topbar">
<div>
<h2>Escolha um nível</h2>
<p class="small">Os níveis são liberados conforme o desempenho.</p>
</div>
</div>
<div id="levels" class="levels"></div>
</section>

<section id="quiz" class="card hidden">
<div class="topbar">
<span id="levelLabel" class="badge"></span>
<span id="counter" class="badge"></span>
</div>
<div class="progress"><div id="progressBar"></div></div>
<div id="theme" class="small"></div>
<div id="question" class="question"></div>
<div id="options"></div>
<div class="actions">
<button class="action secondary" onclick="voltarNiveis()">Níveis</button>
<button id="nextBtn" class="action" onclick="proxima()" disabled>Responder</button>
</div>
</section>

<section id="result" class="card hidden result">
<h2>Resultado do nível</h2>
<div id="score" class="score"></div>
<div id="status" class="status"></div>
<div class="stats">
<div class="stat">Acertos: <b id="hits"></b></div>
<div class="stat">Erros: <b id="errors"></b></div>
<div class="stat">Aproveitamento: <b id="percent"></b></div>
</div>
<p id="resultMessage"></p>
<div class="actions">
<button class="action secondary" onclick="voltarNiveis()">Voltar aos níveis</button>
<button id="retryBtn" class="action" onclick="repetirNivel()">Refazer nível</button>
</div>
</section>

</div>

 "n10_q60", "tema": "Português", "pergunta": "Qual destas palavras é oxítona?", "opcoes": ["Café", "Lâmpada", "Árvore", "Médico"], "correta": 0}]];

const APROVACAO = 70;
let nivelAtual = 0;
let perguntas = [];
let indice = 0;
let acertos = 0;
let respondida = false;
let selecionada = null;

const progresso = JSON.parse(localStorage.getItem("quizConhecimentosGerais") || "{}");

function salvarProgresso(){
    localStorage.setItem("quizConhecimentosGerais", JSON.stringify(progresso));
}

function nivelLiberado(n){
    if(n === 1) return true;
    return !!progresso[n-1];
}

function renderNiveis(){
    const box = document.getElementById("levels");
    box.innerHTML = "";
    for(let n=1;n<=10;n++){
        const btn = document.createElement("button");
        btn.className = "level-btn";
        const concluido = !!progresso[n];
        if(concluido) btn.classList.add("done");
        if(!nivelLiberado(n)){
            btn.classList.add("locked");
            btn.disabled = true;
            btn.textContent = "🔒 Nível " + n;
        }else{
            btn.textContent = concluido ? "✓ Nível " + n : "Nível " + n;
            btn.onclick = ()=>iniciarNivel(n);
        }
        box.appendChild(btn);
    }
}

function mostrar(id){
    ["home","quiz","result"].forEach(x=>document.getElementById(x).classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
}

function iniciarNivel(n){
    nivelAtual=n;
    perguntas=[...banco[n-1]];
    // Cada nível possui 60 perguntas; embaralhamos apenas as opções e a ordem.
    perguntas.sort(()=>Math.random()-.5);
    perguntas.forEach(q=>{
        const correta=q.opcoes[q.correta];
        q.opcoes=[...q.opcoes].sort(()=>Math.random()-.5);
        q.correta=q.opcoes.indexOf(correta);
    });
    indice=0;
    acertos=0;
    mostrar("quiz");
    carregarPergunta();
}

function carregarPergunta(){
    respondida=false;
    selecionada=null;
    const q=perguntas[indice];
    document.getElementById("levelLabel").textContent="Nível "+nivelAtual;
    document.getElementById("counter").textContent=(indice+1)+" / "+perguntas.length;
    document.getElementById("progressBar").style.width=((indice)/perguntas.length*100)+"%";
    document.getElementById("theme").textContent="Tema: "+q.tema;
    document.getElementById("question").textContent=q.pergunta;
    document.getElementById("nextBtn").disabled=true;
    document.getElementById("nextBtn").textContent="Responder";

    const box=document.getElementById("options");
    box.innerHTML="";
    q.opcoes.forEach((op,i)=>{
        const b=document.createElement("button");
        b.className="option";
        b.textContent=op;
        b.onclick=()=>selecionar(i);
        box.appendChild(b);
    });
}

function selecionar(i){
    if(respondida) return;
    selecionada=i;
    document.querySelectorAll(".option").forEach((b,x)=>{
        b.classList.toggle("selected",x===i);
    });
    document.getElementById("nextBtn").disabled=false;
}

function proxima(){
    if(selecionada===null) return;
    const q=perguntas[indice];
    if(!respondida){
        respondida=true;
        const botoes=document.querySelectorAll(".option");
        botoes.forEach((b,i)=>{
            if(i===q.correta) b.classList.add("correct");
            if(i===selecionada && i!==q.correta) b.classList.add("wrong");
            b.disabled=true;
        });
        if(selecionada===q.correta) acertos++;
        document.getElementById("nextBtn").textContent=indice===perguntas.length-1?"Ver resultado":"Próxima";
        return;
    }
    if(indice<perguntas.length-1){
        indice++;
        carregarPergunta();
    }else{
        finalizar();
    }
}

function finalizar(){
    const percentual=Math.round(acertos/perguntas.length*100);
    const aprovado=percentual>=APROVACAO;
    if(aprovado) progresso[nivelAtual]=true;
    salvarProgresso();

    document.getElementById("score").textContent=acertos+" / "+perguntas.length;
    document.getElementById("hits").textContent=acertos;
    document.getElementById("errors").textContent=perguntas.length-acertos;
    document.getElementById("percent").textContent=percentual+"%";
    document.getElementById("status").textContent=aprovado?"APROVADO ✓":"NÃO APROVADO";
    document.getElementById("status").style.color=aprovado?"#15803d":"#b91c1c";
    document.getElementById("resultMessage").textContent=aprovado
        ? (nivelAtual<10 ? "Parabéns! O próximo nível foi liberado." : "Parabéns! Você concluiu todos os 10 níveis.")
        : "Você precisa de pelo menos "+APROVACAO+"% para liberar o próximo nível.";
    document.getElementById("retryBtn").textContent=aprovado?"Refazer nível":"Tentar novamente";
    mostrar("result");
}

function repetirNivel(){ iniciarNivel(nivelAtual); }

function voltarNiveis(){
    renderNiveis();
    mostrar("home");
}

renderNiveis();
