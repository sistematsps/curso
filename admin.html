<body>

  <header>

    <h1>⚙️ Administração</h1>

    <button
      class="btn-sair"

  <!--

  <main

    <!--

    <section

  <!--
  ============================================================
  FIREBASE

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      doc,
      updateDoc,
      deleteDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /*
    ============================================================
    CONFIGURAÇÃO FIREBASE
    ============================================================
    */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",

      authDomain:
        "dezenas-1ed47.firebaseapp.com",

      projectId:
        "dezenas-1ed47",

      storageBucket:
        "dezenas-1ed47.firebasestorage.app",

      messagingSenderId:
        "372788277555",

      appId:
        "1:372788277555:web:1c1a6a80adee1722b54e46",

      measurementId:
        "G-NMPP8PKPK3"

    };


    /*
    ============================================================
    INICIALIZAÇÃO
    ============================================================
    */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /*
    ============================================================
    ELEMENTOS
    ============================================================
    */

    const areaAdmin =
      document.getElementById("areaAdmin");

    const acessoNegado =
      document.getElementById("acessoNegado");

    const carregando =
      document.getElementById("carregando");

    const formularioCurso =
      document.getElementById("formularioCurso");

    const formCurso =
      document.getElementById("formCurso");

    const listaCursos =
      document.getElementById("listaCursos");

    const pesquisa =
      document.getElementById("pesquisa");

    const mensagem =
      document.getElementById("mensagem");

    const tituloFormulario =
      document.getElementById("tituloFormulario");

    const btnNovoCurso =
      document.getElementById("btnNovoCurso");

    const btnCancelar =
      document.getElementById("btnCancelar");

    const btnSair =
      document.getElementById("btnSair");


    /*
    ============================================================
    VARIÁVEIS
    ============================================================
    */

    let cursos = [];

    let cursoEditando = null;


    /*
    ============================================================
    MENSAGEM
    ============================================================
    */

    function mostrarMensagem(texto, tipo = "sucesso") {

      mensagem.textContent = texto;

      mensagem.className =
        "mensagem " + tipo;

      mensagem.style.display = "block";


      setTimeout(() => {

        mensagem.style.display = "none";

      }, 4000);

    }


    /*
    ============================================================
    ESCAPAR HTML
    ============================================================
    */

    function escapar(valor) {

      if (valor === null || valor === undefined) {
        return "";
      }

      return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
    ============================================================
    ABRIR NOVO CURSO
    ============================================================
    */

    btnNovoCurso.addEventListener("click", () => {

      cursoEditando = null;

      formCurso.reset();

      tituloFormulario.textContent =
        "Novo curso";

      formularioCurso.style.display =
        "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    });


    /*
    ============================================================
    CANCELAR
    ============================================================
    */

    btnCancelar.addEventListener("click", () => {

      fecharFormulario();

    });


    function fecharFormulario() {

      cursoEditando = null;

      formCurso.reset();

      formularioCurso.style.display =
        "none";

    }


    /*
    ============================================================
    PEGAR DADOS
    ============================================================
    */

    function pegarDados() {

      return {

        titulo:
          document.getElementById("titulo")
            .value.trim(),

        descricao:
          document.getElementById("descricao")
            .value.trim(),

        imagem:
          document.getElementById("imagem")
            .value.trim(),

        nivel:
          document.getElementById("nivel")
            .value

      };

    }


    /*
    ============================================================
    SALVAR CURSO
    ============================================================
    */

    formCurso.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const dados =
          pegarDados();


        if (!dados.titulo) {

          mostrarMensagem(
            "Informe o título do curso.",
            "erro"
          );

          return;

        }


        try {

          /*
          ------------------------------------------------------
          EDITAR
          ------------------------------------------------------
          */

          if (cursoEditando) {

            await updateDoc(

              doc(
                db,
                "cursos",
                cursoEditando
              ),

              {

                titulo:
                  dados.titulo,

                descricao:
                  dados.descricao,

                imagem:
                  dados.imagem,

                nivel:
                  dados.nivel,

                atualizadoEm:
                  serverTimestamp()

              }

            );


            mostrarMensagem(
              "Curso atualizado com sucesso!"
            );

          }


          /*
          ------------------------------------------------------
          NOVO CURSO
          ------------------------------------------------------
          */

          else {

            await addDoc(

              collection(
                db,
                "cursos"
              ),

              {

                titulo:
                  dados.titulo,

                descricao:
                  dados.descricao,

                imagem:
                  dados.imagem,

                nivel:
                  dados.nivel,

                ativo:
                  true,

                criadoEm:
                  serverTimestamp(),

                atualizadoEm:
                  serverTimestamp()

              }

            );


            mostrarMensagem(
              "Curso criado com sucesso!"
            );

          }


          fecharFormulario();

          await carregarCursos();

        }


        catch (erro) {

          console.error(
            "Erro ao salvar curso:",
            erro
          );


          mostrarMensagem(
            "Erro ao salvar o curso. Verifique o console.",
            "erro"
          );

        }

      }
    );


    /*
    ============================================================
    CARREGAR CURSOS
    ============================================================
    */

    async function carregarCursos() {

      listaCursos.innerHTML = `

        <tr>

          <td
            colspan="4"
            class="vazio"
          >
            Carregando cursos...
          </td>

        </tr>

      `;


      try {

        const resultado =
          await getDocs(
            collection(
              db,
              "cursos"
            )
          );


        cursos = [];


        resultado.forEach((documento) => {

          cursos.push({

            id:
              documento.id,

            ...documento.data()

          });

        });


        cursos.sort((a, b) => {

          const dataA =
            a.criadoEm?.seconds || 0;

          const dataB =
            b.criadoEm?.seconds || 0;

          return dataB - dataA;

        });


        renderizarCursos();

      }


      catch (erro) {

        console.error(
          "Erro ao carregar cursos:",
          erro
        );


        listaCursos.innerHTML = `

          <tr>

            <td
              colspan="4"
              class="vazio"
            >
              Erro ao carregar os cursos.
            </td>

          </tr>

        `;

      }

    }


    /*
    ============================================================
    RENDERIZAR
    ============================================================
    */

    function renderizarCursos() {

      const termo =
        pesquisa.value
          .trim()
          .toLowerCase();


      const filtrados =
        cursos.filter((curso) => {

          const titulo =
            (curso.titulo || "")
              .toLowerCase();

          const descricao =
            (curso.descricao || "")
              .toLowerCase();

          return (
            titulo.includes(termo) ||
            descricao.includes(termo)
          );

        });


      if (filtrados.length === 0) {

        listaCursos.innerHTML = `

          <tr>

            <td
              colspan="4"
              class="vazio"
            >
              Nenhum curso encontrado.
            </td>

          </tr>

        `;

        return;

      }


      listaCursos.innerHTML =
        filtrados.map((curso) => {

          const status =
            curso.ativo !== false;


          return `

            <tr>

              <td>

                <strong>
                  ${escapar(curso.titulo)}
                </strong>

                ${
                  curso.descricao
                    ? `
                      <br>
                      <small>
                        ${escapar(curso.descricao)}
                      </small>
                    `
                    : ""
                }

              </td>


              <td>
                ${escapar(
                  curso.nivel || "iniciante"
                )}
              </td>


              <td>

                <span
                  class="status ${
                    status
                      ? "ativo"
                      : "inativo"
                  }"
                >

                  ${
                    status
                      ? "Ativo"
                      : "Inativo"
                  }

                </span>

              </td>


              <td>

                <div class="acoes">

                  <button
                    class="btn-editar"
                    onclick="editarCurso('${curso.id}')"
                  >
                    Editar
                  </button>


                  <button
                    class="btn-status"
                    onclick="alterarStatus('${curso.id}')"
                  >

                    ${
                      status
                        ? "Desativar"
                        : "Ativar"
                    }

                  </button>


                  <button
                    class="btn-excluir"
                    onclick="excluirCurso('${curso.id}')"
                  >
                    Excluir
                  </button>

                </div>

              </td>

            </tr>

          `;

        }).join("");

    }


    /*
    ============================================================
    PESQUISA
    ============================================================
    */

    pesquisa.addEventListener(
      "input",
      renderizarCursos
    );


    /*
    ============================================================
    EDITAR CURSO
    ============================================================
    */

    window.editarCurso =
      function(id) {

        const curso =
          cursos.find(
            (item) => item.id === id
          );


        if (!curso) {
          return;
        }


        cursoEditando = id;


        document.getElementById("titulo")
          .value =
          curso.titulo || "";


        document.getElementById("descricao")
          .value =
          curso.descricao || "";


        document.getElementById("imagem")
          .value =
          curso.imagem || "";


        document.getElementById("nivel")
          .value =
          curso.nivel || "iniciante";


        tituloFormulario.textContent =
          "Editar curso";


        formularioCurso.style.display =
          "block";


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      };


    /*
    ============================================================
    ALTERAR STATUS
    ============================================================
    */

    window.alterarStatus =
      async function(id) {

        const curso =
          cursos.find(
            (item) => item.id === id
          );


        if (!curso) {
          return;
        }


        const novoStatus =
          curso.ativo === false;


        try {

          await updateDoc(

            doc(
              db,
              "cursos",
              id
            ),

            {

              ativo:
                novoStatus,

              atualizadoEm:
                serverTimestamp()

            }

          );


          mostrarMensagem(
            novoStatus
              ? "Curso ativado."
              : "Curso desativado."
          );


          await carregarCursos();

        }


        catch (erro) {

          console.error(
            erro
          );


          mostrarMensagem(
            "Erro ao alterar o status.",
            "erro"
          );

        }

      };


    /*
    ============================================================
    EXCLUIR
    ============================================================
    */

    window.excluirCurso =
      async function(id) {

        const curso =
          cursos.find(
            (item) => item.id === id
          );


        if (!curso) {
          return;
        }


        const confirmar =
          confirm(
            `Deseja realmente excluir o curso "${curso.titulo}"?`
          );


        if (!confirmar) {
          return;
        }


        try {

          await deleteDoc(

            doc(
              db,
              "cursos",
              id
            )

          );


          mostrarMensagem(
            "Curso excluído com sucesso!"
          );


          await carregarCursos();

        }


        catch (erro) {

          console.error(
            erro
          );


          mostrarMensagem(
            "Erro ao excluir o curso.",
            "erro"
          );

        }

      };


    /*
    ============================================================
    LOGOUT
    ============================================================
    */

    btnSair.addEventListener(
      "click",
      async () => {

        try {

          await signOut(auth);

          window.location.href =
            "index.html";

        }

        catch (erro) {

          console.error(
            erro
          );

        }

      }
    );


    /*
    ============================================================
    AUTENTICAÇÃO
    ============================================================
    */

    onAuthStateChanged(
      auth,
      async (usuario) => {

        carregando.style.display =
          "none";


        if (!usuario) {

          areaAdmin.style.display =
            "none";

          acessoNegado.style.display =
            "block";

          return;

        }


        /*
        Usuário autenticado.
        Nesta primeira etapa qualquer usuário
        autenticado pode acessar o painel.
        A função de administrador será criada
        posteriormente com segurança no Firestore.
        */

        acessoNegado.style.display =
          "none";
