/* MOBILE */

@media(max-width:650px){

<script type="module">


/* FIREBASE */

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",

    authDomain:
    "dezenas-1ed47.firebaseapp.com",

    projectId:
    "dezenas-1ed47",

    storageBucket:
    "dezenas-1ed47.firebasestorage.app",

    messagingSenderId:
    "372788277555",

    appId:
    "1:372788277555:web:1c1a6a80adee1722b54e46",

    measurementId:
    "G-NMPP8PKPK3"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* ELEMENTOS */

const carregando =
    document.getElementById(
        "carregando"
    );

const resultado =
    document.getElementById(
        "resultado"
    );

const erro =
    document.getElementById(
        "erro"
    );

const vidas =
    document.getElementById(
        "vidas"
    );

const moedas =
    document.getElementById(
        "moedas"
    );

const xp =
    document.getElementById(
        "xp"
    );

const iconeResultado =
    document.getElementById(
        "iconeResultado"
    );

const tituloResultado =
    document.getElementById(
        "tituloResultado"
    );

const subtitulo =
    document.getElementById(
        "subtitulo"
    );

const percentual =
    document.getElementById(
        "percentual"
    );

const status =
    document.getElementById(
        "status"
    );

const cursoNome =
    document.getElementById(
        "cursoNome"
    );

const licaoNome =
    document.getElementById(
        "licaoNome"
    );

const acertos =
    document.getElementById(
        "acertos"
    );

const erros =
    document.getElementById(
        "erros"
    );

const xpGanho =
    document.getElementById(
        "xpGanho"
    );

const moedasGanhas =
    document.getElementById(
        "moedasGanhas"
    );

const aproveitamentoTexto =
    document.getElementById(
        "aproveitamentoTexto"
    );

const btnContinuar =
    document.getElementById(
        "btnContinuar"
    );

const btnRefazer =
    document.getElementById(
        "btnRefazer"
    );

const btnPainel =
    document.getElementById(
        "btnPainel"
    );

const btnCarteira =
    document.getElementById(
        "btnCarteira"
    );

const btnSair =
    document.getElementById(
        "btnSair"
    );


/* URL */

const params =
    new URLSearchParams(
        window.location.search
    );


const cursoId =
    params.get("cursoId");


const moduloId =
    params.get("moduloId");


const licaoId =
    params.get("licaoId");


/* ========================= */
/* ERRO */
/* ========================= */

function mostrarErro(texto){

    carregando.style.display =
        "none";

    resultado.style.display =
        "none";

    erro.style.display =
        "block";

    erro.textContent =
        texto;
}


/* ========================= */
/* CARREGAR USUÁRIO */
/* ========================= */

async function carregarUsuario(uid){

    const ref =
        doc(
            db,
            "usuarios",
            uid
        );


    const snap =
        await getDoc(ref);


    if(!snap.exists()){

        throw new Error(
            "Perfil do aluno não encontrado."
        );

    }


    const dados =
        snap.data();


    vidas.textContent =
        dados.vidas ?? 0;


    moedas.textContent =
        dados.moedas ?? 0;


    xp.textContent =
        dados.xp ?? 0;
}


/* ========================= */
/* CARREGAR CURSO */
/* ========================= */

async function carregarCurso(){

    if(!cursoId){

        cursoNome.textContent =
            "Curso";

        return;
    }


    const ref =
        doc(
            db,
            "cursos",
            cursoId
        );


    const snap =
        await getDoc(ref);


    if(snap.exists()){

        cursoNome.textContent =
            snap.data().titulo ||
            "Curso";

    }

}


/* ========================= */
/* CARREGAR LIÇÃO */
/* ========================= */

async function carregarLicao(){

    if(!licaoId){

        licaoNome.textContent =
            "Lição";

        return;
    }


    const ref =
        doc(
            db,
            "licoes",
            licaoId
        );


    const snap =
        await getDoc(ref);


    if(snap.exists()){

        licaoNome.textContent =
            snap.data().titulo ||
            "Lição";

    }

}


/* ========================= */
/* CARREGAR RESULTADO */
/* ========================= */

async function carregarResultado(uid){

    if(!licaoId){

        throw new Error(
            "ID da lição não encontrado."
        );

    }


    const progressoId =
        `${uid}_${licaoId}`;


    const ref =
        doc(
            db,
            "progresso",
            progressoId
        );


    const snap =
        await getDoc(ref);


    if(!snap.exists()){

        throw new Error(
            "Resultado da lição não encontrado."
        );

    }


    const dados =
        snap.data();


    const aproveitamento =
        Number(
            dados.aproveitamento ?? 0
        );


    const aprovado =
        dados.aprovado === true;


    const totalQuestoes =
        Number(
            dados.totalQuestoes ?? 0
        );


    const acertosValor =
        Number(
            dados.acertos ?? 0
        );


    const errosValor =
        Number(
            dados.erros ?? 0
        );


    const xpValor =
        Number(
            dados.xpGanho ?? 0
        );


    const moedasValor =
        Number(
            dados.moedasGanhas ?? 0
        );


    /* RESULTADO */

    percentual.textContent =
        `${aproveitamento}%`;


    aproveitamentoTexto.textContent =
        `${aproveitamento}%`;


    acertos.textContent =
        acertosValor;


    erros.textContent =
        errosValor;


    xpGanho.textContent =
        `+${xpValor}`;


    moedasGanhas.textContent =
        `+${moedasValor}`;


    if(aprovado){

        iconeResultado.textContent =
            "🏆";


        tituloResultado.textContent =
            "Parabéns!";


        subtitulo.textContent =
            "Você foi aprovado nesta lição!";


        percentual.className =
            "percentual aprovado";


        status.textContent =
            "✅ LIÇÃO APROVADA";


        status.className =
            "status aprovado";

    }else{

        iconeResultado.textContent =
            "💪";


        tituloResultado.textContent =
            "Continue tentando!";


        subtitulo.textContent =
            "Você ainda não atingiu o mínimo necessário.";


        percentual.className =
            "percentual reprovado";


        status.textContent =
            "❌ LIÇÃO NÃO APROVADA";


        status.className =
            "status reprovado";

    }


    /*
     * Caso uma versão antiga do
     * progresso não tenha acertos,
     * podemos mostrar pelo menos
     * o total de questões.
     */

    if(
        totalQuestoes > 0 &&
        acertosValor === 0 &&
        errosValor === 0
    ){

        erros.textContent =
            totalQuestoes;

    }


    carregando.style.display =
        "none";


    resultado.style.display =
        "block";
}


/* ========================= */
/* NAVEGAÇÃO */
/* ========================= */

btnContinuar.addEventListener(
    "click",
    () => {

        if(!cursoId){

            window.location.href =
                "cursos.html";

            return;
        }


        window.location.href =
            `curso.html?cursoId=${encodeURIComponent(cursoId)}`;

    }
);


btnRefazer.addEventListener(
    "click",
    () => {

        window.location.href =
            `licao.html?cursoId=${encodeURIComponent(cursoId)}&moduloId=${encodeURIComponent(moduloId)}&licaoId=${encodeURIComponent(licaoId)}`;

    }
);


btnPainel.addEventListener(
    "click",
    () => {

        window.location.href =
            "painel.html";

    }
);


btnCarteira.addEventListener(
    "click",
    () => {

        window.location.href =
            "carteira.html";

    }
);


btnSair.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

            window.location.href =
                "index.html";

        }catch(error){

            console.error(error);

        }

    }
);


/* ========================= */
/* AUTENTICAÇÃO */
/* ========================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "index.html";

            return;
        }


        try{

            await carregarUsuario(
                usuario.uid
            );


            await carregarCurso();


            await carregarLicao();


            await carregarResultado(
                usuario.uid
            );

        }catch(error){

            console.error(error);

            mostrarErro(
                error.message ||
                "Não foi possível carregar o resultado."
            );

        }

    }
);

</script>

</body>

</html>
