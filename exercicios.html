function mostrarMensagem(

// ======================================================
// ESCAPAR HTML
// ======================================================

function escapar(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {
        return "";
    }


    return String(valor)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

);


// ======================================================
// CARREGAR CURSOS
// ======================================================

async function carregarCursos() {

    try {

        const snapshot =
            await getDocs(
                collection(db, "cursos")
            );


        cursos = [];


        snapshot.forEach((item) => {

            cursos.push({

                id:
                    item.id,

                ...item.data()

            });

        });


        cursos.sort((a, b) => {

            return (
                (a.titulo || "")
            )
            .toLowerCase()
            .localeCompare(
                (b.titulo || "")
                .toLowerCase()
            );

        });


        cursoSelect.innerHTML =
            '<option value="">Selecione um curso...</option>';


        cursos.forEach((curso) => {

            const option =
                document.createElement("option");


            option.value =
                curso.id;


            option.textContent =
                (curso.titulo ||
                 "Curso sem título") +

                (
                    curso.ativo === false
                        ? " — INATIVO"
                        : ""
                );


            cursoSelect.appendChild(
                option
            );

        });


        if (cursos.length === 0) {

            cursoSelect.innerHTML =
                '<option value="">Nenhum curso cadastrado</option>';

        }


    } catch (erro) {

        console.error(erro);


        mostrarMensagem(
            "Erro ao carregar os cursos.",
            "erro"
        );

    }

}

async function carregarModulos(
    cursoId
) {

    try {

        const snapshot =
            await getDocs(
                collection(db, "modulos")
            );


        modulos = [];


        snapshot.forEach((item) => {

                item.data();


            if (
                dados.cursoId === cursoId

                modulos.push({

                    id:
                        item.id,

                    ...dados

                });

            }

        });


        modulos.sort((a, b) => {

            return Number(
                a.ordem || 0
            )
            -
            Number(
                b.ordem || 0
            );

        });


        moduloSelect.innerHTML =
            '<option value="">Selecione um módulo...</option>';


        modulos.forEach((modulo) => {

            const option =
                document.createElement("option");


            option.value =
                modulo.id;


            option.textContent =
                (modulo.ordem || 0) +
                " — " +

                    "Módulo sem título"
                ) +

                (
                    modulo.ativo === false
                        ? " — INATIVO"
                        : ""

            moduloSelect.appendChild(
                option

        moduloSelect.disabled =
            modulos.length === 0;

        mostrarMensagem(
            "Erro ao carregar os módulos.",
            "erro"
        );

    }

}

    async () => {

        const licaoId =
            licaoSelect.value;


        limparFormulario();


        tabela.style.display =
            "none";


        btnNovo.disabled =
            true;


        selecaoInfo.style.display =
            "none";


        if (!licaoId) {

            loading.style.display =
                "block";

            loading.textContent =
                "Selecione uma lição.";

            return;

        }


        const licao =
            licoes.find(
                item =>
                    item.id === licaoId
            );


        if (licao) {

            selecaoInfo.textContent =
                "Lição selecionada: " +
                (
                    licao.titulo ||
                    "Sem título"
                );

            selecaoInfo.style.display =
                "block";

        }


        btnNovo.disabled =
            false;


        await carregarExercicios(
            licaoId
        );

    }
);


// ======================================================
// CARREGAR EXERCÍCIOS
// ======================================================

async function carregarExercicios(
    licaoId
) {

    loading.style.display =
        "block";


    loading.textContent =
        "Carregando exercícios...";


    tabela.style.display =
        "none";


    try {

        const snapshot =
            await getDocs(
                collection(db, "exercicios")
            );


        exercicios = [];


        snapshot.forEach((item) => {

            const dados =
                item.data();


            if (
                dados.licaoId === licaoId
            ) {

                exercicios.push({

                    id:
                        item.id,

                    ...dados

                });

            }

        });


        exercicios.sort((a, b) => {

            return Number(
                a.ordem || 0
            )
            -
            Number(
                b.ordem || 0
            );

        });


        renderizarExercicios();


    } catch (erro) {

        console.error(erro);


        mostrarMensagem(
            "Erro ao carregar os exercícios.",
            "erro"
        );


        loading.textContent =
            "Não foi possível carregar os exercícios.";

    }

}


// ======================================================
// RENDERIZAR
// ======================================================

function renderizarExercicios() {

    listaExercicios.innerHTML =
        "";


    loading.style.display =
        "none";


    if (
        exercicios.length === 0
    ) {

        tabela.style.display =
            "none";


        loading.style.display =
            "block";


        loading.textContent =
            "Esta lição ainda não possui exercícios.";

        return;

    }


    tabela.style.display =
        "table";


    exercicios.forEach(
        (exercicio) => {

            const tr =
                document.createElement("tr");


            const status =
                exercicio.ativo !== false

                    ? '<span class="status status-ativo">ATIVO</span>'

                    : '<span class="status status-inativo">INATIVO</span>';


            let tipoTexto =
                "Múltipla escolha";


            if (
                exercicio.tipo ===
                "verdadeiro_falso"
            ) {

                tipoTexto =
                    "Verdadeiro/Falso";

            }


            if (
                exercicio.tipo ===
                "resposta_texto"
            ) {

                tipoTexto =
                    "Resposta em texto";

            }


            tr.innerHTML = `

                <td>
                    <strong>
                        ${escapar(
                            exercicio.ordem || 0
                        )}
                    </strong>
                </td>

                <td>
                    ${escapar(
                        exercicio.pergunta
                    )}
                </td>

                <td>
                    <span class="tipo-badge">
                        ${escapar(tipoTexto)}
                    </span>
                </td>

                <td>
                    ${escapar(
                        exercicio.pontos || 0
                    )}
                </td>

                <td>
                    ${status}
                </td>

                <td>

                    <div class="acoes">

                        <button
                            class="btn-editar"
                            data-acao="editar"
                            data-id="${exercicio.id}"
                        >
                            Editar
                        </button>

                        <button
                            class="btn-status"
                            data-acao="status"
                            data-id="${exercicio.id}"
                        >
                            ${
                                exercicio.ativo !== false
                                    ? "Desativar"
                                    : "Ativar"
                            }
                        </button>

                        <button
                            class="btn-excluir"
                            data-acao="excluir"
                            data-id="${exercicio.id}"
                        >
                            Excluir
                        </button>

                    </div>

                </td>

            `;


            listaExercicios.appendChild(
                tr
            );

        }
    );

}


// ======================================================
// ALTERAÇÃO DO TIPO
// ======================================================

tipo.addEventListener(
    "change",
    atualizarTipo
);


function atualizarTipo() {

    if (
        tipo.value ===
        "resposta_texto"
    ) {

        areaAlternativas.style.display =
            "none";

        areaRespostaTexto.style.display =
            "block";

        return;

    }


    if (
        tipo.value ===
        "verdadeiro_falso"
    ) {

        areaAlternativas.style.display =
            "block";

        areaRespostaTexto.style.display =
            "none";

        alternativaA.value =
            "Verdadeiro";

        alternativaB.value =
            "Falso";

        alternativaC.value =
            "";

        alternativaD.value =
            "";

        corretaA.value =
            "false";

        corretaB.value =
            "false";

        corretaC.value =
            "false";

        corretaD.value =
            "false";

        return;

    }


    areaAlternativas.style.display =
        "block";

    areaRespostaTexto.style.display =
        "none";

}

// ======================================================

btnNovo.addEventListener(

    () => {

        if (!licaoSelect.value) {

            mostrarMensagem(

            behavior:

        });

    }
);


// ======================================================
// CANCELAR
// ======================================================

btnCancelar.addEventListener(
    "click",
    () => {

        limparFormulario();

    }
);


// ======================================================
// LIMPAR
// ======================================================

function limparFormulario() {

    exercicioEditando =
        null;


    formExercicio.reset();


    tipo.value =
        "multipla_escolha";


    ordem.value =
        1;


    pontos.value =
        10;


    atualizarTipo();


    tituloFormulario.textContent =
        "Novo exercício";


    formBox.style.display =
        "none";

}


// ======================================================
// PEGAR ALTERNATIVAS
// ======================================================

function pegarAlternativas() {

    return [

        {
            letra: "A",
            texto:
                alternativaA.value.trim(),
            correta:
                corretaA.value === "true"
        },

        {
            letra: "B",
            texto:
                alternativaB.value.trim(),
            correta:
                corretaB.value === "true"
        },

        {
            letra: "C",
            texto:
                alternativaC.value.trim(),
            correta:
                corretaC.value === "true"
        },

        {
            letra: "D",
            texto:
                alternativaD.value.trim(),
            correta:
                corretaD.value === "true"
        }

    ].filter(
        item =>
            item.texto !== ""
    );

}


// ======================================================
// SALVAR
// ======================================================

formExercicio.addEventListener(
    "submit",
    async (evento) => {

        evento.preventDefault();


        const cursoId =
            cursoSelect.value;


        const moduloId =
            moduloSelect.value;


        const licaoId =
            licaoSelect.value;


        if (!cursoId) {

            mostrarMensagem(
                "Selecione um curso.",
                "erro"
            );

            return;

        }


        if (!moduloId) {

            mostrarMensagem(
                "Selecione um módulo.",
                "erro"
            );

            return;

        }


        if (!licaoId) {

            mostrarMensagem(
                "Selecione uma lição.",
                "erro"
            );

            return;

        }


        let alternativas = [];


        if (
            tipo.value !==
            "resposta_texto"
        ) {

            alternativas =
                pegarAlternativas();


            if (
                alternativas.length < 2
            ) {

                mostrarMensagem(
                    "Cadastre pelo menos duas alternativas.",
                    "erro"
                );

                return;

            }


            const quantidadeCorretas =
                alternativas.filter(
                    item =>
                        item.correta
                ).length;


            if (
                quantidadeCorretas !== 1
            ) {

                mostrarMensagem(
                    "Selecione exatamente uma resposta correta.",
                    "erro"
                );

                return;

            }

        }


        if (
            tipo.value ===
            "resposta_texto" &&
            !respostaTexto.value.trim()
        ) {

            mostrarMensagem(
                "Digite a resposta correta.",
                "erro"
            );

            respostaTexto.focus();

            return;

        }


        const dados = {

            cursoId:
                cursoId,

            moduloId:
                moduloId,

            licaoId:
                licaoId,

            pergunta:
                pergunta.value.trim(),

            tipo:
                tipo.value,

            alternativas:
                alternativas,

            respostaTexto:
                respostaTexto.value.trim(),

            explicacao:
                explicacao.value.trim(),

            ordem:
                Number(ordem.value),

            pontos:
                Number(pontos.value),

            atualizadoEm:
                serverTimestamp()

        };


        if (!dados.pergunta) {

            mostrarMensagem(
                "Digite a pergunta.",
                "erro"
            );

            pergunta.focus();

            return;

        }


        if (
            !dados.ordem ||
            dados.ordem < 1
        ) {

            mostrarMensagem(
                "Informe uma ordem válida.",
                "erro"
            );

            return;

        }


        if (
            !dados.pontos ||
            dados.pontos < 1
        ) {

            mostrarMensagem(
                "Informe uma pontuação válida.",
                "erro"
            );

            return;

        }


        try {

            if (exercicioEditando) {

                await updateDoc(

                    doc(
                        db,
                        "exercicios",
                        exercicioEditando
                    ),

                    dados

                );


                mostrarMensagem(
                    "Exercício atualizado com sucesso!"
                );

            } else {

                await addDoc(

                    collection(
                        db,
                        "exercicios"
                    ),

                    {

                        ...dados,

                        ativo:
                            true,

                        criadoEm:
                            serverTimestamp()

                    }

                );


                mostrarMensagem(
                    "Exercício criado com sucesso!"
                );

            }


            limparFormulario();


            await carregarExercicios(
                licaoId
            );


        } catch (erro) {

            console.error(erro);


            mostrarMensagem(
                "Erro ao salvar o exercício: " +
                erro.message,
                "erro"
            );

        }

    }
);


// ======================================================
// AÇÕES DA TABELA
// ======================================================

listaExercicios.addEventListener(
    "click",
    async (evento) => {

        const botao =
            evento.target.closest(
                "button"
            );


        if (!botao) {
            return;
        }


        const id =
            botao.dataset.id;


        const acao =
            botao.dataset.acao;


        const exercicio =
            exercicios.find(
                item =>
                    item.id === id
            );


        if (!exercicio) {
            return;
        }


        // ==========================
        // EDITAR
        // ==========================

        if (
            acao === "editar"
        ) {

            exercicioEditando =
                id;


            pergunta.value =
                exercicio.pergunta || "";


            tipo.value =
                exercicio.tipo ||
                "multipla_escolha";


            explicacao.value =
                exercicio.explicacao ||
                "";


            ordem.value =
                exercicio.ordem ||
                1;


            pontos.value =
                exercicio.pontos ||
                10;


            alternativaA.value =
                "";

            alternativaB.value =
                "";

            alternativaC.value =
                "";

            alternativaD.value =
                "";


            corretaA.value =
                "false";

            corretaB.value =
                "false";

            corretaC.value =
                "false";

            corretaD.value =
                "false";


            respostaTexto.value =
                exercicio.respostaTexto ||
                "";


            if (
                Array.isArray(
                    exercicio.alternativas
                )
            ) {

                exercicio.alternativas
                    .forEach(
                        (alt) => {

                            if (
                                alt.letra === "A"
                            ) {

                                alternativaA.value =
                                    alt.texto || "";

                                corretaA.value =
                                    String(
                                        alt.correta === true
                                    );

                            }


                            if (
                                alt.letra === "B"
                            ) {

                                alternativaB.value =
                                    alt.texto || "";

                                corretaB.value =
                                    String(
                                        alt.correta === true
                                    );

                            }


                            if (
                                alt.letra === "C"
                            ) {

                                alternativaC.value =
                                    alt.texto || "";

                                corretaC.value =
                                    String(
                                        alt.correta === true
                                    );

                            }


                            if (
                                alt.letra === "D"
                            ) {

                                alternativaD.value =
                                    alt.texto || "";

                                corretaD.value =
                                    String(
                                        alt.correta === true
                                    );

                            }

                        }
                    );

            }


            atualizarTipo();


            tituloFormulario.textContent =
                "Editar exercício";


            formBox.style.display =
                "block";


            pergunta.focus();


            window.scrollTo({

                top:
                    formBox.offsetTop - 20,

                behavior:
                    "smooth"

            });


            return;

        }


        // ==========================
        // STATUS
        // ==========================

        if (
            acao === "status"
        ) {

            const novoStatus =
                exercicio.ativo === false;


            const confirmacao =
                novoStatus

                    ? "Deseja ativar este exercício?"

                    : "Deseja desativar este exercício?";


            if (!confirm(confirmacao)) {
                return;
            }


            try {

                await updateDoc(

                    doc(
                        db,
                        "exercicios",
                        id
                    ),

                    {

                        ativo:
                            novoStatus,

                        atualizadoEm:
                            serverTimestamp()

                    }

                );


                mostrarMensagem(

                    novoStatus
                        ? "Exercício ativado!"
                        : "Exercício desativado!"

                );


                await carregarExercicios(
                    licaoSelect.value
                );


            } catch (erro) {

                console.error(erro);


                mostrarMensagem(
                    "Erro ao alterar o status.",
                    "erro"
                );

            }


            return;

        }


        // ==========================
        // EXCLUIR
        // ==========================

        if (
            acao === "excluir"
        ) {

            const confirmacao =
                confirm(

                    "Tem certeza que deseja excluir o exercício?\n\n" +

                    "Esta ação não poderá ser desfeita."

                );


            if (!confirmacao) {
                return;
            }


            try {

                await deleteDoc(

                    doc(
                        db,
                        "exercicios",
                        id
                    )

                );


                mostrarMensagem(
                    "Exercício excluído com sucesso!"
                );


                await carregarExercicios(
                    licaoSelect.value
                );


            } catch (erro) {

                console.error(erro);


                mostrarMensagem(
                    "Erro ao excluir o exercício.",
                    "erro"
                );

            }

        }

    }
);
