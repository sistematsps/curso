</style>
</head>

<body>

<header>

    <h1>🎓 Área do Aluno</h1>

    <div class="header-direita">

        <div class="saldo">
            ❤️ <span id="vidas">-</span>
            &nbsp;&nbsp;
            🪙 <span id="moedas">-</span>
            &nbsp;&nbsp;
            ⭐ <span id="xp">-</span>
        </div>

        <button
            class="btn btn-carteira"
            onclick="abrirCarteira()">
            💰 Carteira
        </button>

        <button
            class="btn btn-sair"
            onclick="sair()">
            Sair
        </button>

    </div>

</header>


<div class="container">

    <div id="loading" class="loading">
        Carregando curso...
    </div>

    <div id="conteudo" style="display:none;">

        <!-- INFORMAÇÕES DO CURSO -->

        <section class="curso-topo">

            <h2 id="tituloCurso">
                Curso
            </h2>

            <p
                id="descricaoCurso"
                class="curso-descricao">
            </p>

            <div class="curso-info">

                <span
                    id="nivelCurso"
                    class="tag">
                    📚 Iniciante
                </span>

                <span
                    id="totalModulos"
                    class="tag">
                    📖 0 módulos
                </span>

                <span
                    id="totalLicoes"
                    class="tag">
                    📝 0 lições
                </span>

            </div>


            <div class="progresso">

                <div class="progresso-topo">

                    <span>
                        Seu progresso
                    </span>

                    <span id="porcentagem">
                        0%
                    </span>

                </div>

                <div class="barra">

                    <div
                        id="barraProgresso"
                        class="barra-interna">
                    </div>

                </div>

            </div>

        </section>


        <!-- MÓDULOS -->

        <h2 class="titulo-secao">
            📚 Conteúdo do curso
        </h2>

        <div id="listaModulos"></div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",
    authDomain: "dezenas-1ed47.firebaseapp.com",
    projectId: "dezenas-1ed47",
    storageBucket: "dezenas-1ed47.firebasestorage.app",
    messagingSenderId: "372788277555",
    appId: "1:372788277555:web:1c1a6a80adee1722b54e46",
    measurementId: "G-NMPP8PKPK3"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   VARIÁVEIS
========================================================= */

let usuarioAtual = null;

let curso = null;

let modulos = [];

let licoes = [];

let progresso = [];


/* =========================================================
   CURSO ID
========================================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );

const cursoId =
    parametros.get("cursoId");


if(!cursoId){

    document.getElementById(
        "loading"
    ).innerHTML = `
        <div class="erro">
            Curso não informado.
        </div>
    `;

}


/* =========================================================
   AUTENTICAÇÃO
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "index.html";

            return;
        }


        usuarioAtual = usuario;


        if(!cursoId){
            return;
        }


        try{

            await carregarUsuario();

            await carregarCurso();

            await carregarModulos();

            await carregarLicoes();

            await carregarProgresso();

            renderizar();

        }catch(erro){

            console.error(erro);

            document.getElementById(
                "loading"
            ).innerHTML = `
                <div class="erro">
                    Não foi possível carregar o curso.
                    <br><br>
                    Verifique sua conexão e tente novamente.
                </div>
            `;

        }

    }
);


/* =========================================================
   USUÁRIO
========================================================= */

async function carregarUsuario(){

    const referencia =
        doc(
            db,
            "usuarios",
            usuarioAtual.uid
        );


    const snap =
        await getDoc(referencia);


    if(!snap.exists()){
        return;
    }


    const dados =
        snap.data();


    document.getElementById(
        "vidas"
    ).textContent =
        Number(
            dados.vidas ?? 0
        );


    document.getElementById(
        "moedas"
    ).textContent =
        Number(
            dados.moedas ?? 0
        );


    document.getElementById(
        "xp"
    ).textContent =
        Number(
            dados.xp ?? 0
        );

}


/* =========================================================
   CURSO
========================================================= */

async function carregarCurso(){

    const referencia =
        doc(
            db,
            "cursos",
            cursoId
        );


    const snap =
        await getDoc(referencia);


    if(!snap.exists()){

        throw new Error(
            "Curso não encontrado."
        );

    }


    curso = {
        id:snap.id,
        ...snap.data()
    };


    if(curso.ativo !== true){

        throw new Error(
            "Este curso está indisponível."
        );

    }

}


/* =========================================================
   MÓDULOS
========================================================= */

async function carregarModulos(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "modulos"
            )
        );


    modulos = [];


    snapshot.forEach(item => {

        const dados =
            item.data();


        if(
            dados.ativo === true &&
            dados.cursoId === cursoId
        ){

            modulos.push({
                id:item.id,
                ...dados
            });

        }

    });


    modulos.sort(
        (a,b) =>
            Number(a.ordem ?? 0) -
            Number(b.ordem ?? 0)
    );

}


/* =========================================================
   LIÇÕES
========================================================= */

async function carregarLicoes(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "licoes"
            )
        );


    licoes = [];


    snapshot.forEach(item => {

        const dados =
            item.data();


        if(
            dados.ativo === true &&
            dados.cursoId === cursoId
        ){

            licoes.push({
                id:item.id,
                ...dados
            });

        }

    });


    licoes.sort(
        (a,b) =>
            Number(a.ordem ?? 0) -
            Number(b.ordem ?? 0)
    );

}


/* =========================================================
   PROGRESSO
========================================================= */

async function carregarProgresso(){

    const snapshot =
        await getDocs(
            collection(
                db,
                "progresso"
            )
        );


    progresso = [];


    snapshot.forEach(item => {

        const dados =
            item.data();


        if(
            dados.usuarioId ===
            usuarioAtual.uid
        ){

            progresso.push({
                id:item.id,
                ...dados
            });

        }

    });

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar(){

    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "conteudo"
    ).style.display = "block";


    document.getElementById(
        "tituloCurso"
    ).textContent =
        curso.titulo ||
        "Curso";


    document.getElementById(
        "descricaoCurso"
    ).textContent =
        curso.descricao ||
        "Comece seus estudos e avance pelas lições.";


    document.getElementById(
        "nivelCurso"
    ).textContent =
        "📚 " +
        (curso.nivel || "Iniciante");


    document.getElementById(
        "totalModulos"
    ).textContent =
        "📖 " +
        modulos.length +
        (modulos.length === 1
            ? " módulo"
            : " módulos");


    document.getElementById(
        "totalLicoes"
    ).textContent =
        "📝 " +
        licoes.length +
        (licoes.length === 1
            ? " lição"
            : " lições");


    renderizarModulos();

    atualizarProgresso();

}


/* =========================================================
   MÓDULOS
========================================================= */

function renderizarModulos(){

    const container =
        document.getElementById(
            "listaModulos"
        );


    if(modulos.length === 0){

        container.innerHTML = `
            <div class="vazio">

                <div style="font-size:50px;">
                    📚
                </div>

                <h3 style="margin:15px 0 8px;">
                    Este curso ainda não possui módulos
                </h3>

                <p>
                    O conteúdo será disponibilizado em breve.
                </p>

            </div>
        `;

        return;
    }


    container.innerHTML =
        modulos.map(
            (modulo,index) =>
                criarModuloHTML(
                    modulo,
                    index
                )
        ).join("");


    document
        .querySelectorAll(
            "[data-licao]"
        )
        .forEach(elemento => {

            elemento.addEventListener(
                "click",
                () => {

                    const licaoId =
                        elemento.dataset.licao;

                    const moduloId =
                        elemento.dataset.modulo;

                    abrirLicao(
                        moduloId,
                        licaoId
                    );

                }
            );

        });

}


/* =========================================================
   HTML DO MÓDULO
========================================================= */

function criarModuloHTML(
    modulo,
    indice
){

    const titulo =
        escapar(
            modulo.titulo ||
            `Módulo ${indice + 1}`
        );


    const descricao =
        escapar(
            modulo.descricao ||
            "Conteúdo deste módulo."
        );


    const licoesModulo =
        licoes.filter(
            licao =>
                licao.moduloId ===
                modulo.id
        );


    const numero =
        indice + 1;


    let licoesHTML;


    if(licoesModulo.length === 0){

        licoesHTML = `
            <div
                style="
                    padding:20px;
                    color:#6b7280;
                    text-align:center;
                ">
                Nenhuma lição disponível neste módulo.
            </div>
        `;

    }else{

        licoesHTML =
            licoesModulo.map(
                (licao,index) =>
                    criarLicaoHTML(
                        licao,
                        index,
                        modulo.id
                    )
            ).join("");

    }


    return `
        <section class="modulo">

            <div class="modulo-cabecalho">

                <h3>
                    ${numero}. ${titulo}
                </h3>

                <p>
                    ${descricao}
                </p>

            </div>

            <div class="licoes">
                ${licoesHTML}
            </div>

        </section>
    `;

}


/* =========================================================
   HTML DA LIÇÃO
========================================================= */

function criarLicaoHTML(
    licao,
    indice,
    moduloId
){

    const titulo =
        escapar(
            licao.titulo ||
            `Lição ${indice + 1}`
        );


    const descricao =
        escapar(
            licao.descricao ||
            "Clique para iniciar esta lição."
        );


    const registro =
        encontrarProgresso(
            licao.id
        );


    let classe =
        "";


    let statusHTML =
        `
        <span class="status status-pendente">
            Disponível
        </span>
        `;


    let icone =
        indice + 1;


    if(
        registro &&
        registro.aprovado === true
    ){

        classe =
            "concluida";


        icone =
            "✓";


        statusHTML =
            `
            <span class="status status-aprovada">
                ✓ Aprovada
            </span>
            `;

    }else if(
        registro &&
        registro.aproveitamento != null
    ){

        statusHTML =
            `
            <span class="status status-tentativa">
                ${Math.round(
                    Number(
                        registro.aproveitamento
                    )
                )}% na última tentativa
            </span>
            `;

    }


    return `
        <div
            class="licao ${classe}"
            data-licao="${licao.id}"
            data-modulo="${moduloId}">

            <div class="icone-licao">
                ${icone}
            </div>

            <div class="licao-info">

                <h4>
                    ${titulo}
                </h4>

                <p>
                    ${descricao}
                </p>

            </div>

            ${statusHTML}

            <div class="seta">
                →
            </div>

        </div>
    `;

}


/* =========================================================
   ENCONTRAR PROGRESSO
========================================================= */

function encontrarProgresso(licaoId){

    return progresso.find(
        item =>
            item.licaoId === licaoId
    );

}


/* =========================================================
   PROGRESSO GERAL
========================================================= */

function atualizarProgresso(){

    if(licoes.length === 0){

        document.getElementById(
            "porcentagem"
        ).textContent = "0%";

        return;
    }


    let concluidas = 0;


    licoes.forEach(licao => {

        const registro =
            encontrarProgresso(
                licao.id
            );


        if(
            registro &&
            registro.aprovado === true
        ){

            concluidas++;

        }

    });


    const percentual =
        Math.round(
            (concluidas /
            licoes.length) *
            100
        );


    document.getElementById(
        "porcentagem"
    ).textContent =
        percentual + "%";


    document.getElementById(
        "barraProgresso"
    ).style.width =
        percentual + "%";

}


/* =========================================================
   ABRIR LIÇÃO
========================================================= */

function abrirLicao(
    moduloId,
    licaoId
){

    window.location.href =
        "licao.html?" +
        "cursoId=" +
        encodeURIComponent(cursoId) +
        "&moduloId=" +
        encodeURIComponent(moduloId) +
        "&licaoId=" +
        encodeURIComponent(licaoId);

}


/* =========================================================
   CARTEIRA
========================================================= */

window.abrirCarteira =
    function(){

        window.location.href =
            "carteira.html";

    };


/* =========================================================
   VOLTAR
========================================================= */

window.voltar =
    function(){

        window.location.href =
            "cursos.html";

    };


/* =========================================================
   SAIR
========================================================= */

window.sair =
    async function(){

        try{

            await signOut(auth);

            window.location.href =
                "index.html";

        }catch(erro){

            console.error(
                erro
            );

            alert(
                "Não foi possível sair."
            );

        }

    };


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapar(valor){

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
