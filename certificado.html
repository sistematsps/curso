<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",

    authDomain:
        "dezenas-1ed47.firebaseapp.com",

    projectId:
        "dezenas-1ed47",

    storageBucket:
        "dezenas-1ed47.firebasestorage.app",

    messagingSenderId:
        "372788277555",

    appId:
        "1:372788277555:web:1c1a6a80adee1722b54e46",

    measurementId:
        "G-NMPP8PKPK3"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   URL
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const cursoId =
    params.get("cursoId");


/* =====================================================
   ELEMENTOS
===================================================== */

const areaPrincipal =
    document.getElementById(
        "areaPrincipal"
    );


/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual = null;

let usuario = null;

let curso = null;

let licoes = [];

let progresso = [];


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(valor){

    if(
        valor === null ||
        valor === undefined
    ){
        return "";
    }

    return String(valor)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   DATA LOCAL
===================================================== */

function dataLocal(){

    const agora =
        new Date();

    const ano =
        agora.getFullYear();

    const mes =
        String(
            agora.getMonth() + 1
        ).padStart(2,"0");

    const dia =
        String(
            agora.getDate()
        ).padStart(2,"0");

    return `${dia}/${mes}/${ano}`;

}


/* =====================================================
   CARREGAR USUÁRIO
===================================================== */

async function carregarUsuario(){

    const ref =
        doc(
            db,
            "usuarios",
            usuarioAtual.uid
        );

    const snap =
        await getDoc(ref);


    if(!snap.exists()){

        throw new Error(
            "Dados do aluno não encontrados."
        );

    }


    usuario =
        snap.data();

}


/* =====================================================
   CARREGAR CURSO
===================================================== */

async function carregarCurso(){

    if(!cursoId){

        throw new Error(
            "Curso não informado."
        );

    }


    const ref =
        doc(
            db,
            "cursos",
            cursoId
        );

    const snap =
        await getDoc(ref);


    if(!snap.exists()){

        throw new Error(
            "Curso não encontrado."
        );

    }


    curso = {

        id:snap.id,

        ...snap.data()

    };


    if(curso.ativo !== true){

        throw new Error(
            "Este curso não está disponível."
        );

    }

}


/* =====================================================
   CARREGAR LIÇÕES
===================================================== */

async function carregarLicoes(){

    const snap =
        await getDocs(
            collection(
                db,
                "licoes"
            )
        );


    licoes = [];


    snap.forEach(item => {

        const dados = item.data();


        if(
            dados.ativo === true &&
            dados.cursoId === cursoId
        ){

            licoes.push({

                id:item.id,

                ...dados

            });

        }

    });


    /*
     * Ordena as lições pelo módulo
     * e depois pela ordem.
     */

    licoes.sort(
        (a,b) => {

            const moduloA =
                String(
                    a.moduloId || ""
                );

            const moduloB =
                String(
                    b.moduloId || ""
                );


            if(
                moduloA !== moduloB
            ){

                return moduloA.localeCompare(
                    moduloB
                );

            }


            return Number(a.ordem || 0) -
                   Number(b.ordem || 0);

        }
    );


    if(licoes.length === 0){

        throw new Error(
            "Este curso ainda não possui lições."
        );

    }

}


/* =====================================================
   CARREGAR PROGRESSO
===================================================== */

async function carregarProgresso(){

    const snap =
        await getDocs(
            collection(
                db,
                "progresso"
            )
        );


    progresso = [];


    snap.forEach(item => {

        const dados =
            item.data();


        if(
            dados.usuarioId ===
            usuarioAtual.uid &&
            dados.cursoId ===
            cursoId
        ){

            progresso.push({

                id:item.id,

                ...dados

            });

        }

    });

}


/* =====================================================
   VERIFICAR CONCLUSÃO
===================================================== */

function verificarConclusao(){

    const total =
        licoes.length;


    let aprovadas = 0;


    licoes.forEach(licao => {

        const registro =
            progresso.find(
                item =>
                    item.licaoId ===
                    licao.id
            );


        if(
            registro &&
            registro.aprovado === true
        ){

            aprovadas++;

        }

    });


    const percentual =
        total > 0
        ?
        Math.round(
            (aprovadas / total) * 100
        )
        :
        0;


    return {

        total,

        aprovadas,

        percentual,

        concluido:
            aprovadas >= total

    };

}


/* =====================================================
   GERAR CÓDIGO DO CERTIFICADO
===================================================== */

function gerarCodigo(){

    /*
     * Código determinístico baseado
     * no usuário e curso.
     *
     * Assim o certificado mantém
     * sempre o mesmo código.
     */

    const base =
        `${usuarioAtual.uid}_${cursoId}`;


    let hash = 0;


    for(
        let i = 0;
        i < base.length;
        i++
    ){

        hash =
            (
                (
                    hash << 5
                ) -
                hash
            ) +
            base.charCodeAt(i);

        hash |= 0;

    }


    const numero =
        Math.abs(hash)
            .toString(36)
            .toUpperCase()
            .padStart(8,"0")
            .slice(0,8);


    return `CERT-${numero}`;

}


/* =====================================================
   SALVAR CERTIFICADO
===================================================== */

async function salvarCertificado(
    dadosConclusao
){

    const codigo =
        gerarCodigo();


    const certificadoId =
        `${usuarioAtual.uid}_${cursoId}`;


    const ref =
        doc(
            db,
            "certificados",
            certificadoId
        );


    const existente =
        await getDoc(ref);


    if(existente.exists()){

        return {

            codigo:
                existente.data().codigo ||
                codigo,

            dataConclusao:
                existente.data()
                    .dataConclusao

        };

    }


    const dados = {

        usuarioId:
            usuarioAtual.uid,

        cursoId:
            cursoId,

        codigo:
            codigo,

        nomeAluno:
            usuario.nome ||
            "Aluno",

        nomeCurso:
            curso.titulo ||
            "Curso",

        totalLicoes:
            dadosConclusao.total,

        licoesAprovadas:
            dadosConclusao.aprovadas,

        aproveitamento:
            dadosConclusao.percentual,

        dataConclusao:
            serverTimestamp(),

        criadoEm:
            serverTimestamp()

    };


    await setDoc(
        ref,
        dados
    );


    return {

        codigo:codigo,

        dataConclusao:null

    };

}


/* =====================================================
   MOSTRAR NÃO CONCLUÍDO
===================================================== */

function mostrarNaoConcluido(
    dados
){

    areaPrincipal.innerHTML = `

        <div class="erro">

            <h2>
                🔒 Certificado ainda não disponível
            </h2>

            <p style="margin-top:10px">

                Você ainda não concluiu todas as
                lições deste curso.

            </p>

            <p style="margin-top:10px">

                Progresso atual:
                <strong>
                    ${dados.aprovadas}/${dados.total}
                    lições
                </strong>
                (${dados.percentual}%)

            </p>

            <div style="margin-top:20px">

                <button
                    class="btn btn-voltar"
                    onclick="voltarCurso()"
                >
                    ← Voltar para o curso
                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   MOSTRAR CERTIFICADO
===================================================== */

function mostrarCertificado(
    certificado,
    dadosConclusao
){

    const nomeAluno =
        escapar(
            usuario.nome ||
            "Aluno"
        );


    const nomeCurso =
        escapar(
            curso.titulo ||
            "Curso"
        );


    const codigo =
        escapar(
            certificado.codigo
        );


    areaPrincipal.innerHTML = `

        <div class="info-conclusao">

            🎉 Parabéns!
            Você concluiu todas as lições deste curso.

        </div>


        <div class="acoes-certificado">

            <button
                class="btn btn-imprimir"
                onclick="imprimirCertificado()"
            >
                🖨️ Imprimir / Salvar PDF
            </button>


            <button
                class="btn btn-painel"
                onclick="abrirPainel()"
            >
                🏠 Voltar ao painel
            </button>

        </div>


        <div class="certificado">

            <div class="certificado-borda">

                <div class="certificado-interior">

                    <div class="logo">
                        🏆
                    </div>


                    <div class="titulo">
                        CERTIFICADO
                    </div>


                    <div class="subtitulo">
                        DE CONCLUSÃO
                    </div>


                    <div class="linha-decorativa"></div>


                    <div class="texto">

                        Certificamos que

                    </div>


                    <div class="nome-aluno">
                        ${nomeAluno}
                    </div>


                    <div class="texto">

                        concluiu com sucesso o curso

                    </div>


                    <div class="nome-curso">
                        ${nomeCurso}
                    </div>


                    <div class="texto">

                        demonstrando a conclusão de todas
                        as lições disponíveis no curso.

                    </div>


                    <div class="detalhes">

                        <div class="detalhe">

                            <div class="detalhe-label">
                                Lições concluídas
                            </div>

                            <div class="detalhe-valor">
                                ${dadosConclusao.aprovadas}
                                /
                                ${dadosConclusao.total}
                            </div>

                        </div>


                        <div class="detalhe">

                            <div class="detalhe-label">
                                Aproveitamento
                            </div>

                            <div class="detalhe-valor">
                                ${dadosConclusao.percentual}%
                            </div>

                        </div>


                        <div class="detalhe">

                            <div class="detalhe-label">
                                Data
                            </div>

                            <div class="detalhe-valor">
                                ${dataLocal()}
                            </div>

                        </div>

                    </div>


                    <div class="assinaturas">

                        <div class="assinatura">

                            <div
                                class="linha-assinatura"
                            >
                                Plataforma de Ensino
                            </div>

                        </div>


                        <div class="assinatura">

                            <div
                                class="linha-assinatura"
                            >
                                Certificação
                            </div>

                        </div>

                    </div>


                    <div class="codigo">

                        Código de autenticidade:
                        <strong>
                            ${codigo}
                        </strong>

                    </div>

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   IMPRESSÃO
===================================================== */

function imprimirCertificado(){

    window.print();

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function abrirPainel(){

    window.location.href =
        "painel.html";

}


function abrirCarteira(){

    window.location.href =
        "carteira.html";

}


function voltarCurso(){

    if(cursoId){

        window.location.href =
            `curso.html?cursoId=${encodeURIComponent(cursoId)}`;

    }else{

        window.location.href =
            "cursos.html";

    }

}


/* =====================================================
   DISPONIBILIZAR FUNÇÕES
===================================================== */

window.imprimirCertificado =
    imprimirCertificado;

window.abrirPainel =
    abrirPainel;

window.abrirCarteira =
    abrirCarteira;

window.voltarCurso =
    voltarCurso;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

onAuthStateChanged(

    auth,

    async (user) => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        usuarioAtual =
            user;


        try{

            await carregarUsuario();

            await carregarCurso();

            await carregarLicoes();

            await carregarProgresso();


            const dadosConclusao =
                verificarConclusao();


            /*
             * Só libera o certificado
             * quando todas as lições
             * estiverem aprovadas.
             */

            if(
                !dadosConclusao.concluido
            ){

                mostrarNaoConcluido(
                    dadosConclusao
                );

                return;

            }


            const certificado =
                await salvarCertificado(
                    dadosConclusao
                );


            mostrarCertificado(
                certificado,
                dadosConclusao
            );


        }catch(error){

            console.error(
                "Erro no certificado:",
                error
            );


            areaPrincipal.innerHTML = `

                <div class="erro">

                    <h2>
                        Não foi possível carregar o certificado
                    </h2>

                    <p style="margin-top:10px">
                        ${escapar(
                            error.message
                        )}
                    </p>

                    <div style="margin-top:20px">

                        <button
                            class="btn btn-voltar"
                            onclick="voltarCurso()"
                        >
                            ← Voltar
                        </button>

                    </div>

                </div>

            `;

        }

    }

);

</script>
