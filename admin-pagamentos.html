<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administração - Aprende+</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #4f46e5;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      font-size: 22px;
    }

    .usuario-header {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 14px;
    }

    .btn-sair {
      border: none;
      background: rgba(255,255,255,0.18);
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .topo h2 {
      font-size: 24px;
    }

    .btn {
      border: none;
      padding: 11px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background: #4338ca;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #333;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 5px;
      color: #4f46e5;
    }

    .form-box {
      background: white;
      padding: 22px;
      border-radius: 15px;
      margin-bottom: 25px;
      display: none;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo-full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 11px;
      font-size: 14px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #4f46e5;
    }

    .acoes-form {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .pesquisa {
      width: 100%;
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .tabela-box {
      background: white;
      border-radius: 15px;
      overflow-x: auto;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f8fafc;
    }

    .acoes {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .acoes button {
      border: none;
      padding: 7px 9px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .ativo {
      color: #15803d;
      font-weight: bold;
    }

    .inativo {
      color: #dc2626;
      font-weight: bold;
    }

    .vazio {
      text-align: center;
      padding: 35px;
      color: #777;
    }

    .mensagem {
      display: none;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 9px;
      font-size: 14px;
    }

    .sucesso {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .erro {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 600px) {

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .container {
        padding: 15px;
      }

      .acoes-form {
        flex-direction: column;
      }

      .acoes-form .btn {
        width: 100%;
      }

    }
  </style>
</head>

<body>

<header>

  <h1>🎓 Aprende+ — Administração</h1>

  <div class="usuario-header">

    <span id="nomeAdmin">
      Carregando...
    </span>

    <button
      class="btn-sair"
      id="btnSair"
    >
      Sair
    </button>

  </div>

</header>


<main class="container">

  <div id="mensagem" class="mensagem"></div>


  <div class="topo">

    <div>
      <h2>Cursos</h2>
    </div>

    <button
      class="btn btn-primary"
      id="btnNovo"
    >
      + Novo Curso
    </button>

  </div>


  <div class="stats">

    <div class="stat">
      Cursos
      <strong id="totalCursos">0</strong>
    </div>

    <div class="stat">
      Unidades
      <strong id="totalUnidades">0</strong>
    </div>

    <div class="stat">
      Lições
      <strong id="totalLicoes">0</strong>
    </div>

  </div>


  <div class="form-box" id="formBox">

    <h3 id="tituloForm">
      Novo curso
    </h3>

    <br>

    <form id="formCurso">

      <div class="form-grid">

        <div class="campo">

          <label for="nome">
            Nome do curso
          </label>

          <input
            id="nome"
            required
            placeholder="Ex.: Matemática"
          >

        </div>


        <div class="campo">

          <label for="icone">
            Ícone
          </label>

          <input
            id="icone"
            value="📚"
            placeholder="📚"
          >

        </div>


        <div class="campo campo-full">

          <label for="descricao">
            Descrição
          </label>

          <textarea
            id="descricao"
            placeholder="Descrição do curso"
          ></textarea>

        </div>

      </div>


      <div class="acoes-form">

        <button
          type="submit"
          class="btn btn-primary"
        >
          💾 Salvar
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          id="btnCancelar"
        >
          Cancelar
        </button>

      </div>

    </form>

  </div>


  <input
    type="text"
    class="pesquisa"
    id="pesquisa"
    placeholder="🔎 Pesquisar curso..."
  >


  <div class="tabela-box">

    <table>

      <thead>

        <tr>
          <th>Curso</th>
          <th>Descrição</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>

      </thead>

      <tbody id="listaCursos"></tbody>

    </table>

  </div>

</main>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // =====================================================
  // FIREBASE
  // =====================================================

  const firebaseConfig = {
  apiKey: "AIzaSyC4AAbC8vCFAmlPlur12Nm7YBKPjaSjumM",
  authDomain: "meuappweb-65522.firebaseapp.com",
  projectId: "meuappweb-65522",
  storageBucket: "meuappweb-65522.firebasestorage.app",
  messagingSenderId: "305368794616",
  appId: "1:305368794616:web:3199c6836a986d896ac20d",
  measurementId: "G-QN7GFD99N0"
};


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  // =====================================================
  // ELEMENTOS
  // =====================================================

  const nomeAdmin =
    document.getElementById("nomeAdmin");

  const btnSair =
    document.getElementById("btnSair");

  const btnNovo =
    document.getElementById("btnNovo");

  const btnCancelar =
    document.getElementById("btnCancelar");

  const formBox =
    document.getElementById("formBox");

  const formCurso =
    document.getElementById("formCurso");

  const tituloForm =
    document.getElementById("tituloForm");

  const nomeInput =
    document.getElementById("nome");

  const iconeInput =
    document.getElementById("icone");

  const descricaoInput =
    document.getElementById("descricao");

  const pesquisa =
    document.getElementById("pesquisa");

  const listaCursos =
    document.getElementById("listaCursos");

  const mensagem =
    document.getElementById("mensagem");


  // =====================================================
  // VARIÁVEIS
  // =====================================================

  let cursos = [];

  let cursoEditando = null;

  let usuarioAdmin = null;


  // =====================================================
  // MENSAGEM
  // =====================================================

  function mostrarMensagem(
    texto,
    tipo
  ) {

    mensagem.textContent = texto;

    mensagem.className =
      "mensagem " + tipo;

    setTimeout(() => {

      mensagem.className =
        "mensagem";

    }, 4000);

  }


  // =====================================================
  // ESCAPAR HTML
  // =====================================================

  function escapar(valor) {

    return String(valor ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // =====================================================
  // VERIFICAR ADMIN
  // =====================================================

  async function verificarAdministrador(
    usuario
  ) {

    const ref =
      doc(
        db,
        "usuarios",
        usuario.uid
      );

    const snap =
      await getDoc(ref);


    if (!snap.exists()) {

      return null;

    }


    const dados =
      snap.data();


    if (
      dados.tipo !== "admin" ||
      dados.ativo === false
    ) {

      return null;

    }


    return dados;

  }


  // =====================================================
  // PROTEÇÃO
  // =====================================================

  onAuthStateChanged(
    auth,
    async (usuario) => {

      if (!usuario) {

        window.location.replace(
          "login.html"
        );

        return;

      }


      try {

        const dados =
          await verificarAdministrador(
            usuario
          );


        if (!dados) {

          await signOut(auth);

          window.location.replace(
            "login.html"
          );

          return;

        }


        usuarioAdmin = dados;


        nomeAdmin.textContent =
          dados.nome ||
          usuario.email ||
          "Administrador";


        await carregarCursos();

      } catch (erro) {

        console.error(
          "Erro ao verificar administrador:",
          erro
        );

        await signOut(auth);

        window.location.replace(
          "login.html"
        );

      }

    }
  );


  // =====================================================
  // CARREGAR CURSOS
  // =====================================================

  async function carregarCursos() {

    try {

      const snapshot =
        await getDocs(
          collection(db, "cursos")
        );


      cursos = snapshot.docs.map(
        item => ({
          id: item.id,
          ...item.data()
        })
      );


      cursos.sort(
        (a, b) =>
          Number(a.ordem || 0) -
          Number(b.ordem || 0)
      );


      renderizar();

    } catch (erro) {

      console.error(
        "Erro ao carregar cursos:",
        erro
      );

      mostrarMensagem(
        "Erro ao carregar os cursos.",
        "erro"
      );

    }

  }


  // =====================================================
  // RENDERIZAR
  // =====================================================

  function renderizar() {

    const termo =
      pesquisa.value
        .trim()
        .toLowerCase();


    const filtrados =
      cursos.filter(curso => {

        const texto =
          (
            curso.nome +
            " " +
            (curso.descricao || "")
          ).toLowerCase();

        return texto.includes(termo);

      });


    if (!filtrados.length) {

      listaCursos.innerHTML = `
        <tr>
          <td colspan="4" class="vazio">
            Nenhum curso encontrado.
          </td>
        </tr>
      `;

    } else {

      listaCursos.innerHTML =
        filtrados.map(curso => {

          const ativo =
            curso.ativo !== false;

          return `
            <tr>

              <td>
                ${escapar(curso.icone || "📚")}
                ${escapar(curso.nome)}
              </td>

              <td>
                ${escapar(curso.descricao || "-")}
              </td>

              <td>
                <span class="${ativo ? "ativo" : "inativo"}">
                  ${ativo ? "Ativo" : "Inativo"}
                </span>
              </td>

              <td>

                <div class="acoes">

                  <button
                    class="btn-primary"
                    onclick="editarCurso('${curso.id}')"
                  >
                    Editar
                  </button>

                  <button
                    class="btn-warning"
                    onclick="alternarCurso('${curso.id}')"
                  >
                    ${ativo ? "Desativar" : "Ativar"}
                  </button>

                  <button
                    class="btn-secondary"
                    onclick="abrirUnidades('${curso.id}')"
                  >
                    Unidades
                  </button>

                  <button
                    class="btn-danger"
                    onclick="excluirCurso('${curso.id}')"
                  >
                    Excluir
                  </button>

                </div>

              </td>

            </tr>
          `;

        }).join("");

    }


    atualizarEstatisticas();

  }


  // =====================================================
  // ESTATÍSTICAS
  // =====================================================

  async function atualizarEstatisticas() {

    document.getElementById(
      "totalCursos"
    ).textContent =
      cursos.length;


    try {

      const unidadesSnap =
        await getDocs(
          collection(db, "unidades")
        );


      const licoesSnap =
        await getDocs(
          collection(db, "licoes")
        );


      document.getElementById(
        "totalUnidades"
      ).textContent =
        unidadesSnap.size;


      document.getElementById(
        "totalLicoes"
      ).textContent =
        licoesSnap.size;


    } catch (erro) {

      console.warn(
        "Coleções de unidades/lições ainda não disponíveis."
      );

      document.getElementById(
        "totalUnidades"
      ).textContent = "0";

      document.getElementById(
        "totalLicoes"
      ).textContent = "0";

    }

  }


  // =====================================================
  // NOVO CURSO
  // =====================================================

  function abrirNovoCurso() {

    cursoEditando = null;

    tituloForm.textContent =
      "Novo curso";

    formCurso.reset();

    iconeInput.value =
      "📚";

    formBox.style.display =
      "block";

    nomeInput.focus();

  }


  // =====================================================
  // CANCELAR
  // =====================================================

  function limparFormulario() {

    cursoEditando = null;

    formCurso.reset();

    iconeInput.value =
      "📚";

    formBox.style.display =
      "none";

  }


  // =====================================================
  // EDITAR CURSO
  // =====================================================

  window.editarCurso =
    function(id) {

      const curso =
        cursos.find(
          item => item.id === id
        );


      if (!curso) return;


      cursoEditando =
        id;


      tituloForm.textContent =
        "Editar curso";


      nomeInput.value =
        curso.nome || "";


      iconeInput.value =
        curso.icone || "📚";


      descricaoInput.value =
        curso.descricao || "";


      formBox.style.display =
        "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    };


  // =====================================================
  // SALVAR CURSO
  // =====================================================

  formCurso.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const dadosCurso = {

        nome:
          nomeInput.value.trim(),

        descricao:
          descricaoInput.value.trim(),

        icone:
          iconeInput.value.trim() ||
          "📚",

        ativo: true

      };


      if (!dadosCurso.nome) {

        mostrarMensagem(
          "Informe o nome do curso.",
          "erro"
        );

        return;

      }


      try {

        if (cursoEditando) {

          await updateDoc(
            doc(
              db,
              "cursos",
              cursoEditando
            ),
            {
              ...dadosCurso,
              atualizadoEm:
                serverTimestamp()
            }
          );


          mostrarMensagem(
            "Curso atualizado com sucesso!",
            "sucesso"
          );


        } else {

          const ordem =
            cursos.length + 1;


          await setDoc(

            doc(
              collection(
                db,
                "cursos"
              )
            ),

            {
              ...dadosCurso,

              ordem,

              unidades: [],

              criadoEm:
                serverTimestamp(),

              atualizadoEm:
                serverTimestamp()
            }

          );


          mostrarMensagem(
            "Curso criado com sucesso!",
            "sucesso"
          );

        }


        limparFormulario();

        await carregarCursos();


      } catch (erro) {

        console.error(
          "Erro ao salvar curso:",
          erro
        );

        mostrarMensagem(
          "Erro ao salvar o curso: " +
          erro.message,
          "erro"
        );

      }

    }
  );


  // =====================================================
  // ATIVAR / DESATIVAR
  // =====================================================

  window.alternarCurso =
    async function(id) {

      const curso =
        cursos.find(
          item => item.id === id
        );


      if (!curso) return;


      const novoStatus =
        curso.ativo === false;


      try {

        await updateDoc(
          doc(
            db,
            "cursos",
            id
          ),
          {
            ativo: novoStatus,

            atualizadoEm:
              serverTimestamp()
          }
        );


        mostrarMensagem(
          novoStatus
            ? "Curso ativado."
            : "Curso desativado.",
          "sucesso"
        );


        await carregarCursos();


      } catch (erro) {

        console.error(
          erro
        );

        mostrarMensagem(
          "Erro ao alterar o status do curso.",
          "erro"
        );

      }

    };


  // =====================================================
  // EXCLUIR
  // =====================================================

  window.excluirCurso =
    async function(id) {

      const curso =
        cursos.find(
          item => item.id === id
        );


      if (!curso) return;


      const confirmar =
        confirm(
          `Deseja realmente excluir o curso "${curso.nome}"?`
        );


      if (!confirmar) return;


      try {

        await deleteDoc(
          doc(
            db,
            "cursos",
            id
          )
        );


        mostrarMensagem(
          "Curso excluído com sucesso.",
          "sucesso"
        );


        await carregarCursos();


      } catch (erro) {

        console.error(
          erro
        );

        mostrarMensagem(
          "Erro ao excluir o curso.",
          "erro"
        );

      }

    };


  // =====================================================
  // ABRIR UNIDADES
  // =====================================================

  window.abrirUnidades =
    function(id) {

      window.location.href =
        "unidades.html?id=" +
        encodeURIComponent(id);

    };


  // =====================================================
  // EVENTOS
  // =====================================================

  btnNovo.addEventListener(
    "click",
    abrirNovoCurso
  );


  btnCancelar.addEventListener(
    "click",
    limparFormulario
  );


  pesquisa.addEventListener(
    "input",
    renderizar
  );


  btnSair.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

      } finally {

        localStorage.removeItem(
          "aprendeUsuario"
        );

        window.location.replace(
          "login.html"
        );

      }

    }
  );

</script>

</body>
</html>
