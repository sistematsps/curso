<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ranking - Aprende+</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#222;
    padding-bottom:90px;
}

header{
    background:#fff;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:10;
}

.header-content{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#4f46e5;
}

.subtitulo{
    color:#666;
    font-size:14px;
    margin-top:4px;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.titulo{
    text-align:center;
    margin-bottom:25px;
}

.titulo h1{
    font-size:28px;
    margin-bottom:8px;
}

.titulo p{
    color:#777;
}

.podio{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:12px;
    margin:30px 0;
}

.podio-card{
    background:#fff;
    border-radius:18px;
    padding:18px 12px;
    text-align:center;
    width:30%;
    max-width:210px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.podio-card.primeiro{
    transform:translateY(-15px);
}

.avatar{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#e8eaff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    margin:0 auto 10px;
}

.posicao{
    font-size:25px;
    margin-bottom:8px;
}

.nome{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.xp{
    margin-top:7px;
    color:#666;
    font-size:14px;
}

.ranking-list{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.ranking-item{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px 18px;
    border-bottom:1px solid #eee;
}

.ranking-item:last-child{
    border-bottom:none;
}

.ranking-item.usuario{
    background:#eef2ff;
}

.numero{
    width:35px;
    text-align:center;
    font-weight:bold;
    color:#777;
}

.avatar-mini{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#e8eaff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.info{
    flex:1;
    min-width:0;
}

.info .nome{
    font-size:16px;
}

.nivel{
    font-size:12px;
    color:#888;
    margin-top:4px;
}

.xp-total{
    font-weight:bold;
    color:#4f46e5;
}

.badge-voce{
    background:#4f46e5;
    color:white;
    padding:4px 8px;
    border-radius:20px;
    font-size:11px;
}

.sem-ranking{
    background:#fff;
    padding:30px;
    border-radius:18px;
    text-align:center;
    color:#777;
}

nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:72px;
    background:#fff;
    box-shadow:0 -2px 12px rgba(0,0,0,.10);
    display:flex;
    justify-content:center;
    z-index:20;
}

.nav-inner{
    width:100%;
    max-width:600px;
    display:flex;
}

.nav-item{
    flex:1;
    border:none;
    background:none;
    font-size:12px;
    color:#777;
    cursor:pointer;
}

.nav-item span{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

.nav-item.ativo{
    color:#4f46e5;
    font-weight:bold;
}

@media(max-width:600px){

    .podio-card{
        padding:12px 7px;
    }

    .podio-card.primeiro{
        transform:translateY(-10px);
    }

    .avatar{
        width:52px;
        height:52px;
        font-size:25px;
    }

    .ranking-item{
        padding:13px 10px;
    }
}
</style>

</head>

<body>

<header>
    <div class="header-content">
        <div>
            <div class="logo">📚 Aprende+</div>
            <div class="subtitulo">Ranking dos alunos</div>
        </div>
        <div id="xpHeader">⭐ 0 XP</div>
    </div>
</header>

<div class="container">


<div class="titulo">
    <h1>🏆 Ranking</h1>
    <p>Continue estudando para subir de posição!</p>
</div>

<div id="podio" class="podio"></div>

<div id="ranking" class="ranking-list"></div>


</div>

<nav>
    <div class="nav-inner">


    <button class="nav-item" onclick="irInicio()">
        <span>🏠</span>
        Início
    </button>

    <button class="nav-item" onclick="irCursos()">
        <span>📚</span>
        Cursos
    </button>

    <button class="nav-item ativo">
        <span>🏆</span>
        Ranking
    </button>

    <button class="nav-item" onclick="irPerfil()">
        <span>👤</span>
        Perfil
    </button>

</div>
```

</nav>

<script>

const CHAVE_ALUNO = "aprendeAluno";
const CHAVE_XP = "aprendeXP";
const CHAVE_RANKING = "aprendeRanking";

let aluno;
let xp = 0;

function gerarId(){
    return Math.random().toString(36).substring(2,10);
}

function carregarAluno(){

    try{
        aluno = JSON.parse(localStorage.getItem(CHAVE_ALUNO));
    }catch(e){
        aluno = null;
    }

    if(!aluno){

        aluno = {
            id:"aluno_demo",
            nome:"Estudante"
        };

        localStorage.setItem(
            CHAVE_ALUNO,
            JSON.stringify(aluno)
        );
    }

    xp = Number(localStorage.getItem(CHAVE_XP) || 0);
}

function criarRankingInicial(){

    let ranking;

    try{
        ranking = JSON.parse(
            localStorage.getItem(CHAVE_RANKING)
        );
    }catch(e){
        ranking = null;
    }

    if(!Array.isArray(ranking) || ranking.length === 0){

        ranking = [

            {
                id:"demo1",
                nome:"Ana",
                xp:1250
            },

            {
                id:"demo2",
                nome:"Carlos",
                xp:980
            },

            {
                id:"demo3",
                nome:"Mariana",
                xp:760
            },

            {
                id:"demo4",
                nome:"João",
                xp:540
            },

            {
                id:"demo5",
                nome:"Beatriz",
                xp:390
            }

        ];

        localStorage.setItem(
            CHAVE_RANKING,
            JSON.stringify(ranking)
        );
    }

    /*
       O aluno atual sempre entra no ranking
       com o XP que possui.
    */

    ranking = ranking.filter(item =>
        item.id !== aluno.id
    );

    ranking.push({
        id:aluno.id,
        nome:aluno.nome || "Estudante",
        xp:xp
    });

    ranking.sort((a,b) => b.xp - a.xp);

    return ranking;
}

function obterNivel(xp){

    let nivel = 1;
    let necessario = 100;

    let restante = xp;

    while(restante >= necessario){

        restante -= necessario;
        nivel++;

        necessario = nivel * 100;
    }

    return nivel;
}

function escapar(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function iconePosicao(posicao){

    if(posicao === 1) return "🥇";
    if(posicao === 2) return "🥈";
    if(posicao === 3) return "🥉";

    return posicao;
}

function renderizar(){

    const ranking = criarRankingInicial();

    document.getElementById("xpHeader").textContent =
        `⭐ ${xp} XP`;

    renderizarPodio(ranking);

    const lista = document.getElementById("ranking");

    if(!ranking.length){

        lista.innerHTML = `
            <div class="sem-ranking">
                Nenhum aluno no ranking ainda.
            </div>
        `;

        return;
    }

    lista.innerHTML = ranking.map((item,index)=>{

        const posicao = index + 1;
        const souEu = item.id === aluno.id;

        return `

            <div class="ranking-item ${souEu ? "usuario" : ""}">

                <div class="numero">
                    ${iconePosicao(posicao)}
                </div>

                <div class="avatar-mini">
                    ${souEu ? "👤" : "🙂"}
                </div>

                <div class="info">

                    <div class="nome">
                        ${escapar(item.nome)}

                        ${souEu
                            ? `<span class="badge-voce">VOCÊ</span>`
                            : ""
                        }
                    </div>

                    <div class="nivel">
                        Nível ${obterNivel(Number(item.xp) || 0)}
                    </div>

                </div>

                <div class="xp-total">
                    ${Number(item.xp) || 0} XP
                </div>

            </div>

        `;

    }).join("");
}

function renderizarPodio(ranking){

    const podio = document.getElementById("podio");

    if(ranking.length === 0){

        podio.innerHTML = "";

        return;
    }

    const ordem = [1,0,2];

    podio.innerHTML = ordem.map(index=>{

        if(!ranking[index]) return "";

        const item = ranking[index];

        const posicao = index + 1;

        return `

            <div class="podio-card ${
                posicao === 1 ? "primeiro" : ""
            }">

                <div class="posicao">
                    ${iconePosicao(posicao)}
                </div>

                <div class="avatar">
                    ${item.id === aluno.id ? "👤" : "🙂"}
                </div>

                <div class="nome">
                    ${escapar(item.nome)}
                </div>

                <div class="xp">
                    ⭐ ${Number(item.xp) || 0} XP
                </div>

            </div>

        `;

    }).join("");
}

function irInicio(){
    window.location.href = "index.html";
}

function irCursos(){
    window.location.href = "cursos.html";
}

function irPerfil(){
    window.location.href = "perfil.html";
}

carregarAluno();
renderizar();

</script>

</body>
</html>
