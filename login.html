
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Aprende+</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #7c3aed
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .login {
      width: 100%;
      max-width: 420px;

      background: white;

      padding: 35px;

      border-radius: 20px;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,.20);
    }

    .logo {
      text-align: center;

      font-size: 52px;

      margin-bottom: 8px;
    }

    h1 {
      text-align: center;

      color: #222;

      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;

      color: #777;

      font-size: 14px;

      margin-bottom: 25px;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-weight: bold;

      font-size: 14px;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 1px solid #d1d5db;

      border-radius: 10px;

      font-size: 15px;

      outline: none;
    }

    input:focus {
      border-color: #4f46e5;
    }

    button {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 10px;

      background: #4f46e5;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    button:hover {
      background: #4338ca;
    }

    button:disabled {
      background: #9ca3af;

      cursor: not-allowed;
    }

    .mensagem {
      display: none;

      padding: 13px;

      border-radius: 10px;

      margin-bottom: 18px;

      font-size: 14px;

      line-height: 1.5;
    }

    .erro {
      display: block;

      background: #fee2e2;

      color: #991b1b;
    }

    .sucesso {
      display: block;

      background: #dcfce7;

      color: #166534;
    }

  </style>

</head>


<body>

  <div class="login">

    <div class="logo">
      🎓
    </div>

    <h1>
      Aprende+
    </h1>

    <p class="subtitulo">
      Entre para continuar
    </p>

    <div
      id="mensagem"
      class="mensagem"
    ></div>


    <form id="formLogin">

      <div class="campo">

        <label for="email">
          E-mail
        </label>

        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >

      </div>


      <div class="campo">

        <label for="senha">
          Senha
        </label>

        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        id="btnLogin"
      >
        Entrar
      </button>

    </form>

  </div>


  <script type="module">

    // =====================================================
    // FIREBASE APP
    // =====================================================

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    // =====================================================
    // FIREBASE AUTH
    // =====================================================

    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // =====================================================
    // FIRESTORE
    // =====================================================

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // =====================================================
    // CONFIGURAÇÃO OFICIAL DO FIREBASE
    // =====================================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyC4AAbC8vCFAmlPlur12NmY7BKPjaSjumM",

      authDomain:
        "meuappweb-65522.firebaseapp.com",

      projectId:
        "meuappweb-65522",

      storageBucket:
        "meuappweb-65522.firebasestorage.app",

      messagingSenderId:
        "305368794616",

      appId:
        "1:305368794616:web:3199c6836a986d896ac20d",

      measurementId:
        "G-QN7GFD99N0"

    };


    // =====================================================
    // INICIALIZAR FIREBASE
    // =====================================================

    const app =
      initializeApp(firebaseConfig);


    // =====================================================
    // AUTH
    // =====================================================

    const auth =
      getAuth(app);


    // =====================================================
    // FIRESTORE
    // =====================================================

    const db =
      getFirestore(app);


    console.log(
      "LOGIN - Firebase inicializado."
    );


    console.log(
      "LOGIN - Projeto:",
      firebaseConfig.projectId
    );


    console.log(
      "LOGIN - Auth:",
      auth
    );


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const form =
      document.getElementById(
        "formLogin"
      );


    const email =
      document.getElementById(
        "email"
      );


    const senha =
      document.getElementById(
        "senha"
      );


    const btnLogin =
      document.getElementById(
        "btnLogin"
      );


    const mensagem =
      document.getElementById(
        "mensagem"
      );


    // =====================================================
    // MENSAGEM
    // =====================================================

    function mostrarMensagem(
      texto,
      tipo
    ) {

      mensagem.textContent =
        texto;

      mensagem.className =
        "mensagem " + tipo;

    }


    // =====================================================
    // LOGIN
    // =====================================================

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const emailValor =
          email.value.trim();


        const senhaValor =
          senha.value;


        if (!emailValor || !senhaValor) {

          mostrarMensagem(
            "Informe o e-mail e a senha.",
            "erro"
          );

          return;

        }


        btnLogin.disabled =
          true;


        btnLogin.textContent =
          "Entrando...";


        try {

          console.log(
            "LOGIN - configurando persistência..."
          );


          // =================================================
          // PERSISTÊNCIA LOCAL
          // =================================================

          await setPersistence(
            auth,
            browserLocalPersistence
          );


          console.log(
            "LOGIN - persistência configurada."
          );


          // =================================================
          // AUTENTICAÇÃO
          // =================================================

          console.log(
            "LOGIN - tentando autenticar:",
            emailValor
          );


          const credencial =
            await signInWithEmailAndPassword(
              auth,
              emailValor,
              senhaValor
            );


          const usuario =
            credencial.user;


          console.log(
            "LOGIN - usuário autenticado:",
            usuario.uid
          );


          console.log(
            "LOGIN - e-mail:",
            usuario.email
          );


          console.log(
            "LOGIN - currentUser:",
            auth.currentUser
              ? auth.currentUser.uid
              : null
          );


          // =================================================
          // BUSCAR users/{uid}
          // =================================================

          console.log(
            "LOGIN - buscando users/" +
            usuario.uid
          );


          const referencia =
            doc(
              db,
              "users",
              usuario.uid
            );


          const documento =
            await getDoc(
              referencia
            );


          // =================================================
          // USUÁRIO NÃO CADASTRADO NO FIRESTORE
          // =================================================

          if (!documento.exists()) {

            console.error(
              "LOGIN - documento users não encontrado."
            );


            await signOut(auth);


            mostrarMensagem(
              "Sua conta existe no Firebase Authentication, mas não possui cadastro na coleção users.",
              "erro"
            );


            btnLogin.disabled =
              false;


            btnLogin.textContent =
              "Entrar";


            return;

          }


          // =================================================
          // DADOS DO USUÁRIO
          // =================================================

          const dados =
            documento.data();


          console.log(
            "LOGIN - dados do usuário:",
            dados
          );


          // =================================================
          // STATUS
          // =================================================

          if (
            dados.ativo === false
          ) {

            await signOut(auth);


            mostrarMensagem(
              "Seu acesso está desativado.",
              "erro"
            );


            btnLogin.disabled =
              false;


            btnLogin.textContent =
              "Entrar";


            return;

          }


          // =================================================
          // TIPO DO USUÁRIO
          // =================================================

          const tipo =
            String(
              dados.tipo || ""
            )
            .trim()
            .toLowerCase();


          console.log(
            "LOGIN - tipo:",
            tipo
          );


          // =================================================
          // TIPO INVÁLIDO
          // =================================================

          if (
            tipo !== "admin" &&
            tipo !== "aluno"
          ) {

            await signOut(auth);


            mostrarMensagem(
              "O tipo deste usuário não está configurado corretamente.",
              "erro"
            );


            btnLogin.disabled =
              false;


            btnLogin.textContent =
              "Entrar";


            return;

          }


          // =================================================
          // SALVAR PERFIL LOCAL
          // =================================================

          const perfil = {

            uid:
              usuario.uid,

            nome:
              dados.nome ||
              usuario.displayName ||
              "",

            email:
              dados.email ||
              usuario.email ||
              "",

            tipo:
              tipo,

            ativo:
              dados.ativo !== false

          };


          localStorage.setItem(
            "aprendeUsuario",
            JSON.stringify(perfil)
          );


          console.log(
            "LOGIN - perfil salvo:",
            perfil
          );


          // =================================================
          // CONFIRMAR SESSÃO
          // =================================================

          if (!auth.currentUser) {

            throw new Error(
              "O Firebase autenticou o usuário, mas a sessão não está disponível."
            );

          }


          console.log(
            "LOGIN - sessão confirmada:",
            auth.currentUser.uid
          );


          // =================================================
          // ADMIN
          // =================================================

          if (
            tipo === "admin"
          ) {

            mostrarMensagem(
              "Administrador identificado. Abrindo painel...",
              "sucesso"
            );


            console.log(
              "LOGIN - redirecionando para admin.html"
            );


            setTimeout(
              function() {

                window.location.replace(
                  "./admin.html"
                );

              },
              500
            );


            return;

          }


          // =================================================
          // ALUNO
          // =================================================

          mostrarMensagem(
            "Aluno identificado. Abrindo plataforma...",
            "sucesso"
          );


          console.log(
            "LOGIN - redirecionando para index.html"
          );


          setTimeout(
            function() {

              window.location.replace(
                "./index.html"
              );

            },
            500
          );


        } catch (erro) {

          console.error(
            "LOGIN - erro:",
            erro
          );


          console.error(
            "LOGIN - código:",
            erro?.code
          );


          console.error(
            "LOGIN - mensagem:",
            erro?.message
          );


          let texto =
            "Não foi possível realizar o login.";


          // =================================================
          // TRATAMENTO DOS ERROS
          // =================================================

          switch (
            erro?.code
          ) {


            case "auth/invalid-credential":

            case "auth/wrong-password":

            case "auth/user-not-found":

              texto =
                "E-mail ou senha incorretos.";

              break;


            case "auth/invalid-email":

              texto =
                "Informe um e-mail válido.";

              break;


            case "auth/too-many-requests":

              texto =
                "Muitas tentativas. Aguarde alguns minutos.";

              break;


            case "auth/network-request-failed":

              texto =
                "Falha de conexão com o Firebase.";

              break;


            case "auth/api-key-not-valid":

              texto =
                "A chave de API do Firebase foi rejeitada. Verifique a configuração do aplicativo Web no Firebase Console.";

              break;


            case "auth/operation-not-allowed":

              texto =
                "O login por e-mail e senha não está habilitado no Firebase Authentication.";

              break;


            default:

              texto =
                erro?.message ||
                texto;

          }


          mostrarMensagem(
            texto,
            "erro"
          );


          btnLogin.disabled =
            false;


          btnLogin.textContent =
            "Entrar";

        }

      }
    );

  </script>

</body>

</html>
```
