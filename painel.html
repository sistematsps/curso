<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel do Aluno</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#1f2937;
}

header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:22px;
}

.header-container{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.usuario-info h1{
    font-size:25px;
    margin-bottom:6px;
}

.usuario-info p{
    opacity:.9;
}

.header-acoes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    border-radius:10px;
    padding:11px 16px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-branco{
    background:white;
    color:#2563eb;
}

.btn-sair{
    background:#dc2626;
    color:white;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}


/* =========================
   CARDS DE ESTATÍSTICAS
========================= */

.estatisticas{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:30px;
}

.stat-card{
    background:white;
    border-radius:16px;
    padding:22px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.stat-topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.stat-icon{
    font-size:30px;
}

.stat-titulo{
    color:#6b7280;
    font-size:14px;
}

.stat-valor{
    font-size:30px;
    font-weight:bold;
}


/* =========================
   TITULO
========================= */

.secao-titulo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.secao-titulo h2{
    font-size:24px;
}

.secao-titulo span{
    color:#6b7280;
    font-size:14px;
}


/* =========================
   CURSOS
========================= */

.cursos{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.curso-card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    transition:.2s;
}

.curso-card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 22px rgba(0,0,0,.10);
}

.curso-topo{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:15px;
}

.curso-topo h3{
    font-size:21px;
    margin-bottom:6px;
}

.curso-descricao{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
}

.nivel{
    background:#eef2ff;
    color:#4338ca;
    border-radius:20px;
    padding:6px 10px;
    height:max-content;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.progresso-info{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    font-size:14px;
}

.progresso-percentual{
    font-weight:bold;
}

.barra{
    width:100%;
    height:12px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:16px;
}

.barra-progresso{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#2563eb,#4f46e5);
    border-radius:20px;
    transition:width .4s ease;
}

.curso-rodape{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.info-licoes{
    color:#6b7280;
    font-size:14px;
}

.btn-curso{
    background:#2563eb;
    color:white;
}

.btn-curso:hover{
    background:#1d4ed8;
}


/* =========================
   ESTADOS
========================= */

.loading{
    background:white;
    border-radius:16px;
    padding:35px;
    text-align:center;
    color:#6b7280;
}

.vazio{
    background:white;
    border-radius:16px;
    padding:40px;
    text-align:center;
}

.vazio h3{
    margin-bottom:8px;
}

.vazio p{
    color:#6b7280;
    margin-bottom:18px;
}

.erro{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}


/* =========================
   RESPONSIVO
========================= */

@media(max-width:900px){

    .estatisticas{
        grid-template-columns:repeat(2,1fr);
    }

    .cursos{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    header{
        padding:18px;
    }

    .header-container{
        flex-direction:column;
        align-items:flex-start;
    }

    .header-acoes{
        width:100%;
    }

    .header-acoes .btn{
        flex:1;
    }

    .container{
        margin:20px auto;
        padding:0 15px;
    }

    .estatisticas{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .stat-card{
        padding:16px;
    }

    .stat-valor{
        font-size:24px;
    }

    .curso-topo{
        flex-direction:column;
    }

    .curso-rodape{
        flex-direction:column;
        align-items:stretch;
    }

    .btn-curso{
        width:100%;
    }

}

</style>

</head>


<body>


<header>

    <div class="header-container">

        <div class="usuario-info">

            <h1 id="nomeUsuario">
                Olá!
            </h1>

            <p>
                Continue sua jornada de aprendizado 🚀
            </p>

        </div>


        <div class="header-acoes">

            <button
                class="btn btn-branco"
                onclick="abrirCarteira()"
            >
                💰 Carteira
            </button>


            <button
                class="btn btn-branco"
                onclick="abrirCursos()"
            >
                📚 Cursos
            </button>


            <button
                class="btn btn-sair"
                onclick="sair()"
            >
                Sair
            </button>

        </div>

    </div>

</header>



<main class="container">


    <div id="mensagem"></div>


    <!-- =========================
         ESTATÍSTICAS
    ========================== -->

    <section class="estatisticas">


        <!-- VIDAS -->

        <div class="stat-card">

            <div class="stat-topo">

                <div>

                    <div class="stat-titulo">
                        Vidas
                    </div>

                    <div
                        class="stat-valor"
                        id="vidas"
                    >
                        -
                    </div>

                </div>

                <div class="stat-icon">
                    ❤️
                </div>

            </div>

        </div>


        <!-- MOEDAS -->

        <div class="stat-card">

            <div class="stat-topo">

                <div>

                    <div class="stat-titulo">
                        Moedas
                    </div>

                    <div
                        class="stat-valor"
                        id="moedas"
                    >
                        -
                    </div>

                </div>

                <div class="stat-icon">
                    🪙
                </div>

            </div>

        </div>


        <!-- XP -->

        <div class="stat-card">

            <div class="stat-topo">

                <div>

                    <div class="stat-titulo">
                        XP
                    </div>

                    <div
                        class="stat-valor"
                        id="xp"
                    >
                        -
                    </div>

                </div>

                <div class="stat-icon">
                    ⭐
                </div>

            </div>

        </div>


        <!-- SEQUÊNCIA -->

        <div class="stat-card">

            <div class="stat-topo">

                <div>

                    <div class="stat-titulo">
                        Sequência
                    </div>

                    <div
                        class="stat-valor"
                        id="sequencia"
                    >
                        -
                    </div>

                </div>

                <div class="stat-icon">
                    🔥
                </div>

            </div>

        </div>


    </section>



    <!-- =========================
         RESUMO
    ========================== -->

    <section>

        <div class="secao-titulo">

            <h2>
                📊 Seu progresso
            </h2>

            <span id="resumoGeral">
                Carregando...
            </span>

        </div>


        <div class="estatisticas">


            <div class="stat-card">

                <div class="stat-titulo">
                    Cursos disponíveis
                </div>

                <div
                    class="stat-valor"
                    id="totalCursos"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-titulo">
                    Lições concluídas
                </div>

                <div
                    class="stat-valor"
                    id="licoesConcluidas"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-titulo">
                    Melhor aproveitamento
                </div>

                <div
                    class="stat-valor"
                    id="melhorAproveitamento"
                >
                    0%
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-titulo">
                    XP acumulado
                </div>

                <div
                    class="stat-valor"
                    id="xpResumo"
                >
                    0
                </div>

            </div>


        </div>

    </section>



    <!-- =========================
         CURSOS
    ========================== -->

    <section>


        <div class="secao-titulo">

            <h2>
                📚 Meus cursos
            </h2>

            <span>
                Continue de onde parou
            </span>

        </div>


        <div id="listaCursos">

            <div class="loading">
                Carregando cursos...
            </div>

        </div>


    </section>


</main>



<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



const firebaseConfig = {

    apiKey:
        "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",

    authDomain:
        "dezenas-1ed47.firebaseapp.com",

    projectId:
        "dezenas-1ed47",

    storageBucket:
        "dezenas-1ed47.firebasestorage.app",

    messagingSenderId:
        "372788277555",

    appId:
        "1:372788277555:web:1c1a6a80adee1722b54e46",

    measurementId:
        "G-NMPP8PKPK3"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =====================================================
   ELEMENTOS
===================================================== */

const nomeUsuario =
    document.getElementById("nomeUsuario");

const vidasEl =
    document.getElementById("vidas");

const moedasEl =
    document.getElementById("moedas");

const xpEl =
    document.getElementById("xp");

const sequenciaEl =
    document.getElementById("sequencia");


const totalCursosEl =
    document.getElementById("totalCursos");

const licoesConcluidasEl =
    document.getElementById("licoesConcluidas");

const melhorAproveitamentoEl =
    document.getElementById("melhorAproveitamento");

const xpResumoEl =
    document.getElementById("xpResumo");


const resumoGeralEl =
    document.getElementById("resumoGeral");


const listaCursosEl =
    document.getElementById("listaCursos");


const mensagemEl =
    document.getElementById("mensagem");



/* =====================================================
   VARIÁVEIS
===================================================== */

let usuarioAtual = null;

let dadosUsuario = {};

let cursos = [];

let licoes = [];

let progresso = [];



/* =====================================================
   MENSAGEM DE ERRO
===================================================== */

function mostrarErro(texto){

    mensagemEl.innerHTML = `

        <div class="erro">

            ${escapar(texto)}

        </div>

    `;

}



/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }


    return String(valor)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =====================================================
   CARREGAR USUÁRIO
===================================================== */

async function carregarUsuario(){

    const ref =
        doc(
            db,
            "usuarios",
            usuarioAtual.uid
        );


    const snap =
        await getDoc(ref);


    /*
     * Caso o documento não exista
     */

    if(!snap.exists()){

        dadosUsuario = {

            nome: "Aluno",

            vidas: 6,

            vidasInfinitas: false,

            moedas: 0,

            xp: 0,

            sequencia: 0

        };


        nomeUsuario.textContent =
            "Olá, Aluno!";


        vidasEl.textContent =
            "6";


        moedasEl.textContent =
            "0";


        xpEl.textContent =
            "0";


        sequenciaEl.textContent =
            "0";


        return;

    }


    /*
     * Dados reais do usuário
     */

    dadosUsuario =
        snap.data();


    /*
     * Nome
     */

    nomeUsuario.textContent =
        `Olá, ${dadosUsuario.nome || "Aluno"}!`;


    /*
     * =================================================
     * VIDAS
     *
     * Se vidasInfinitas estiver ativo,
     * ignoramos o número armazenado em "vidas".
     *
     * Exemplo:
     *
     * vidas: 2
     * vidasInfinitas: true
     *
     * O painel mostrará:
     *
     * ♾️ Infinitas
     * =================================================
     */

    if(
        dadosUsuario.vidasInfinitas === true
    ){

        vidasEl.textContent =
            "♾️ Infinitas";

    }else{

        vidasEl.textContent =
            dadosUsuario.vidas ?? 6;

    }


    /*
     * Moedas
     */

    moedasEl.textContent =
        dadosUsuario.moedas ?? 0;


    /*
     * XP
     */

    xpEl.textContent =
        dadosUsuario.xp ?? 0;


    /*
     * Sequência
     */

    sequenciaEl.textContent =
        dadosUsuario.sequencia ?? 0;

}



/* =====================================================
   CARREGAR CURSOS
===================================================== */

async function carregarCursos(){

    const snap =
        await getDocs(
            collection(
                db,
                "cursos"
            )
        );


    cursos = [];


    snap.forEach(item => {

        const curso = {

            id: item.id,

            ...item.data()

        };


        if(
            curso.ativo === true
        ){

            cursos.push(curso);

        }

    });


    cursos.sort(
        (a,b) =>

            String(
                a.titulo || ""
            )
            .localeCompare(
                String(
                    b.titulo || ""
                ),
                "pt-BR"
            )
    );

}



/* =====================================================
   CARREGAR LIÇÕES
===================================================== */

async function carregarLicoes(){

    const snap =
        await getDocs(
            collection(
                db,
                "licoes"
            )
        );


    licoes = [];


    snap.forEach(item => {

        const licao = {

            id: item.id,

            ...item.data()

        };


        /*
         * Somente lições ativas entram
         * no cálculo do progresso.
         */

        if(
            licao.ativo === true
        ){

            licoes.push(licao);

        }

    });

}



/* =====================================================
   CARREGAR PROGRESSO
===================================================== */

async function carregarProgresso(){

    const snap =
        await getDocs(
            collection(
                db,
                "progresso"
            )
        );


    progresso = [];


    snap.forEach(item => {

        const dados =
            item.data();


        /*
         * Segurança:
         *
         * só usamos documentos pertencentes
         * ao usuário atualmente logado.
         */

        if(
            dados.usuarioId ===
            usuarioAtual.uid
        ){

            progresso.push({

                id: item.id,

                ...dados

            });

        }

    });

}



/* =====================================================
   ENCONTRAR PROGRESSO DA LIÇÃO
===================================================== */

function progressoDaLicao(
    licaoId
){

    return progresso.find(
        item =>
            item.licaoId ===
            licaoId
    );

}



/* =====================================================
   CALCULAR ESTATÍSTICAS
===================================================== */

function calcularEstatisticas(){

    let totalConcluidas = 0;

    let melhorAproveitamento = 0;


    progresso.forEach(item => {


        if(
            item.aprovado === true
        ){

            totalConcluidas++;

        }


        const aproveitamento =
            Number(
                item.aproveitamento || 0
            );


        if(
            aproveitamento >
            melhorAproveitamento
        ){

            melhorAproveitamento =
                aproveitamento;

        }

    });


    totalCursosEl.textContent =
        cursos.length;


    licoesConcluidasEl.textContent =
        totalConcluidas;


    melhorAproveitamentoEl.textContent =
        `${Math.round(
            melhorAproveitamento
        )}%`;


    xpResumoEl.textContent =
        dadosUsuario.xp ?? 0;



    if(
        licoes.length > 0
    ){

        resumoGeralEl.textContent =
            `${totalConcluidas} de ${licoes.length} lições concluídas`;

    }else{

        resumoGeralEl.textContent =
            "Nenhuma lição cadastrada";

    }

}



/* =====================================================
   CALCULAR PROGRESSO DO CURSO
===================================================== */

function calcularProgressoCurso(
    cursoId
){

    /*
     * Todas as lições ativas pertencentes
     * a este curso.
     */

    const licoesDoCurso =
        licoes.filter(
            licao =>
                licao.cursoId ===
                cursoId
        );


    const total =
        licoesDoCurso.length;


    /*
     * Conta somente lições aprovadas.
     */

    let concluidas = 0;


    licoesDoCurso.forEach(
        licao => {

            const prog =
                progressoDaLicao(
                    licao.id
                );


            if(
                prog &&
                prog.aprovado === true
            ){

                concluidas++;

            }

        }
    );


    let percentual = 0;


    if(
        total > 0
    ){

        percentual =
            Math.round(
                (concluidas / total) * 100
            );

    }


    return {

        total,

        concluidas,

        percentual

    };

}



/* =====================================================
   RENDERIZAR CURSOS
===================================================== */

function renderizarCursos(){

    if(
        cursos.length === 0
    ){

        listaCursosEl.innerHTML = `

            <div class="vazio">

                <h3>
                    📚 Nenhum curso disponível
                </h3>

                <p>
                    Ainda não existem cursos ativos
                    disponíveis para você.
                </p>

                <button
                    class="btn btn-curso"
                    onclick="abrirCursos()"
                >
                    Ver cursos
                </button>

            </div>

        `;

        return;

    }


    listaCursosEl.innerHTML = "";


    const container =
        document.createElement("div");


    container.className =
        "cursos";


    cursos.forEach(curso => {


        const progressoCurso =
            calcularProgressoCurso(
                curso.id
            );


        const card =
            document.createElement("div");


        card.className =
            "curso-card";


        const titulo =
            escapar(
                curso.titulo ||
                "Curso sem título"
            );


        const descricao =
            escapar(
                curso.descricao ||
                "Continue seus estudos neste curso."
            );


        const nivel =
            escapar(
                curso.nivel ||
                "Iniciante"
            );


        const percentual =
            progressoCurso.percentual;


        card.innerHTML = `

            <div class="curso-topo">

                <div>

                    <h3>
                        ${titulo}
                    </h3>

                    <div class="curso-descricao">
                        ${descricao}
                    </div>

                </div>


                <div class="nivel">
                    ${nivel}
                </div>

            </div>


            <div class="progresso-info">

                <span>
                    Progresso
                </span>

                <span class="progresso-percentual">
                    ${percentual}%
                </span>

            </div>


            <div class="barra">

                <div
                    class="barra-progresso"
                    style="width:${percentual}%"
                ></div>

            </div>


            <div class="curso-rodape">

                <span class="info-licoes">

                    ${progressoCurso.concluidas}
                    /
                    ${progressoCurso.total}
                    lições concluídas

                </span>


                <button
                    class="btn btn-curso"
                    data-curso="${curso.id}"
                >

                    ${
                        percentual >= 100
                        ? "Revisar curso"
                        : "Continuar curso"
                    }

                </button>

            </div>

        `;


        const botao =
            card.querySelector(
                "[data-curso]"
            );


        botao.addEventListener(
            "click",
            () => {

                abrirCurso(
                    curso.id
                );

            }
        );


        container.appendChild(
            card
        );

    });


    listaCursosEl.appendChild(
        container
    );

}



/* =====================================================
   ABRIR CURSO
===================================================== */

function abrirCurso(
    cursoId
){

    window.location.href =
        `curso.html?cursoId=${encodeURIComponent(
            cursoId
        )}`;

}



/* =====================================================
   ABRIR CURSOS
===================================================== */

function abrirCursos(){

    window.location.href =
        "cursos.html";

}



/* =====================================================
   ABRIR CARTEIRA
===================================================== */

function abrirCarteira(){

    window.location.href =
        "carteira.html";

}



/* =====================================================
   SAIR
===================================================== */

async function sair(){

    try{

        await signOut(
            auth
        );


        window.location.href =
            "index.html";

    }catch(error){

        console.error(
            error
        );


        mostrarErro(
            "Não foi possível sair da conta."
        );

    }

}



/* =====================================================
   EXPOR FUNÇÕES
===================================================== */

window.abrirCurso =
    abrirCurso;

window.abrirCursos =
    abrirCursos;

window.abrirCarteira =
    abrirCarteira;

window.sair =
    sair;



/* =====================================================

===================================================== */

onAuthStateChanged(
    auth,
    async (user) => {


        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        usuarioAtual =
            user;


        try{


            /*
             * Carregamos tudo antes
             * de montar o painel.
             */

            await carregarUsuario();

            await carregarCursos();

            await carregarLicoes();

            await carregarProgresso();


            /*
             * Agora temos:
             *
             * cursos
             * lições
             * progresso
             *
             * e podemos calcular
             * o progresso real.
             */

            calcularEstatisticas();

            renderizarCursos();


        }catch(error){

            console.error(
                "Erro ao carregar painel:",
                error
            );


            mostrarErro(
                "Não foi possível carregar seu painel. Verifique o console."
            );

        }

    }
);

</script>
