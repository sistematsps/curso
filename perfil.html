<!DOCTYPE html>

<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Perfil - Aprende+</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#222;
    padding-bottom:90px;
}

/* HEADER */

header{
    background:#fff;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.header-content{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#4f46e5;
}

.header-xp{
    font-weight:bold;
    color:#4f46e5;
}

/* CONTAINER */

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

/* PERFIL */

.perfil-topo{
    background:#fff;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#e8eaff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    margin:0 auto 15px;
}

.nome-aluno{
    font-size:24px;
    font-weight:bold;
    margin-bottom:6px;
}

.nivel-nome{
    color:#777;
    margin-bottom:18px;
}

.nivel-box{
    max-width:500px;
    margin:auto;
}

.nivel-info{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#666;
    margin-bottom:7px;
}

.barra{
    width:100%;
    height:12px;
    background:#e9e9ef;
    border-radius:20px;
    overflow:hidden;
}

.barra-progresso{
    height:100%;
    background:#4f46e5;
    border-radius:20px;
    transition:.3s;
}

/* CARDS DE ESTATISTICAS */

.estatisticas{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border-radius:16px;
    padding:18px 10px;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.stat-icon{
    font-size:26px;
    margin-bottom:7px;
}

.stat-valor{
    font-size:20px;
    font-weight:bold;
}

.stat-label{
    font-size:12px;
    color:#777;
    margin-top:4px;
}

/* SECOES */

.secao{
    background:#fff;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.secao h2{
    font-size:20px;
    margin-bottom:16px;
}

/* CONQUISTAS */

.conquistas{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.conquista{
    border:1px solid #eee;
    border-radius:14px;
    padding:15px 10px;
    text-align:center;
    opacity:.38;
}

.conquista.conquistada{
    opacity:1;
    background:#f7f7ff;
    border-color:#dfe1ff;
}

.conquista-icon{
    font-size:32px;
    margin-bottom:8px;
}

.conquista-nome{
    font-weight:bold;
    font-size:13px;
}

.conquista-descricao{
    font-size:11px;
    color:#777;
    margin-top:5px;
}

/* CURSOS */

.curso{
    border:1px solid #eee;
    border-radius:14px;
    padding:15px;
    margin-bottom:12px;
}

.curso:last-child{
    margin-bottom:0;
}

.curso-topo{
    display:flex;
    align-items:center;
    gap:12px;
}

.curso-icone{
    width:50px;
    height:50px;
    border-radius:12px;
    background:#f0f1ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
}

.curso-info{
    flex:1;
}

.curso-nome{
    font-weight:bold;
}

.curso-progresso-texto{
    font-size:12px;
    color:#777;
    margin-top:5px;
}

.barra-curso{
    height:9px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    margin-top:12px;
}

.barra-curso div{
    height:100%;
    background:#4f46e5;
    border-radius:20px;
}

/* SEM CURSOS */

.vazio{
    text-align:center;
    color:#777;
    padding:20px 5px;
}

/* NAVEGAÇÃO */

nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:72px;
    background:#fff;
    box-shadow:0 -2px 12px rgba(0,0,0,.10);
    display:flex;
    justify-content:center;
    z-index:20;
}

.nav-inner{
    width:100%;
    max-width:600px;
    display:flex;
}

.nav-item{
    flex:1;
    border:none;
    background:none;
    font-size:12px;
    color:#777;
    cursor:pointer;
}

.nav-item span{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

.nav-item.ativo{
    color:#4f46e5;
    font-weight:bold;
}

/* RESPONSIVO */

@media(max-width:650px){

    .estatisticas{
        grid-template-columns:repeat(2,1fr);
    }

    .conquistas{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>

<body>

<header>


<div class="header-content">

    <div class="logo">
        📚 Aprende+
    </div>

    <div class="header-xp" id="xpHeader">
        ⭐ 0 XP
    </div>

</div>


</header>

<div class="container">


<!-- PERFIL -->

<div class="perfil-topo">

    <div class="avatar">
        👤
    </div>

    <div class="nome-aluno" id="nomeAluno">
        Estudante
    </div>

    <div class="nivel-nome" id="nivelNome">
        Iniciante
    </div>

    <div class="nivel-box">

        <div class="nivel-info">

            <span id="nivelAtual">
                Nível 1
            </span>

            <span id="xpNivel">
                0 / 100 XP
            </span>

        </div>

        <div class="barra">

            <div
                class="barra-progresso"
                id="barraNivel"
                style="width:0%">
            </div>

        </div>

    </div>

</div>


<!-- ESTATÍSTICAS -->

<div class="estatisticas">

    <div class="stat">

        <div class="stat-icon">
            ⭐
        </div>

        <div class="stat-valor" id="statXP">
            0
        </div>

        <div class="stat-label">
            XP total
        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">
            ⚡
        </div>

        <div class="stat-valor" id="statEnergia">
            5
        </div>

        <div class="stat-label">
            Energia
        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">
            🔥
        </div>

        <div class="stat-valor" id="statSequencia">
            0
        </div>

        <div class="stat-label">
            Dias seguidos
        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">
            📖
        </div>

        <div class="stat-valor" id="statLicoes">
            0
        </div>

        <div class="stat-label">
            Lições
        </div>

    </div>

</div>


<!-- CONQUISTAS -->

<div class="secao">

    <h2>
        🏅 Conquistas
    </h2>

    <div
        class="conquistas"
        id="conquistas">
    </div>

</div>


<!-- CURSOS -->

<div class="secao">

    <h2>
        📚 Meus cursos
    </h2>

    <div id="meusCursos">

        <div class="vazio">
            Carregando cursos...
        </div>

    </div>

</div>


</div>

<!-- NAVEGAÇÃO -->

<nav>


<div class="nav-inner">

    <button
        class="nav-item"
        onclick="irInicio()">

        <span>🏠</span>
        Início

    </button>


    <button
        class="nav-item"
        onclick="irCursos()">

        <span>📚</span>
        Cursos

    </button>


    <button
        class="nav-item"
        onclick="irRanking()">

        <span>🏆</span>
        Ranking

    </button>


    <button
        class="nav-item ativo">

        <span>👤</span>
        Perfil

    </button>

</div>


</nav>

<script>

/* ==============================
   CONFIGURAÇÕES
============================== */

const CHAVE_ALUNO = "aprendeAluno";
const CHAVE_CURSOS = "aprendeCursos";
const CHAVE_MATRICULAS = "aprendeMatriculas";
const CHAVE_XP = "aprendeXP";
const CHAVE_ENERGIA = "aprendeEnergia";
const CHAVE_SEQUENCIA = "aprendeSequencia";
const CHAVE_LICOES = "aprendeLicoesConcluidas";


let aluno = null;
let cursos = [];
let matriculas = [];
let xp = 0;
let energia = 5;
let sequencia = 0;
let licoesConcluidas = [];


/* ==============================
   CONQUISTAS
============================== */

const CONQUISTAS = [

    {
        id:"primeira_licao",
        icone:"🌱",
        nome:"Primeiro passo",
        descricao:"Conclua sua primeira lição."
    },

    {
        id:"cinco_licoes",
        icone:"📚",
        nome:"Estudioso",
        descricao:"Conclua 5 lições."
    },

    {
        id:"dez_licoes",
        icone:"🔥",
        nome:"Em evolução",
        descricao:"Conclua 10 lições."
    },

    {
        id:"cem_xp",
        icone:"⭐",
        nome:"100 XP",
        descricao:"Alcance 100 XP."
    },

    {
        id:"quinhentos_xp",
        icone:"💫",
        nome:"500 XP",
        descricao:"Alcance 500 XP."
    },

    {
        id:"sequencia_3",
        icone:"🔥",
        nome:"3 dias",
        descricao:"Mantenha uma sequência de 3 dias."
    },

    {
        id:"sequencia_7",
        icone:"🔥",
        nome:"Uma semana",
        descricao:"Mantenha uma sequência de 7 dias."
    },

    {
        id:"curso_concluido",
        icone:"🎓",
        nome:"Formado",
        descricao:"Conclua um curso."
    },

    {
        id:"nivel_5",
        icone:"🏅",
        nome:"Nível 5",
        descricao:"Alcance o nível 5."
    }

];


/* ==============================
   CARREGAR DADOS
============================== */

function carregarDados(){

    try{

        aluno = JSON.parse(
            localStorage.getItem(CHAVE_ALUNO)
        );

    }catch(e){

        aluno = null;

    }


    if(!aluno){

        aluno = {

            id:"aluno_demo",
            nome:"Estudante"

        };

        localStorage.setItem(
            CHAVE_ALUNO,
            JSON.stringify(aluno)
        );

    }


    try{

        cursos = JSON.parse(
            localStorage.getItem(CHAVE_CURSOS)
        ) || [];

    }catch(e){

        cursos = [];

    }


    try{

        matriculas = JSON.parse(
            localStorage.getItem(CHAVE_MATRICULAS)
        ) || [];

    }catch(e){

        matriculas = [];

    }


    xp = Number(
        localStorage.getItem(CHAVE_XP) || 0
    );


    energia = Number(
        localStorage.getItem(CHAVE_ENERGIA) || 5
    );


    sequencia = Number(
        localStorage.getItem(CHAVE_SEQUENCIA) || 0
    );


    try{

        licoesConcluidas =
            JSON.parse(
                localStorage.getItem(CHAVE_LICOES)
            ) || [];

    }catch(e){

        licoesConcluidas = [];

    }

}


/* ==============================
   NÍVEL
============================== */

function calcularNivel(valorXP){

    let nivel = 1;

    let acumulado = 0;

    while(
        valorXP >= acumulado + (nivel * 100)
    ){

        acumulado += nivel * 100;

        nivel++;

    }

    const necessario =
        nivel * 100;

    const progresso =
        valorXP - acumulado;

    const percentual =
        Math.min(
            100,
            (progresso / necessario) * 100
        );

    return {

        nivel,
        acumulado,
        necessario,
        progresso,
        percentual

    };

}


/* ==============================
   NOME DO NÍVEL
============================== */

function nomeNivel(nivel){

    if(nivel >= 10)
        return "Mestre";

    if(nivel >= 8)
        return "Especialista";

    if(nivel >= 6)
        return "Avançado";

    if(nivel >= 4)
        return "Intermediário";

    if(nivel >= 2)
        return "Aprendiz";

    return "Iniciante";

}


/* ==============================
   CONQUISTAS
============================== */

function verificarConquista(id){

    if(id === "primeira_licao")
        return licoesConcluidas.length >= 1;

    if(id === "cinco_licoes")
        return licoesConcluidas.length >= 5;

    if(id === "dez_licoes")
        return licoesConcluidas.length >= 10;

    if(id === "cem_xp")
        return xp >= 100;

    if(id === "quinhentos_xp")
        return xp >= 500;

    if(id === "sequencia_3")
        return sequencia >= 3;

    if(id === "sequencia_7")
        return sequencia >= 7;

    if(id === "nivel_5")
        return calcularNivel(xp).nivel >= 5;

    if(id === "curso_concluido")
        return verificarCursoConcluido();

    return false;

}


/* ==============================
   CURSO CONCLUÍDO
============================== */

function verificarCursoConcluido(){

    for(const matricula of matriculas){

        if(
            matricula.alunoId !== aluno.id ||
            matricula.ativa === false
        ){
            continue;
        }

        const curso =
            cursos.find(
                c => c.id === matricula.cursoId
            );

        if(!curso)
            continue;

        const todasLicoes =
            obterLicoesCurso(curso);

        if(
            todasLicoes.length > 0 &&
            todasLicoes.every(
                licao =>
                    licoesConcluidas.includes(licao.id)
            )
        ){

            return true;

        }

    }

    return false;

}


/* ==============================
   OBTER LIÇÕES DO CURSO
============================== */

function obterLicoesCurso(curso){

    const lista = [];

    if(!curso.unidades)
        return lista;

    const unidades =
        curso.unidades
        .filter(u => u.ativo !== false)
        .sort(
            (a,b) =>
                (a.ordem || 0) -
                (b.ordem || 0)
        );

    unidades.forEach(unidade => {

        const licoes =
            (unidade.licoes || [])
            .filter(l => l.ativo !== false)
            .sort(
                (a,b) =>
                    (a.ordem || 0) -
                    (b.ordem || 0)
            );

        licoes.forEach(licao => {

            lista.push(licao);

        });

    });

    return lista;

}


/* ==============================
   PROGRESSO DO CURSO
============================== */

function progressoCurso(curso){

    const licoes =
        obterLicoesCurso(curso);

    if(!licoes.length)
        return 0;

    const concluidas =
        licoes.filter(
            licao =>
                licoesConcluidas.includes(licao.id)
        ).length;

    return Math.round(
        (concluidas / licoes.length) * 100
    );

}


/* ==============================
   ESCAPAR HTML
============================== */

function escapar(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==============================
   RENDERIZAR PERFIL
============================== */

function renderizarPerfil(){

    const nivel =
        calcularNivel(xp);


    document.getElementById(
        "nomeAluno"
    ).textContent =
        aluno.nome || "Estudante";


    document.getElementById(
        "nivelAtual"
    ).textContent =
        `Nível ${nivel.nivel}`;


    document.getElementById(
        "nivelNome"
    ).textContent =
        nomeNivel(nivel.nivel);


    document.getElementById(
        "xpNivel"
    ).textContent =
        `${nivel.progresso} / ${nivel.necessario} XP`;


    document.getElementById(
        "barraNivel"
    ).style.width =
        `${nivel.percentual}%`;


    document.getElementById(
        "xpHeader"
    ).textContent =
        `⭐ ${xp} XP`;


    document.getElementById(
        "statXP"
    ).textContent =
        xp;


    document.getElementById(
        "statEnergia"
    ).textContent =
        energia;


    document.getElementById(
        "statSequencia"
    ).textContent =
        sequencia;


    document.getElementById(
        "statLicoes"
    ).textContent =
        licoesConcluidas.length;


    renderizarConquistas();

    renderizarCursos();

}


/* ==============================
   RENDERIZAR CONQUISTAS
============================== */

function renderizarConquistas(){

    const elemento =
        document.getElementById(
            "conquistas"
        );


    elemento.innerHTML =
        CONQUISTAS.map(conquista => {

            const conquistada =
                verificarConquista(
                    conquista.id
                );


            return `

                <div class="conquista ${
                    conquistada
                        ? "conquistada"
                        : ""
                }">

                    <div class="conquista-icon">
                        ${conquista.icone}
                    </div>

                    <div class="conquista-nome">
                        ${escapar(conquista.nome)}
                    </div>

                    <div class="conquista-descricao">
                        ${escapar(conquista.descricao)}
                    </div>

                </div>

            `;

        }).join("");

}


/* ==============================
   RENDERIZAR CURSOS
============================== */

function renderizarCursos(){

    const elemento =
        document.getElementById(
            "meusCursos"
        );


    const meusCursos =
        matriculas
        .filter(
            matricula =>
                matricula.alunoId === aluno.id &&
                matricula.ativa !== false
        )
        .map(
            matricula =>
                cursos.find(
                    curso =>
                        curso.id === matricula.cursoId &&
                        curso.ativo !== false
                )
        )
        .filter(Boolean);


    if(!meusCursos.length){

        elemento.innerHTML = `

            <div class="vazio">

                📚 Você ainda não está matriculado
                em nenhum curso.

            </div>

        `;

        return;

    }


    elemento.innerHTML =
        meusCursos.map(curso => {

            const progresso =
                progressoCurso(curso);


            return `

                <div class="curso">

                    <div class="curso-topo">

                        <div class="curso-icone">
                            ${curso.icone || "📚"}
                        </div>

                        <div class="curso-info">

                            <div class="curso-nome">
                                ${escapar(curso.nome)}
                            </div>

                            <div class="curso-progresso-texto">

                                ${progresso}% concluído

                            </div>

                        </div>

                    </div>


                    <div class="barra-curso">

                        <div
                            style="width:${progresso}%">
                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


/* ==============================
   NAVEGAÇÃO
============================== */

function irInicio(){

    window.location.href =
        "index.html";

}


function irCursos(){

    window.location.href =
        "cursos.html";

}


function irRanking(){

    window.location.href =
        "ranking.html";

}


/* ==============================
   INICIAR
============================== */

carregarDados();

renderizarPerfil();

</script>

</body>

</html>
