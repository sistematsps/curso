         return "";                                                                        
     }                                                                                     
                                                                                       
                                                                                       
     return String(valor)                                                                  
                                                                                       
         .replace(/&/g, "&amp;")                                                           
                                                                                       
         .replace(/</g, "&lt;")                                                           
                                                                                       
         .replace(/>/g, "&gt;")                                                            
                                                                                       
         .replace(/"/g, "&quot;")                                                          
                                                                                       
         .replace(/'/g, "&#039;");                                                         
 }

 // ======================================================                                 
 // CARREGAR CURSOS                                                                        
 // ======================================================                                 
                                                                                       
 async function carregarCursos() {                                                         
                                                                                       
     try {                                                                                 
                                                                                       
         const snapshot =                                                                  
             await getDocs(                                                                
                 collection(db, "cursos")                                                  
             );                                                                            
                                                                                       
                                                                                       
         cursos = [];                                                                      
                                                                                       
                                                                                       
         snapshot.forEach((item) => {                                                      
                                                                                       
             cursos.push({                                                                 
                                                                                       
                 id: item.id,                                                              
                                                                                       
                 ...item.data()                                                            
                                                                                       
             });                                                                           
                                                                                       
         });                                                                               
                                                                                       
                                                                                       
         cursos.sort((a, b) => {                                                           
                                                                                       
             const nomeA =                                                                 
                 (a.titulo || "")                                                        
                 .toLowerCase();                                                           
                                                                                       
             const nomeB =                                                                 
                 (b.titulo || "")                                                        
                 .toLowerCase();                                                           
                                                                                       
                                                                                       
             return nomeA.localeCompare(nomeB);                                            
                                                                                       
         });                                                                               
                                                                                       
                                                                                       
         cursoSelect.innerHTML =                                                           
             '<option value="">Selecione um curso...</option>';                          
                                                                                       
                                                                                       
         cursos.forEach((curso) => {                                                       
                                                                                       
             const option =                                                                
                 document.createElement("option");                                         
                                                                                       
                                                                                       
             option.value =                                                                
                 curso.id;                                                                 
                                                                                       
                                                                                       
             option.textContent =                                                          
                 (curso.titulo || "Curso sem título") +                                  
                 (curso.ativo === false                                                    
                     ? " — INATIVO"                                                        
                     : "");                                                                
                                                                                       
                                                                                       
             cursoSelect.appendChild(option);                                              
                                                                                       
         });                                                                               
                                                                                       
                                                                                       
         if (cursos.length === 0) {                                                        
                                                                                       
             cursoSelect.innerHTML =                                                       
                 '<option value="">Nenhum curso cadastrado</option>';                    
                                                                                       
                                                                                       
             loading.textContent =                                                         
                 "Cadastre primeiro um curso.";                                            
                                                                                       
         }                                                                                 
                                                                                       
     } catch (erro) {                                                                      
                                                                                       
         console.error(erro);                                                              
                                                                                       
                                                                                       
         mostrarMensagem(                                                                  
             "Erro ao carregar os cursos.",                                                
             "erro"                                                                        
         );                                                                                
                                                                                       
                                                                                       
         cursoSelect.innerHTML =                                                           
             '<option value="">Erro ao carregar</option>';                               
                                                                                       
     }

 async function carregarModulos(cursoId) {

                 collection(db, "modulos")                                                 
             );

             ) {                                                                           
                                                                                       
                 modulos.push({

                     ...dados                                                              
                                                                                       
                 });                                                                       
                                                                                       
             }                                                                             
                                                                                       
         });                                                                               
                                                                                       
                                                                                       
         modulos.sort((a, b) => {

                 -                                                                         
                 Number(b.ordem || 0);                                                   
                                                                                       
         });                                                                               
                                                                                       
                                                                                       
         moduloSelect.innerHTML =                                                          
             '<option value="">Selecione um módulo...</option>';

             "Erro ao carregar os módulos.",                                               
             "erro"                                                                        
         );                                                                                
                                                                                       
     }

                     </button>

             </td>

         listaLicoes.appendChild(tr);                                                      
                                                                                       
     });

                 "erro"                                                                    
             );                                                                            
                                                                                       
             return;                                                                       
                                                                                       
         }

                 "Informe uma ordem válida.",                                              
                 "erro"                                                                    
             );                                                                            
                                                                                       
             ordem.focus();

             } catch (erro) {

<script>
/* ==========================================================
   EDITOR DE CONTEÚDOS DA LIÇÃO
   Coleção Firestore: conteudos
   Não altera os documentos existentes em "licoes" ou "exercicios".
   ========================================================== */

const ceEditor = document.getElementById("editorConteudos");
const ceLista = document.getElementById("listaConteudos");
const ceModal = document.getElementById("modalConteudo");
const ceTipo = document.getElementById("tipoConteudo");
const ceTitulo = document.getElementById("tituloConteudo");
const ceTexto = document.getElementById("textoConteudo");
const ceUrl = document.getElementById("urlConteudo");
const ceOrdem = document.getElementById("ordemConteudo");
const ceSalvar = document.getElementById("salvarConteudo");
const ceCancelar = document.getElementById("cancelarConteudo");
const ceTituloModal = document.getElementById("tituloModalConteudo");

let ceLicaoId = null;
let ceConteudoEditando = null;
let ceConteudos = [];

const ceTiposNomes = {
    titulo: "Título",
    texto: "Texto",
    imagem: "Imagem",
    video: "Vídeo",
    link: "Link",
    pdf: "PDF",
    arquivo: "Arquivo",
    audio: "Áudio",
    lista: "Lista",
    citacao: "Citação",
    separador: "Separador"
};

function ceEscapar(valor) {
    const div = document.createElement("div");
    div.textContent = valor == null ? "" : String(valor);
    return div.innerHTML;
}

function ceUrlValida(valor) {
    try {
        const u = new URL(valor);
        return ["http:", "https:"].includes(u.protocol);
    } catch {
        return false;
    }
}

function ceYouTubeEmbed(url) {
    try {
        const u = new URL(url);
        let id = "";

        if (u.hostname.includes("youtu.be")) {
            id = u.pathname.replace("/", "").split("/")[0];
        } else if (u.hostname.includes("youtube.com")) {
            id = u.searchParams.get("v") || "";
            if (!id && u.pathname.startsWith("/shorts/")) {
                id = u.pathname.split("/")[2] || "";
            }
            if (!id && u.pathname.startsWith("/embed/")) {
                id = u.pathname.split("/")[2] || "";
            }
        }

        if (!id) return null;
        return "https://www.youtube.com/embed/" + encodeURIComponent(id);
    } catch {
        return null;
    }
}

function ceAbrirModal(tipo = "texto", dados = null) {
    ceConteudoEditando = dados ? dados.id : null;

    ceTituloModal.textContent = dados ? "Editar conteúdo" : "Novo conteúdo";
    ceTipo.value = dados ? (dados.tipo || "texto") : tipo;
    ceTitulo.value = dados ? (dados.titulo || "") : "";
    ceTexto.value = dados ? (dados.texto || "") : "";
    ceUrl.value = dados ? (dados.url || "") : "";
    ceOrdem.value = dados ? (Number(dados.ordem) || 1) : (ceConteudos.length + 1);

    ceAtualizarCampos();
    ceModal.classList.add("aberto");
    ceModal.setAttribute("aria-hidden", "false");
}

function ceFecharModal() {
    ceConteudoEditando = null;
    ceModal.classList.remove("aberto");
    ceModal.setAttribute("aria-hidden", "true");
}

function ceAtualizarCampos() {
    const tipo = ceTipo.value;

    const precisaTexto = ["texto", "lista", "citacao"].includes(tipo);
    const precisaUrl = ["imagem", "video", "link", "pdf", "arquivo", "audio"].includes(tipo);
    const precisaTitulo = tipo !== "separador";

    document.getElementById("campoTextoConteudo").style.display =
        precisaTexto ? "block" : "none";

    document.getElementById("campoUrlConteudo").style.display =
        precisaUrl ? "block" : "none";

    document.getElementById("campoTituloConteudo").style.display =
        precisaTitulo ? "block" : "none";

    document.getElementById("campoOrdemConteudo").style.display = "block";
}

async function ceCarregarConteudos(licaoId) {
    ceLicaoId = licaoId;
    ceEditor.style.display = "block";
    ceLista.innerHTML = '<div class="conteudo-vazio">Carregando conteúdos...</div>';

    try {
        const snap = await getDocs(collection(db, "conteudos"));

        ceConteudos = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .filter(c => c.licaoId === licaoId)
            .sort((a, b) => (Number(a.ordem) || 0) - (Number(b.ordem) || 0));

        ceRenderizar();
    } catch (erro) {
        console.error("Erro ao carregar conteúdos:", erro);
        ceLista.innerHTML =
            '<div class="conteudo-vazio">Não foi possível carregar os conteúdos.</div>';
    }
}

function ceRenderizar() {
    if (!ceConteudos.length) {
        ceLista.innerHTML =
            '<div class="conteudo-vazio">Esta aula ainda não possui conteúdos. Use os botões acima para adicionar.</div>';
        return;
    }

    ceLista.innerHTML = "";

    ceConteudos.forEach((c, indice) => {
        const card = document.createElement("div");
        card.className = "conteudo-card" + (c.ativo === false ? " c-inativo" : "");

        const head = document.createElement("div");
        head.className = "conteudo-card-head";

        const titulo = document.createElement("strong");
        titulo.innerHTML =
            "#" + ceEscapar(indice + 1) + " " +
            ceEscapar(c.titulo || ceTiposNomes[c.tipo] || "Conteúdo") +
            ' <span class="badge-tipo">' + ceEscapar(ceTiposNomes[c.tipo] || c.tipo) + "</span>";

        const acoes = document.createElement("div");
        acoes.className = "conteudo-acoes";

        const cima = document.createElement("button");
        cima.type = "button";
        cima.textContent = "↑";
        cima.title = "Mover para cima";
        cima.disabled = indice === 0;
        cima.addEventListener("click", () => ceMover(indice, -1));

        const baixo = document.createElement("button");
        baixo.type = "button";
        baixo.textContent = "↓";
        baixo.title = "Mover para baixo";
        baixo.disabled = indice === ceConteudos.length - 1;
        baixo.addEventListener("click", () => ceMover(indice, 1));

        const editar = document.createElement("button");
        editar.type = "button";
        editar.textContent = "Editar";
        editar.addEventListener("click", () => ceAbrirModal(c.tipo, c));

        const status = document.createElement("button");
        status.type = "button";
        status.textContent = c.ativo === false ? "Ativar" : "Desativar";
        status.addEventListener("click", () => ceAlternarStatus(c));

        const excluir = document.createElement("button");
        excluir.type = "button";
        excluir.textContent = "Excluir";
        excluir.className = "danger";
        excluir.addEventListener("click", () => ceExcluir(c));

        acoes.append(cima, baixo, editar, status, excluir);
        head.append(titulo, acoes);

        const body = document.createElement("div");
        body.className = "conteudo-card-body";

        if (c.tipo === "titulo") {
            const h = document.createElement("h3");
            h.textContent = c.titulo || "Título";
            body.appendChild(h);
        } else if (c.tipo === "texto" || c.tipo === "citacao") {
            body.textContent = c.texto || "";
            if (c.tipo === "citacao") {
                body.style.borderLeft = "4px solid #98a2b3";
                body.style.paddingLeft = "12px";
                body.style.fontStyle = "italic";
            }
        } else if (c.tipo === "lista") {
            const ul = document.createElement("ul");
            (c.texto || "").split("\n").filter(Boolean).forEach(item => {
                const li = document.createElement("li");
                li.textContent = item.replace(/^[-*•]\s*/, "");
                ul.appendChild(li);
            });
            body.appendChild(ul);
        } else if (c.tipo === "imagem") {
            if (ceUrlValida(c.url || "")) {
                const img = document.createElement("img");
                img.src = c.url;
                img.alt = c.titulo || "Imagem da aula";
                img.loading = "lazy";
                img.onerror = () => {
                    body.textContent = "Não foi possível carregar a imagem.";
                };
                body.appendChild(img);
            } else {
                body.textContent = c.url || "URL da imagem não informada.";
            }
        } else if (c.tipo === "video") {
            const embed = ceYouTubeEmbed(c.url || "");
            if (embed) {
                const iframe = document.createElement("iframe");
                iframe.src = embed;
                iframe.title = c.titulo || "Vídeo da aula";
                iframe.loading = "lazy";
                iframe.allow =
                    "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
                iframe.allowFullscreen = true;
                body.appendChild(iframe);
            } else {
                const a = document.createElement("a");
                a.href = c.url || "#";
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.textContent = c.url || "Abrir vídeo";
                body.appendChild(a);
            }
        } else if (["link", "pdf", "arquivo", "audio"].includes(c.tipo)) {
            const a = document.createElement("a");
            a.href = c.url || "#";
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent =
                c.tipo === "pdf" ? "📄 Abrir PDF" :
                c.tipo === "audio" ? "🎵 Abrir áudio" :
                c.tipo === "arquivo" ? "📎 Abrir arquivo" :
                (c.titulo || "Abrir link");
            body.appendChild(a);
        } else if (c.tipo === "separador") {
            body.innerHTML = "<hr>";
        }

        card.append(head, body);
        ceLista.appendChild(card);
    });
}

async function ceSalvarDados() {
    if (!ceLicaoId) {
        alert("Primeiro salve ou selecione uma lição.");
        return;
    }

    const tipo = ceTipo.value;
    const titulo = ceTitulo.value.trim();
    const texto = ceTexto.value.trim();
    const url = ceUrl.value.trim();
    const ordem = Number(ceOrdem.value);

    if (tipo !== "separador" && !titulo && !texto && !url) {
        alert("Preencha pelo menos um conteúdo.");
        return;
    }

    if (["imagem", "video", "link", "pdf", "arquivo", "audio"].includes(tipo)) {
        if (!ceUrlValida(url)) {
            alert("Informe uma URL válida iniciando com http:// ou https://.");
            ceUrl.focus();
            return;
        }
    }

    if (!ordem || ordem < 1) {
        alert("Informe uma ordem válida.");
        ceOrdem.focus();
        return;
    }

    const dados = {
        licaoId: ceLicaoId,
        tipo,
        titulo,
        texto,
        url,
        ordem,
        ativo: true,
        atualizadoEm: serverTimestamp()
    };

    try {
        if (ceConteudoEditando) {
            await updateDoc(
                doc(db, "conteudos", ceConteudoEditando),
                dados
            );
        } else {
            await addDoc(collection(db, "conteudos"), {
                ...dados,
                criadoEm: serverTimestamp()
            });
        }

        ceFecharModal();
        await ceCarregarConteudos(ceLicaoId);
    } catch (erro) {
        console.error("Erro ao salvar conteúdo:", erro);
        alert("Erro ao salvar conteúdo. Verifique o console e as regras do Firestore.");
    }
}

async function ceAlternarStatus(c) {
    try {
        await updateDoc(doc(db, "conteudos", c.id), {
            ativo: c.ativo === false,
            atualizadoEm: serverTimestamp()
        });
        await ceCarregarConteudos(ceLicaoId);
    } catch (erro) {
        console.error(erro);
        alert("Não foi possível alterar o status.");
    }
}

async function ceExcluir(c) {
    if (!confirm("Excluir este conteúdo da aula?")) return;

    try {
        await deleteDoc(doc(db, "conteudos", c.id));
        await ceCarregarConteudos(ceLicaoId);
    } catch (erro) {
        console.error(erro);
        alert("Não foi possível excluir o conteúdo.");
    }
}

async function ceMover(indice, deslocamento) {
    const novoIndice = indice + deslocamento;
    if (novoIndice < 0 || novoIndice >= ceConteudos.length) return;

    const atual = ceConteudos[indice];
    const outro = ceConteudos[novoIndice];

    try {
        await updateDoc(doc(db, "conteudos", atual.id), {
            ordem: Number(outro.ordem) || novoIndice + 1,
            atualizadoEm: serverTimestamp()
        });

        await updateDoc(doc(db, "conteudos", outro.id), {
            ordem: Number(atual.ordem) || indice + 1,
            atualizadoEm: serverTimestamp()
        });

        await ceCarregarConteudos(ceLicaoId);
    } catch (erro) {
        console.error(erro);
        alert("Não foi possível reordenar os conteúdos.");
    }
}

document.querySelectorAll("[data-novo-conteudo]").forEach(botao => {
    botao.addEventListener("click", () => {
        ceAbrirModal(botao.dataset.novoConteudo);
    });
});

ceTipo.addEventListener("change", ceAtualizarCampos);
ceSalvar.addEventListener("click", ceSalvarDados);
ceCancelar.addEventListener("click", ceFecharModal);

ceModal.addEventListener("click", evento => {
    if (evento.target === ceModal) ceFecharModal();
});

/*
 * Integração com a função existente de edição.
 * Quando o formulário existente abre uma lição para edição,
 * chamamos o editor depois que licaoEditando recebe o ID.
 */
const ceOriginalCarregarLicoes = typeof carregarLicoes === "function"
    ? carregarLicoes
    : null;

/*
 * Função pública para usar também em outros pontos da página.
 * Ex.: ceAbrirEditorConteudos("ID_DA_LICAO")
 */
window.ceAbrirEditorConteudos = async function(licaoId) {
    if (!licaoId) return;
    await ceCarregarConteudos(licaoId);
};

/*
 * Observa alterações no formulário existente para descobrir
 * quando uma lição está sendo editada sem substituir o CRUD original.
 */
if (typeof formLicao !== "undefined") {
    formLicao.addEventListener("submit", async () => {
        setTimeout(async () => {
            if (typeof licaoEditando !== "undefined" && licaoEditando) {
                await ceCarregarConteudos(licaoEditando);
            }
        }, 700);
    });
}

/* Oculta o editor quando o formulário é limpo/fechado. */
if (typeof btnNovo !== "undefined") {
    btnNovo.addEventListener("click", () => {
        ceLicaoId = null;
        ceConteudos = [];
        ceEditor.style.display = "none";
    });
}
</script>
