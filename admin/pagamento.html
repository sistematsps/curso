<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamentos - Administração</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:#111827;
    color:white;
    padding:20px;
}

header .topo{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

header h1{
    margin:0;
    font-size:24px;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.filtros{
    display:grid;
    grid-template-columns:1fr 200px;
    gap:12px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.btn-voltar{
    background:#374151;
    color:white;
}

.btn-atualizar{
    background:#2563eb;
    color:white;
}

.btn-pagar{
    background:#16a34a;
    color:white;
}

.btn-cancelar{
    background:#dc2626;
    color:white;
}

button:hover{
    opacity:.9;
}

.tabela{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th,
td{
    padding:12px 10px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    vertical-align:middle;
}

th{
    background:#f9fafb;
    font-size:14px;
}

td{
    font-size:14px;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status-pendente{
    background:#fef3c7;
    color:#92400e;
}

.status-pago{
    background:#dcfce7;
    color:#166534;
}

.status-cancelado{
    background:#fee2e2;
    color:#991b1b;
}

.acoes{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.vazio{
    text-align:center;
    padding:35px;
    color:#6b7280;
}

.erro{
    color:#b91c1c;
    background:#fee2e2;
    border:1px solid #fecaca;
    padding:15px;
    border-radius:8px;
}

.info{
    color:#1d4ed8;
    background:#dbeafe;
    border:1px solid #bfdbfe;
    padding:15px;
    border-radius:8px;
}

.resumo{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.resumo-box{
    background:#f9fafb;
    border-radius:10px;
    padding:18px;
    border:1px solid #e5e7eb;
}

.resumo-box strong{
    display:block;
    font-size:25px;
    margin-top:5px;
}

@media(max-width:700px){

    .filtros{
        grid-template-columns:1fr;
    }

    .resumo{
        grid-template-columns:repeat(2,1fr);
    }

    header .topo{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>
</head>

<body>

<header>

    <div class="topo">

        <h1>💳 Pagamentos</h1>

        <button
            class="btn-voltar"
            onclick="window.location.href='dashboard.html'">
            ← Voltar
        </button>

    </div>

</header>


<div class="container">

    <div class="card">

        <div class="resumo">

            <div class="resumo-box">
                Total
                <strong id="totalCompras">0</strong>
            </div>

            <div class="resumo-box">
                Pendentes
                <strong id="totalPendentes">0</strong>
            </div>

            <div class="resumo-box">
                Pagos
                <strong id="totalPagos">0</strong>
            </div>

            <div class="resumo-box">
                Cancelados
                <strong id="totalCancelados">0</strong>
            </div>

        </div>

    </div>


    <div class="card">

        <h2>🔎 Pesquisar pagamentos</h2>

        <div class="filtros">

            <input
                type="text"
                id="pesquisa"
                placeholder="Nome, e-mail, produto ou código...">

            <select id="filtroStatus">

                <option value="">Todos os status</option>

                <option value="pendente">
                    Pendentes
                </option>

                <option value="pago">
                    Pagos
                </option>

                <option value="cancelado">
                    Cancelados
                </option>

            </select>

        </div>

        <br>

        <button
            class="btn-atualizar"
            onclick="carregar()">
            🔄 Atualizar
        </button>

    </div>


    <div class="card">

        <div id="mensagem"></div>

        <div class="tabela">

            <table>

                <thead>

                    <tr>

                        <th>Código</th>
                        <th>Aluno</th>
                        <th>Produto</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="lista">

                    <tr>
                        <td colspan="8" class="vazio">
                            Carregando pagamentos...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    runTransaction,
    increment,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",

    authDomain: "dezenas-1ed47.firebaseapp.com",

    projectId: "dezenas-1ed47",

    storageBucket: "dezenas-1ed47.firebasestorage.app",

    messagingSenderId: "372788277555",

    appId: "1:372788277555:web:1c1a6a80adee1722b54e46",

    measurementId: "G-NMPP8PKPK3"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   ELEMENTOS
========================================================= */

const lista =
    document.getElementById("lista");

const pesquisa =
    document.getElementById("pesquisa");

const filtroStatus =
    document.getElementById("filtroStatus");

const mensagem =
    document.getElementById("mensagem");

const totalCompras =
    document.getElementById("totalCompras");

const totalPendentes =
    document.getElementById("totalPendentes");

const totalPagos =
    document.getElementById("totalPagos");

const totalCancelados =
    document.getElementById("totalCancelados");


/* =========================================================
   VARIÁVEIS
========================================================= */

let compras = [];


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapar(valor){

    if(valor === null || valor === undefined){
        return "";
    }

    return String(valor)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   FORMATAR VALOR
========================================================= */

function formatarValor(valor){

    const numero = Number(valor || 0);

    return numero.toLocaleString("pt-BR",{
        style:"currency",
        currency:"BRL"
    });

}


/* =========================================================
   FORMATAR DATA
========================================================= */

function formatarData(timestamp){

    if(!timestamp){
        return "-";
    }

    try{

        const data = timestamp.toDate();

        return data.toLocaleString("pt-BR");

    }catch(error){

        return "-";

    }

}


/* =========================================================
   MOSTRAR MENSAGEM
========================================================= */

function mostrarMensagem(texto,tipo="info"){

    mensagem.innerHTML = `
        <div class="${tipo}">
            ${texto}
        </div>
    `;

}


/* =========================================================
   CARREGAR COMPRAS
========================================================= */

async function carregar(){

    lista.innerHTML = `
        <tr>
            <td colspan="8" class="vazio">
                ⏳ Carregando pagamentos...
            </td>
        </tr>
    `;

    mensagem.innerHTML = "";

    try{

        const snapshot =
            await getDocs(collection(db,"compras"));

        compras = [];

        snapshot.forEach(item => {

            compras.push({
                id:item.id,
                ...item.data()
            });

        });


        console.log(
            "Quantidade de compras encontradas:",
            compras.length
        );


        compras.sort((a,b)=>{

            const dataA =
                a.criadoEm?.toMillis?.() || 0;

            const dataB =
                b.criadoEm?.toMillis?.() || 0;

            return dataB - dataA;

        });


        atualizarResumo();

        renderizar();


    }catch(error){

        console.error(
            "Erro ao carregar compras:",
            error
        );

        lista.innerHTML = `
            <tr>
                <td colspan="8">

                    <div class="erro">

                        <strong>
                            ❌ Erro ao carregar os pagamentos
                        </strong>

                        <br><br>

                        ${escapar(error.message)}

                    </div>

                </td>
            </tr>
        `;

    }

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo(){

    const pendentes =
        compras.filter(
            item => item.status === "pendente"
        ).length;

    const pagos =
        compras.filter(
            item => item.status === "pago"
        ).length;

    const cancelados =
        compras.filter(
            item => item.status === "cancelado"
        ).length;


    totalCompras.textContent =
        compras.length;

    totalPendentes.textContent =
        pendentes;

    totalPagos.textContent =
        pagos;

    totalCancelados.textContent =
        cancelados;

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar(){

    const texto =
        pesquisa.value
            .trim()
            .toLowerCase();

    const status =
        filtroStatus.value;


    const filtradas =
        compras.filter(compra => {

            const nome =
                String(compra.nomeUsuario || "")
                .toLowerCase();

            const email =
                String(compra.emailUsuario || "")
                .toLowerCase();

            const produto =
                String(compra.produtoNome || "")
                .toLowerCase();

            const codigo =
                String(compra.codigo || "")
                .toLowerCase();

            const correspondeTexto =
                !texto ||
                nome.includes(texto) ||
                email.includes(texto) ||
                produto.includes(texto) ||
                codigo.includes(texto);

            const correspondeStatus =
                !status ||
                compra.status === status;

            return
                correspondeTexto &&
                correspondeStatus;

        });


    if(filtradas.length === 0){

        lista.innerHTML = `
            <tr>
                <td colspan="8" class="vazio">

                    Nenhum pagamento encontrado.

                </td>
            </tr>
        `;

        return;

    }


    lista.innerHTML =
        filtradas.map(compra => {

            const statusAtual =
                compra.status || "pendente";


            let classeStatus =
                "status-pendente";


            if(statusAtual === "pago"){
                classeStatus =
                    "status-pago";
            }

            if(statusAtual === "cancelado"){
                classeStatus =
                    "status-cancelado";
            }


            let botoes = "";


            if(statusAtual === "pendente"){

                botoes = `

                    <button
                        class="btn-pagar"
                        onclick="confirmarPagamento('${escapar(compra.id)}')">

                        ✓ Confirmar

                    </button>

                    <button
                        class="btn-cancelar"
                        onclick="cancelarPagamento('${escapar(compra.id)}')">

                        ✕ Cancelar

                    </button>

                `;

            }else{

                botoes = "-";

            }


            return `

                <tr>

                    <td>
                        <strong>
                            ${escapar(compra.codigo || compra.id)}
                        </strong>
                    </td>


                    <td>

                        ${escapar(compra.nomeUsuario || "-")}

                        <br>

                        <small>
                            ${escapar(compra.emailUsuario || "")}
                        </small>

                    </td>


                    <td>
                        ${escapar(compra.produtoNome || "-")}
                    </td>


                    <td>
                        ${escapar(compra.tipo || "-")}
                    </td>


                    <td>
                        ${formatarValor(compra.valor)}
                    </td>


                    <td>

                        <span class="status ${classeStatus}">

                            ${escapar(statusAtual)}

                        </span>

                    </td>


                    <td>
                        ${formatarData(compra.criadoEm)}
                    </td>


                    <td>

                        <div class="acoes">

                            ${botoes}

                        </div>

                    </td>

                </tr>

            `;

        }).join("");

}


/* =========================================================
   CONFIRMAR PAGAMENTO
========================================================= */

window.confirmarPagamento =
async function(id){

    const compra =
        compras.find(item => item.id === id);


    if(!compra){

        alert(
            "Pagamento não encontrado."
        );

        return;

    }


    if(compra.status !== "pendente"){

        alert(
            "Este pagamento não está pendente."
        );

        return;

    }


    const confirmar =
        confirm(
            `Confirmar pagamento?\n\n` +
            `Aluno: ${compra.nomeUsuario || "-"}\n` +
            `Produto: ${compra.produtoNome || "-"}\n` +
            `Valor: ${formatarValor(compra.valor)}`
        );


    if(!confirmar){
        return;
    }


    try{

        const compraRef =
            doc(db,"compras",id);


        /*
         * Primeiro muda o status.
         * A transação evita duas confirmações
         * simultâneas do mesmo pagamento.
         */

        await runTransaction(
            db,
            async transaction => {

                const snap =
                    await transaction.get(compraRef);


                if(!snap.exists()){

                    throw new Error(
                        "Compra não encontrada."
                    );

                }


                const dados =
                    snap.data();


                if(dados.status !== "pendente"){

                    throw new Error(
                        "Este pagamento já foi processado."
                    );

                }


                transaction.update(
                    compraRef,
                    {
                        status:"pago",
                        pagoEm:serverTimestamp()
                    }
                );

            }
        );


        /*
         * Depois do pagamento confirmado,
         * entrega o produto.
         */

        await entregarProduto(
            id,
            compra
        );


        alert(
            "Pagamento confirmado e produto entregue com sucesso!"
        );


        await carregar();


    }catch(error){

        console.error(
            "Erro ao confirmar pagamento:",
            error
        );

        alert(
            "Erro ao confirmar pagamento:\n\n" +
            error.message
        );

    }

};


/* =========================================================
   ENTREGAR PRODUTO
========================================================= */

async function entregarProduto(
    compraId,
    compra
){

    const tipo =
        compra.tipo;


    const usuarioId =
        compra.usuarioId;


    if(!usuarioId){

        throw new Error(
            "A compra não possui usuarioId."
        );

    }


    const usuarioRef =
        doc(db,"usuarios",usuarioId);


    /*
     * VIDAS INFINITAS
     */

    if(tipo === "vidas_infinitas"){

        await updateDoc(
            usuarioRef,
            {
                vidasInfinitas:true,
                atualizadoEm:serverTimestamp()
            }
        );

    }


    /*
     * XP
     */

    else if(tipo === "xp"){

        const nomeProduto =
            String(
                compra.produtoNome || ""
            ).toLowerCase();


        let quantidade = 100;


        if(
            nomeProduto.includes("500")
        ){

            quantidade = 500;

        }


        await updateDoc(
            usuarioRef,
            {
                xp:increment(quantidade),
                atualizadoEm:serverTimestamp()
            }
        );

    }


    /*
     * MOEDAS
     */

    else if(tipo === "moedas"){

        const nomeProduto =
            String(
                compra.produtoNome || ""
            ).toLowerCase();


        let quantidade = 100;


        if(
            nomeProduto.includes("500")
        ){

            quantidade = 500;

        }


        await updateDoc(
            usuarioRef,
            {
                moedas:increment(quantidade),
                atualizadoEm:serverTimestamp()
            }
        );

    }


    /*
     * CURSO
     *
     * Não precisa alterar o usuário.
     * O acesso ao curso é verificado
     * através da compra paga.
     */

    else if(tipo === "curso"){

        console.log(
            "Curso liberado pela compra:",
            compra.cursoId
        );

    }


    /*
     * CERTIFICADO
     *
     * Também não precisa alterar o usuário.
     * A página do certificado verifica
     * a compra paga.
     */

    else if(tipo === "certificado"){

        console.log(
            "Certificado liberado:",
            compra.cursoId
        );

    }


    /*
     * MARCAR COMO ENTREGUE
     */

    const compraRef =
        doc(db,"compras",compraId);


    await updateDoc(
        compraRef,
        {
            entregueEm:serverTimestamp()
        }
    );

}


/* =========================================================
   CANCELAR PAGAMENTO
========================================================= */

window.cancelarPagamento =
async function(id){

    const compra =
        compras.find(item => item.id === id);


    if(!compra){

        alert(
            "Pagamento não encontrado."
        );

        return;

    }


    if(compra.status !== "pendente"){

        alert(
            "Este pagamento já foi processado."
        );

        return;

    }


    const confirmar =
        confirm(
            `Cancelar este pagamento?\n\n` +
            `Aluno: ${compra.nomeUsuario || "-"}\n` +
            `Produto: ${compra.produtoNome || "-"}`
        );


    if(!confirmar){
        return;
    }


    try{

        const compraRef =
            doc(db,"compras",id);


        await runTransaction(
            db,
            async transaction => {

                const snap =
                    await transaction.get(compraRef);


                if(!snap.exists()){

                    throw new Error(
                        "Compra não encontrada."
                    );

                }


                const dados =
                    snap.data();


                if(dados.status !== "pendente"){

                    throw new Error(
                        "Este pagamento já foi processado."
                    );

                }


                transaction.update(
                    compraRef,
                    {
                        status:"cancelado",
                        canceladoEm:serverTimestamp()
                    }
                );

            }
        );


        alert(
            "Pagamento cancelado."
        );


        await carregar();


    }catch(error){

        console.error(
            "Erro ao cancelar:",
            error
        );

        alert(
            "Erro ao cancelar pagamento:\n\n" +
            error.message
        );

    }

};


/* =========================================================
   PESQUISA
========================================================= */

pesquisa.addEventListener(
    "input",
    renderizar
);


filtroStatus.addEventListener(
    "change",
    renderizar
);


/* =========================================================
   AUTENTICAÇÃO + ADMIN
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "../index.html";

            return;

        }


        try{

            const usuarioRef =
                doc(db,"usuarios",user.uid);


            const usuarioSnap =
                await getDoc(usuarioRef);


            if(!usuarioSnap.exists()){

                alert(
                    "Perfil de usuário não encontrado."
                );

                window.location.href =
                    "../index.html";

                return;

            }


            const usuario =
                usuarioSnap.data();


            if(usuario.tipo !== "admin"){

                alert(
                    "Acesso negado. Somente administradores."
                );

                window.location.href =
                    "../index.html";

                return;

            }


            console.log(
                "Administrador autorizado:",
                user.email
            );


            await carregar();


        }catch(error){

            console.error(
                "Erro na verificação do administrador:",
                error
            );


            lista.innerHTML = `

                <tr>

                    <td colspan="8">

                        <div class="erro">

                            <strong>
                                ❌ Não foi possível verificar o acesso administrativo.
                            </strong>

                            <br><br>

                            ${escapar(error.message)}

                        </div>

                    </td>

                </tr>

            `;

        }

    }
);

</script>

</body>
</html>
