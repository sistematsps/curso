<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagamentos</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.filtros{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input,
select{
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

input{
    flex:1;
    min-width:220px;
}

.tabela{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f9fafb;
}

.badge{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    display:inline-block;
}

.pendente{
    background:#fef3c7;
    color:#92400e;
}

.pago{
    background:#dcfce7;
    color:#166534;
}

.cancelado{
    background:#fee2e2;
    color:#991b1b;
}

.btn{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    cursor:pointer;
    font-weight:bold;
    margin:2px;
}

.btn-pagar{
    background:#16a34a;
    color:white;
}

.btn-cancelar{
    background:#dc2626;
    color:white;
}

.btn-voltar{
    background:#e5e7eb;
}

.mensagem{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:20px;
}

.sucesso{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.erro{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.vazio{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

</style>

</head>

<body>

<header>

<h1>💳 Pagamentos</h1>

</header>


<div class="container">

    <div class="card">

        <div class="filtros">

            <input
                id="pesquisa"
                placeholder="Pesquisar aluno, código ou produto...">

            <select id="filtroStatus">

                <option value="todos">
                    Todos
                </option>

                <option value="pendente">
                    Pendentes
                </option>

                <option value="pago">
                    Pagos
                </option>

                <option value="cancelado">
                    Cancelados
                </option>

            </select>

        </div>

    </div>


    <div
        id="mensagem"
        class="mensagem">
    </div>


    <div class="card">

        <div class="tabela">

            <table>

                <thead>

                    <tr>

                        <th>Código</th>
                        <th>Aluno</th>
                        <th>Produto</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="lista">

                </tbody>

            </table>

        </div>

    </div>


    <button
        class="btn btn-voltar"
        onclick="window.location.href='admin.html'">

        ← Voltar para administração

    </button>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    increment,
    serverTimestamp,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDb7TNycHN1zfWpHaSPYLoIBmI2vpLFXY8",

    authDomain:
        "dezenas-1ed47.firebaseapp.com",

    projectId:
        "dezenas-1ed47",

    storageBucket:
        "dezenas-1ed47.firebasestorage.app",

    messagingSenderId:
        "372788277555",

    appId:
        "1:372788277555:web:1c1a6a80adee1722b54e46",

    measurementId:
        "G-NMPP8PKPK3"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


let pagamentos = [];


const lista =
    document.getElementById("lista");

const pesquisa =
    document.getElementById("pesquisa");

const filtroStatus =
    document.getElementById("filtroStatus");

const mensagem =
    document.getElementById("mensagem");


/* =========================================
   MENSAGEM
========================================= */

function mostrarMensagem(
    texto,
    tipo
){

    mensagem.textContent =
        texto;

    mensagem.className =
        "mensagem " + tipo;

}


/* =========================================
   MOEDA
========================================= */

function dinheiro(valor){

    return Number(valor || 0)
        .toLocaleString(
            "pt-BR",
            {
                style:"currency",
                currency:"BRL"
            }
        );

}


/* =========================================
   DATA
========================================= */

function dataFormatada(timestamp){

    if(!timestamp){

        return "-";

    }


    try{

        return timestamp
            .toDate()
            .toLocaleString("pt-BR");

    }catch(e){

        return "-";

    }

}


/* =========================================
   ESCAPAR
========================================= */

function escapar(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   CARREGAR
========================================= */

async function carregar(){

    const snap =
        await getDocs(
            collection(
                db,
                "compras"
            )
        );


    pagamentos =
        snap.docs.map(
            d => ({
                id:d.id,
                ...d.data()
            })
        );


    pagamentos.sort(
        (a,b)=>{

            const da =
                a.criadoEm?.toMillis?.() || 0;

            const dbb =
                b.criadoEm?.toMillis?.() || 0;

            return dbb - da;

        }
    );


    renderizar();

}


/* =========================================
   RENDERIZAR
========================================= */

function renderizar(){

    const texto =
        pesquisa.value
            .toLowerCase()
            .trim();


    const status =
        filtroStatus.value;


    const filtrados =
        pagamentos.filter(p=>{

            const correspondeTexto =

                !texto ||

                String(
                    p.nomeUsuario || ""
                )
                .toLowerCase()
                .includes(texto) ||

                String(
                    p.codigo || ""
                )
                .toLowerCase()
                .includes(texto) ||

                String(
                    p.produtoNome || ""
                )
                .toLowerCase()
                .includes(texto);


            const correspondeStatus =

                status === "todos" ||
                p.status === status;


            return
                correspondeTexto &&
                correspondeStatus;

        });


    if(!filtrados.length){

        lista.innerHTML = `

            <tr>

                <td colspan="8"
                    class="vazio">

                    Nenhum pagamento encontrado.

                </td>

            </tr>

        `;

        return;

    }


    lista.innerHTML =
        filtrados.map(p=>{

            let acoes = "-";


            if(
                p.status === "pendente"
            ){

                acoes = `

                    <button
                        class="btn btn-pagar"
                        onclick="confirmarPagamento('${p.id}')">

                        ✅ Confirmar

                    </button>

                    <button
                        class="btn btn-cancelar"
                        onclick="cancelarPagamento('${p.id}')">

                        ❌ Cancelar

                    </button>

                `;

            }


            return `

                <tr>

                    <td>
                        <strong>
                            ${escapar(p.codigo)}
                        </strong>
                    </td>

                    <td>
                        ${escapar(
                            p.nomeUsuario ||
                            p.emailUsuario ||
                            "-"
                        )}
                    </td>

                    <td>
                        ${escapar(
                            p.produtoNome ||
                            "-"
                        )}
                    </td>

                    <td>
                        ${escapar(
                            p.tipo ||
                            "-"
                        )}
                    </td>

                    <td>
                        ${dinheiro(p.valor)}
                    </td>

                    <td>

                        <span class="badge ${
                            p.status || "pendente"
                        }">

                            ${escapar(
                                String(
                                    p.status ||
                                    ""
                                ).toUpperCase()
                            )}

                        </span>

                    </td>

                    <td>
                        ${dataFormatada(
                            p.criadoEm
                        )}
                    </td>

                    <td>
                        ${acoes}
                    </td>

                </tr>

            `;

        }).join("");

}


/* =========================================
   CONFIRMAR PAGAMENTO
========================================= */

window.confirmarPagamento =
async function(id){

    const pagamento =
        pagamentos.find(
            p => p.id === id
        );


    if(!pagamento){

        return;

    }


    if(
        pagamento.status !== "pendente"
    ){

        alert(
            "Este pagamento não está pendente."
        );

        return;

    }


    const confirmar =
        confirm(

            "CONFIRMAR PAGAMENTO?\n\n" +

            "Aluno: " +
            (
                pagamento.nomeUsuario ||
                pagamento.emailUsuario
            ) +

            "\nProduto: " +
            pagamento.produtoNome +

            "\nValor: " +
            dinheiro(
                pagamento.valor
            ) +

            "\n\nConfirme somente após verificar o comprovante."

        );


    if(!confirmar){

        return;

    }


    try{

        /*
           Transação para impedir
           processamento duplicado.
        */

        await runTransaction(
            db,
            async transaction => {

                const compraRef =
                    doc(
                        db,
                        "compras",
                        id
                    );


                const compraSnap =
                    await transaction.get(
                        compraRef
                    );


                if(!compraSnap.exists()){

                    throw new Error(
                        "Compra não encontrada."
                    );

                }


                const dados =
                    compraSnap.data();


                if(
                    dados.status !== "pendente"
                ){

                    throw new Error(
                        "Esta compra já foi processada."
                    );

                }


                transaction.update(
                    compraRef,
                    {

                        status:
                            "pago",

                        pagoEm:
                            serverTimestamp()

                    }
                );

            }
        );


        /*
           Depois da confirmação,
           fazemos a entrega.
        */

        await entregarProduto(
            pagamento
        );


        mostrarMensagem(
            "Pagamento confirmado e produto entregue.",
            "sucesso"
        );


        await carregar();


    }catch(error){

        console.error(error);


        mostrarMensagem(
            error.message ||
            "Erro ao confirmar pagamento.",
            "erro"
        );


        await carregar();

    }

};


/* =========================================
   ENTREGA
========================================= */

async function entregarProduto(
    pagamento
){

    const compraRef =
        doc(
            db,
            "compras",
            pagamento.id
        );


    const compraSnap =
        await getDoc(
            compraRef
        );


    if(!compraSnap.exists()){

        throw new Error(
            "Compra não encontrada."
        );

    }


    const compraAtual =
        compraSnap.data();


    /*
       PROTEÇÃO CONTRA DUPLICIDADE
    */

    if(compraAtual.entregueEm){

        return;

    }


    const usuarioRef =
        doc(
            db,
            "usuarios",
            pagamento.usuarioId
        );


    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    if(!usuarioSnap.exists()){

        throw new Error(
            "Usuário não encontrado."
        );

    }


    const tipo =
        pagamento.tipo;


    /* =====================================
       VIDAS INFINITAS
    ===================================== */

    if(
        tipo === "vidas_infinitas"
    ){

        await updateDoc(

            usuarioRef,

            {

                vidasInfinitas:
                    true,

                atualizadoEm:
                    serverTimestamp()

            }

        );

    }


    /* =====================================
       XP
    ===================================== */

    else if(
        tipo === "xp"
    ){

        let quantidade = 0;


        if(
            pagamento.produtoNome
                ?.includes("100 XP")
        ){

            quantidade = 100;

        }

        else if(
            pagamento.produtoNome
                ?.includes("500 XP")
        ){

            quantidade = 500;

        }


        if(quantidade > 0){

            await updateDoc(

                usuarioRef,

                {

                    xp:
                        increment(
                            quantidade
                        ),

                    atualizadoEm:
                        serverTimestamp()

                }

            );

        }

    }


    /* =====================================
       MOEDAS
    ===================================== */

    else if(
        tipo === "moedas"
    ){

        let quantidade = 0;


        if(
            pagamento.produtoNome
                ?.includes("100 Moedas")
        ){

            quantidade = 100;

        }

        else if(
            pagamento.produtoNome
                ?.includes("500 Moedas")
        ){

            quantidade = 500;

        }


        if(quantidade > 0){

            await updateDoc(

                usuarioRef,

                {

                    moedas:
                        increment(
                            quantidade
                        ),

                    atualizadoEm:
                        serverTimestamp()

                }

            );

        }

    }


    /*
       CURSO

       A própria coleção compras
       libera o acesso.
    */

    else if(
        tipo === "curso"
    ){

        /*
           Nenhuma alteração adicional.
        */

    }


    /*
       CERTIFICADO

       A existência da compra
       paga libera o certificado.
    */

    else if(
        tipo === "certificado"
    ){

        /*
           Nenhuma alteração adicional.
        */

    }


    /*
       MARCAR COMO ENTREGUE
    */

    await updateDoc(

        compraRef,

        {

            entregueEm:
                serverTimestamp()

        }

    );

}


/* =========================================
   CANCELAR
========================================= */

window.cancelarPagamento =
async function(id){

    const pagamento =
        pagamentos.find(
            p => p.id === id
        );


    if(!pagamento){

        return;

    }


    if(
        pagamento.status !== "pendente"
    ){

        return;

    }


    if(
        !confirm(
            "Deseja cancelar este pagamento?"
        )
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "compras",
                id
            ),

            {

                status:
                    "cancelado",

                canceladoEm:
                    serverTimestamp()

            }

        );


        mostrarMensagem(
            "Pagamento cancelado.",
            "sucesso"
        );


        await carregar();


    }catch(error){

        console.error(error);

        mostrarMensagem(
            "Erro ao cancelar pagamento.",
            "erro"
        );

    }

};


/* =========================================
   FILTROS
========================================= */

pesquisa.addEventListener(
    "input",
    renderizar
);

filtroStatus.addEventListener(
    "change",
    renderizar
);


/* =========================================
   AUTENTICAÇÃO
========================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        await carregar();

    }
);

</script>

</body>

</html>
```
